t classified as:\",\"Global macro\",\"Event-driven\",\"Relative value\",\"Top-down directional trades on rates, currencies and indices from macro views is the global macro mandate.\"],\n[\"Fund Z is best classified as:\",\"Event-driven (merger arbitrage)\",\"Equity market neutral\",\"Distressed securities\",\"Long target / short acquirer at the exchange ratio captures the deal spread and loses if the deal breaks - the canonical merger-arbitrage (event-driven) trade.\"]]},\n{id:\"l3m2-e6\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 6 - The endowment's spending rule (Portfolio Management)\",vig:\"A university endowment holds 440 million rupees today; the prior two year-ends were 400 and 420 million. Its rule: spend 5% of the trailing three-year average market value. Investment office debates smoothing rules, the inflation-plus-spending return requirement, and whether a higher equity allocation is warranted given the university's other income.\",\nqs:null,parts:[\n{prompt:\"A. Calculate next year's spending distribution. (4 points)\",points:4,model:\"Three-year average = (440 + 400 + 420)/3 = 420 million. Spending = 5% x 420 = 21.0 million. Using the trailing average smooths the distribution versus 5% of the current 440 (which would be 22.0).\",keys:[\"Averages 440, 400, 420 to get 420\",\"Applies 5% to the average = 21.0 million\",\"Notes smoothing vs 5% of current value (22.0)\",\"Correct arithmetic\"]},\n{prompt:\"B. State the endowment's nominal return requirement if inflation is expected at 4% and investment management costs are 0.6%. (4 points)\",points:4,model:\"Must cover spending 5% + inflation 4% + costs 0.6% while preserving real value: additive = 9.6%; geometric = 1.05 x 1.04 x 1.006 - 1 = 9.86%. Stating the objective as 'preserve purchasing power while funding the spending rule' earns credit with either convention if the components are right.\",keys:[\"Includes the 5% spending rate\",\"Adds 4% inflation (purchasing-power preservation)\",\"Adds 0.6% management costs\",\"9.6% additive (9.86% geometric)\"]},\n{prompt:\"C. Give TWO factors that raise this endowment's ability to bear risk. (4 points)\",points:4,model:\"Any two: (1) Perpetual horizon - no terminal liability date, so it can ride out long drawdowns. (2) Spending is a modest, smoothed share of assets (5% of a rolling average), so a down year does not force distress selling. (3) The university has other revenue (fees, grants, donations), so operations do not depend entirely on the endowment. (4) Alumni giving can rise in stress.\",keys:[\"Perpetual/indefinite horizon\",\"Smoothed spending rule cushions bad years\",\"Other university revenue sources reduce dependence\",\"Any two clearly tied to ability, not willingness\"]}]},\n{id:\"l3m2-e7\",sess:2,kind:\"essay\",t:\"equity\",title:\"Essay 7 - Active or just expensive (Equity)\",vig:\"Trustees review 'active' manager Trident Equity: tracking error 1.5%, active share 25%, fee 0.9%. A rival, Kaveri Alpha: tracking error 5%, active share 85%, fee 1.1%. The benchmark is the broad market index.\",\nqs:null,parts:[\n{prompt:\"A. Using active share and tracking error, characterize each manager. (4 points)\",points:4,model:\"Trident: low active share (25%) and low tracking error (1.5%) = a closet indexer - charges active fees for a portfolio barely different from the benchmark. Kaveri: high active share (85%) and high tracking error (5%) = genuinely active stock selection (concentrated or factor-diversified active, depending on how the tracking error decomposes).\",keys:[\"Trident identified as closet indexer\",\"Kaveri identified as truly active\",\"Uses BOTH metrics, not one\",\"Notes fees relative to activity\"]},\n{prompt:\"B. Explain what additional decomposition separates 'concentrated stock picker' from 'diversified factor bettor' among high-active-share managers. (4 points)\",points:4,model:\"Decompose tracking error into active factor risk (systematic tilts - value, size, momentum) versus active specific risk (idiosyncratic stock bets). High active share with mostly SPECIFIC risk = concentrated stock picking; high active share with mostly FACTOR risk = a diversified systematic tilt - more replicable and arguably worth a lower fee. Active share alone cannot see this.\",keys:[\"Splits tracking error into factor vs specific risk\",\"Specific risk -> stock picker\",\"Factor risk -> systematic tilts\",\"Connects the decomposition to fee justification\"]},\n{prompt:\"C. Can Trident's 0.9% fee be justified? Answer in two sentences. (4 points)\",points:4,model:\"No: a closet indexer delivering near-benchmark exposure cannot justify 0.9% when the index itself costs a fraction of that - its expected net-of-fee alpha is structurally negative. Active fees are only defensible with genuine active risk (like Kaveri's 85% active share) AND a process the trustees believe adds more than the fee.\",keys:[\"Trident's fee cannot be justified\",\"Compares against cheap index alternative\",\"Links fee justification to genuine active risk\",\"Net-of-fee alpha framing\"]}]},\n{id:\"l3m2-e8\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 8 - One number for risk (Portfolio Management)\",vig:\"Risk officer Asha Nair reports on a 100 million rupee portfolio: daily volatility 1.2%. She presents a 1-day 5% VaR using 1.65 as the standard-normal multiplier, and fields questions on its meaning, expected shortfall, and VaR's limits.\",\nqs:null,parts:[\n{prompt:\"A. Calculate the 1-day 5% VaR in rupees and in percent. (4 points)\",points:4,model:\"VaR = 1.65 x 1.2% x 100,000,000 = 1.65 x 1,200,000 = 1,980,000 rupees, i.e. 1.98% of the portfolio. On roughly 5% of days (about 1 in 20), losses are expected to EXCEED this.\",keys:[\"Uses 1.65 x daily vol\",\"1.65 x 1.2% = 1.98%\",\"1.98 million rupees\",\"Interprets the 5% exceedance correctly\"]},\n{prompt:\"B. The board asks: 'So we can never lose more than 1.98 million in a day?' Correct the statement and name the metric that answers their real question. (4 points)\",points:4,model:\"Wrong: VaR is a threshold, not a maximum - 5% of days lose MORE, and VaR says nothing about how much more. Expected shortfall (conditional VaR) answers their question: the AVERAGE loss given the threshold is breached. Tails, not thresholds, are what hurt.\",keys:[\"Corrects the 'maximum loss' misreading\",\"VaR is a quantile, not a cap\",\"Names expected shortfall / CVaR\",\"Defines ES as average loss beyond the threshold\"]},\n{prompt:\"C. List TWO limitations of VaR as computed here. (4 points)\",points:4,model:\"Any two: (1) Normality assumption understates fat tails in real returns. (2) Volatility and correlations are estimated from history and spike in crises (instability/regime change). (3) VaR ignores liquidity - the 1-day horizon assumes positions can be unwound at modeled prices. (4) It says nothing about tail severity (no sub-additivity concerns need be named, but they accept 'does not describe the tail').\",keys:[\"Fat tails / non-normality\",\"Unstable estimated parameters in crises\",\"Liquidity/horizon assumption\",\"Any two real limitations\"]}]},\n{id:\"l3m2-e9\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 9 - The cost of trading (Portfolio Management / Trading)\",vig:\"Manager Farhan Ali's desk decides to buy 2 million shares when the decision price is 100.00. Over the day they fill at an average of 100.30, paying 0.10 per share in commissions and fees. The stock closes at 100.50.\",\nqs:null,parts:[\n{prompt:\"A. Calculate the implementation shortfall per share and in basis points of the decision price. (4 points)\",points:4,model:\"Execution component = (100.30 - 100.00) + 0.10 = 0.40 per share = 40 bp of the 100.00 decision price. (Full IS also includes opportunity cost for unfilled shares; here the order filled completely, so 40 bp is the realized shortfall.)\",keys:[\"Price impact 0.30 + fees 0.10 = 0.40\",\"40 bp of decision price\",\"Notes opportunity cost would add if unfilled\",\"Per-share framing\"]},\n{prompt:\"B. Compare a VWAP-participation approach with an aggressive front-loaded approach for this order - one advantage of each. (4 points)\",points:4,model:\"VWAP/participation: spreads the trade with the day's volume, minimizing market impact and hiding intent - at the cost of exposure to price drift while working the order (and VWAP can be gamed late in the day). Aggressive front-loading: minimizes timing/opportunity risk when the manager has strong short-term alpha or expects the price to run - at the cost of larger immediate market impact. Choice depends on alpha decay versus impact cost.\",keys:[\"VWAP advantage: lower impact / stealth\",\"VWAP cost: drift exposure while working\",\"Aggressive advantage: captures decaying alpha\",\"Aggressive cost: bigger market impact\"]},\n{prompt:\"C. Name TWO tactics that reduce market impact on a large order. (4 points)\",points:4,model:\"Any two: slice the parent order into small child orders over time (participation at a low rate); use dark pools or hidden order types to avoid displaying intent; concentrate trading in the deepest liquidity windows (open/close); use limit orders rather than sweeping the book; route to venues with natural counterparties (crossing networks).\",keys:[\"Order slicing / low participation rate\",\"Dark pools or hidden orders\",\"Timing to deep-liquidity windows\",\"Any two valid tactics\"]}]},\n{id:\"l3m2-e10\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 10 - The IPS is a living document (Portfolio Management)\",vig:\"Client Rohini Desai, 45, had an IPS written two years ago when she was a salaried executive with a 15-year horizon to retirement. Since then: she inherited 12 million rupees; her employer laid her off and she started a consulting practice with irregular income; and her mother moved in, adding healthcare costs of 300,000 per year.\",\nqs:null,parts:[\n{prompt:\"A. Identify THREE IPS elements these events force you to revisit, with the trigger for each. (4 points)\",points:4,model:\"(1) Return objective / risk ability: the inheritance raises the asset base - required return falls and ability to bear risk rises. (2) Liquidity constraint: irregular consulting income plus 300,000 new healthcare costs raise the near-term liquidity reserve needed. (3) Time horizon / income stability: self-employment changes human capital - less bond-like, more equity-like and volatile, which LOWERS the financial risk the portfolio must carry, other things equal.\",keys:[\"Return objective/risk ability - inheritance\",\"Liquidity - irregular income + healthcare costs\",\"Human capital change - employment to consulting\",\"Each trigger tied to a specific life event\"]},\n{prompt:\"B. Her portfolio drifted from 60/40 to 68/32 in the equity rally. Given the new circumstances and material transaction costs, state a rebalancing policy you would write into the revised IPS. (4 points)\",points:4,model:\"Write a corridor rule rather than blind calendar rebalancing: e.g. rebalance when any allocation breaches ±5 points of target, reviewed quarterly. Apply it now: 68% breaches a 65% corridor, so rebalance toward 60/40 - using the inheritance cash flows and new healthcare reserve to direct the trade (meet the liquidity need FROM the overweight equity sleeve), which minimizes sales and costs while re-anchoring risk to the new IPS.\",keys:[\"Specifies a corridor rule with a trigger width\",\"Applies it: 68% > 65% triggers action\",\"Uses new liquidity needs to source the rebalance (cash-flow rebalancing)\",\"Notes cost awareness\"]},\n{prompt:\"C. State TWO elements of Rohini's IPS that do NOT change despite her new circumstances. (4 points)\",points:4,model:\"Acceptable answers include: the fundamental purpose - funding her retirement in real terms - is unchanged; her long-term multi-decade horizon to and through retirement remains; her willingness/attitude toward risk (a personality trait) is unchanged - it is her ABILITY and constraints that moved. Any two, clearly distinguished from the elements being revised.\",keys:[\"Retirement-funding purpose unchanged\",\"Long-term horizon survives\",\"Willingness (attitude) is stable - ability is what changed\",\"Distinguishes stable elements from revised ones\"]}]},\n{id:\"l3m2-e11\",sess:2,kind:\"essay\",t:\"ethics\",title:\"Essay 11 - The asset manager's week (Ethics / AMC)\",vig:\"Read the week at Girnar Asset Management:\\n\\nOn Monday, a star manager tells the investment committee he is 'personally certain' a holding will be upgraded and raises the position before finishing his written analysis. On Tuesday, marketing emails only the clients who lost money a 'markets are noisy, stay the course' note, while profitable clients get performance calls. On Wednesday, a junior analyst's error overstates a composite's return; the firm finds it two weeks later. On Friday, a departing employee copies client contact details 'just as insurance'.\",\nqs:null,parts:[\n{prompt:\"A. Identify the Asset Manager Code / Standards issue in EACH of the four days. (4 points)\",points:4,model:\"Monday: acting without a reasonable and adequate basis documented - diligence/basis failure (and putting action ahead of process). Tuesday: selective disclosure/fair dealing - all clients must get fair, equal communication; segmenting by who lost money is neither fair dealing nor honest communication. Wednesday: error handling - the firm must correct the record and disclose the material error to affected parties; composites and performance must be accurate. Friday: misappropriation - client records are firm property and confidential; copying them for personal use violates loyalty and confidentiality duties.\",keys:[\"Monday: diligence/reasonable basis\",\"Tuesday: fair dealing/selective communication\",\"Wednesday: error correction and accurate performance\",\"Friday: confidentiality/loyalty - client data is firm property\"]},\n{prompt:\"B. For Wednesday's error, state the firm's required response. (4 points)\",points:4,model:\"Promptly correct the error, restate the affected composite history, disclose the correction to all who received the original figures (not only those who ask), and review the process that let the error through. GIPS-style error correction treats material errors as requiring restatement and disclosure; silence compounds a data mistake into a misrepresentation.\",keys:[\"Correct and restate promptly\",\"Disclose to all recipients of the original\",\"Fix the underlying process\",\"Recognizes silence converts error into misrepresentation\"]},\n{prompt:\"C. For Friday's departing employee, state TWO actions the firm should take. (4 points)\",points:4,model:\"Any two: instruct the employee in writing that client records are firm property and demand return/deletion of all copies; review and tighten access controls (least-privilege, download logging, exit checklists); remind him that confidentiality obligations survive employment; assess whether clients or regulators must be informed under local rules if the data left the firm.\",keys:[\"Written demand to return/delete copied records\",\"Access-control and exit-process review\",\"Post-employment confidentiality reminder\",\"Any two concrete firm actions\"]}]}\n];\n\n// ===================== CFA LEVEL III - MOCK 3, SESSION 1 (6 item sets + 5 essay sets, 132 points) =====================\n// Fresh content; Mock 1 and 2 sub-topics not repeated. Numbers verified. Item-set correct answers stored first (engine shuffles deterministically).\nvar L3_SETS_S5=[\n{id:\"l3s5-e-pm-behav\",sess:1,kind:\"essay\",t:\"pm\",title:\"Essay 1 - The biases in the room (Behavioral Finance)\",vig:\"An advisor reviews two clients.\\n\\nClient A, a retired surgeon, holds 60% of his portfolio in his old hospital employer's stock. He says: 'I know this company. I watched it grow for 30 years. Selling now, after it fell 20% from its peak, would mean admitting I was wrong to hold it.'\\n\\nClient B, a young tech founder, trades weekly. Last year she made 40 round-trip trades. She says: 'My instincts about the market have been right far more often than wrong. The data apps agree with my read most of the time.' Her record shows a 4% annual return versus 11% for the index she trades against.\",\nparts:[{prompt:\"A. Identify TWO distinct behavioral biases shown by Client A, citing the case evidence for each. (4 points)\",points:4,model:\"Any two of: (1) Loss aversion / disposition effect - refusing to sell after a 20% fall because selling 'admits' the loss. (2) Familiarity bias - 60% in the employer's stock because he 'knows' the company. (3) Anchoring - measuring the decision against the old peak price. (4) Regret aversion - avoiding the sale to avoid admitting error. Each bias must be tied to its case quote.\",keys:[\"Loss aversion/disposition effect tied to the refusal to sell at a loss\",\"Familiarity/employer-stock concentration or anchoring to the peak\",\"Each bias supported by a specific case quote\",\"The two biases are distinct, not restatements\"]},\n{prompt:\"B. For EACH of Client A's two biases, state whether it is primarily cognitive or emotional, and whether the advisor should adapt to it or moderate it. (4 points)\",points:4,model:\"Loss aversion and regret aversion are emotional - adapt: accommodate within the plan (e.g., a staged reduction schedule) because arguing rarely removes them. Familiarity bias and anchoring are cognitive - moderate: educate with evidence (concentration risk math, employer-stock double exposure of human and financial capital). The standard rule: adapt to emotional biases, moderate cognitive ones, especially for a high-wealth client whose standard-of-living risk is real.\",keys:[\"Classifies each bias correctly as cognitive or emotional\",\"Pairs emotional biases with adapt, cognitive with moderate\",\"Gives a reason for the pairing (education works on cognitive errors)\"]},\n{prompt:\"C. Client B shows overconfidence. Using the case facts, explain the portfolio damage and ONE process change that would limit it. (4 points)\",points:4,model:\"Damage: 40 trades produced 4% versus 11% for the index - overconfidence drives excessive trading, and costs plus poor timing cost her 7 points a year; selective memory ('right more often than wrong') is self-attribution bias protecting the belief. Process change (any one): impose a written trading rule or cooling-off period; pre-commit to an IPS with rebalancing bands; track every trade's cost and outcome against the index in a log the advisor reviews quarterly - making the underperformance undeniable.\",keys:[\"Uses the 4% vs 11% record as the evidence of damage\",\"Names excessive trading / self-attribution as the mechanism\",\"Proposes a concrete process change (IPS rule, trading log, cooling-off)\"]}]},\n{id:\"l3s5-i-deriv-swap\",sess:1,kind:\"mcq\",t:\"deriv\",title:\"Vignette 1 - A swap to fix the duration (Derivatives)\",vig:\"A pension fund holds a 10 crore notional bond portfolio. It enters a 3-year interest rate swap on 10 crore notional: the fund RECEIVES a fixed rate of 6.5% and PAYS the one-year MIBOR floating rate, settled annually.\\n\\nAt the first settlement date, one-year MIBOR stands at 7.2%. The fund's motive: its portfolio duration of 5.5 years is too high for its liability schedule, and it wants to reduce interest rate sensitivity without selling bonds.\",\nqs:[[\"At the first settlement, the cash flow on the swap is:\",\"The fund pays 7 lakh - the net of 7.2% paid versus 6.5% received on 10 crore\",\"The fund receives 7 lakh\",\"The fund pays 72 lakh\",\"Net settlement = (floating 7.2% - fixed 6.5%) x 10 crore = 0.7% x 10 crore = 7 lakh. The fund pays floating, so when floating exceeds the fixed rate, the fund pays the difference.\"],\n[\"Receiving fixed on the swap changes the portfolio's interest rate sensitivity by:\",\"REDUCING net duration - the position behaves like owning a floater and being short a fixed-rate bond, so falling rates now hurt the swap leg\",\"Increasing net duration, because the fund now holds two fixed-income exposures\",\"Leaving duration unchanged, since no principal moves\",\"A receive-fixed/pay-floating swap is economically long a floating-rate note and short a fixed-rate bond: its value falls when rates FALL. Added to the long bond portfolio, it cancels part of the portfolio's rate sensitivity - exactly the fund's goal of lowering duration without selling.\"],\n[\"At inception, with the swap priced at par, the credit exposure between the two parties is approximately:\",\"Zero - neither side is owed anything until rates move away from the initial terms\",\"Equal to the 10 crore notional\",\"7 lakh\",\"Swaps start with zero value to both sides. Credit exposure builds only as rates move and one side becomes owed money - and even then it is a fraction of notional, because only net interest flows, never principal.\"],\n[\"Compared with selling 10 crore of bonds to cut duration, the swap route's main practical advantages are:\",\"Speed, low transaction cost, and keeping the bonds and their yield - with the trade-off of ongoing counterparty and basis exposure\",\"It is always cheaper in every rate scenario\",\"It removes all interest rate risk from the portfolio\",\"Derivatives overlay risk quickly and cheaply without disturbing the underlying holdings. The costs are real but different: counterparty exposure, possible mismatch between the swap rate and the portfolio's actual yields (basis risk), and the need to manage margin or collateral.\"]]},\n{id:\"l3s5-e-pm-inst\",sess:1,kind:\"essay\",t:\"pm\",title:\"Essay 2 - The pension plan that must catch up (Institutional Investors)\",vig:\"The Saraswati Charitable Trust pension plan has assets of 110 crore and the present value of its promised benefits is 120 crore. Benefits in payment are projected to grow 5% a year for the foreseeable future. The board wants the plan fully funded within 5 years WITHOUT additional employer contributions, and asks what return that implies and how the fund should be run.\\n\\nThe plan's actuary adds one warning: 'If markets disappoint for two or three years, the gap widens faster than the 5% growth, because pensions must still be paid.'\",\nparts:[{prompt:\"A. Calculate the current funded ratio and the annual return the assets must earn to be fully funded in exactly 5 years. Show your work. (4 points)\",points:4,model:\"Funded ratio = 110 / 120 = 91.7%. Liability in 5 years = 120 x 1.05^5 = 120 x 1.2763 = 153.2 crore. Required return = (153.2 / 110)^(1/5) - 1 = (1.3923)^(0.2) - 1 = 1.0684 - 1 = 6.84%, about 6.8% per year.\",keys:[\"Funded ratio = 110/120 = about 91.7%\",\"Grows the liability: 120 x 1.05^5 = about 153.2 crore\",\"Required return = (153.2/110)^(1/5) - 1 = about 6.8-6.9%\"]},\n{prompt:\"B. State TWO constraints specific to this pension plan that must appear in the IPS, each supported by a case fact. (4 points)\",points:4,model:\"Any two of: (1) Time horizon - the plan is ongoing with a 5-year target date for full funding, a medium horizon for this stage. (2) Liquidity - pensions must be paid every year regardless of markets, so a cash buffer or liquid sleeve is mandatory. (3) Legal/regulatory - pension funding rules and the actuarial valuation framework govern contributions and reporting. (4) Unique - the board's no-new-contributions condition removes the usual safety valve.\",keys:[\"Time horizon tied to the 5-year full-funding target and ongoing nature\",\"Liquidity tied to mandatory annual pension payments\",\"Legal/regulatory or the no-contribution condition as a valid second or third constraint\"]},\n{prompt:\"C. The actuary's warning describes a specific risk. Name it, and state TWO ways the investment policy can address it. (4 points)\",points:4,model:\"The risk is surplus risk - the danger that the asset-liability GAP (surplus of -10 crore) widens because assets fall while liabilities keep growing; paying benefits from a shrinking pool compounds it. Policy responses (any two): (1) set the risk objective relative to the LIABILITY (surplus optimization / LDI framing), not just asset volatility; (2) hold a liability-hedging bond sleeve matched to near-term pension payments; (3) define a glide path that de-risks as the funded ratio improves; (4) set a rebalancing trigger tied to funded ratio rather than asset weights alone.\",keys:[\"Names surplus risk / asset-liability mismatch explicitly\",\"Frames the risk objective against the liability (LDI/surplus logic)\",\"Adds a concrete mechanism: liability-matching bond sleeve, glide path, or funded-ratio triggers\"]}]},\n{id:\"l3s5-i-equity-active\",sess:1,kind:\"mcq\",t:\"equity\",title:\"Vignette 2 - The arithmetic of skill (Active Equity Management)\",vig:\"An analyst evaluates a stock-picker using the fundamental law of active management: IR = IC x square root of breadth x transfer coefficient. The manager's information coefficient (IC, correlation of forecasts with outcomes) is 0.10. She makes 50 independent bets a year. Her transfer coefficient (how fully constraints let her express forecasts) is 0.60.\\n\\nThe CIO asks what the law says, and whether a second manager making 200 similar bets a year is really better.\",\nqs:[[\"The manager's expected information ratio is closest to:\",\"0.42 - 0.10 x square root of 50 x 0.60\",\"0.71\",\"0.05\",\"IR = IC x root(BR) x TC = 0.10 x 7.07 x 0.60 = 0.42. Each term does real work: skill (IC), opportunity (breadth), and implementation (transfer coefficient). Dropping the transfer coefficient (0.71) overstates what a constrained portfolio can deliver.\"],\n[\"If the second manager has the same IC and transfer coefficient but 200 bets a year, his expected IR is closest to:\",\"0.85 - doubling twice the breadth doubles the root term from 7.07 to 14.14\",\"1.69 - everything doubles\",\"0.42 - breadth does not matter\",\"IR scales with the SQUARE ROOT of breadth: 0.10 x 14.14 x 0.60 = 0.85, exactly double the first manager's 0.42. Breadth multiplies by 4 while IR multiplies by 2 - the law rewards many independent bets, not just bigger ones.\"],\n[\"The transfer coefficient of 0.60 most likely reflects:\",\"Constraints - such as no-shorting rules, position limits, or benchmark hugging - blocking part of the forecast signal\",\"Random bad luck in stock selection\",\"High transaction costs on every trade\",\"The transfer coefficient measures how completely forecasts become portfolio positions. Long-only mandates and size limits systematically prevent full expression - the manager likes a stock 3% but can only act on 2%. It is about portfolio construction, not forecasting skill.\"],\n[\"A fund advertising 40 holdings that closely mirror the index while charging active fees is best described as:\",\"A closet indexer - low active share, so investors pay active fees for near-passive exposure\",\"A high-conviction manager\",\"A factor fund\",\"Closet indexing is an agency problem: the manager minimizes career risk by tracking the benchmark while charging for stock-picking. Active share exposes it. The fundamental law explains the economics: with no real bets, there is no breadth of independent forecasts to earn the fee.\"]]},\n{id:\"l3s5-e-fixed-curve\",sess:1,kind:\"essay\",t:\"fixed\",title:\"Essay 3 - Barbell versus bullet (Fixed Income Strategy)\",vig:\"A bond manager must build a 50 crore portfolio with a duration near 5. Two candidates:\\n\\nBULLET: 100% in 5-year bonds, yield 7.0%, duration 4.8, convexity 0.30.\\nBARBELL: 50% in 2-year bonds (yield 6.4%, duration 1.9) and 50% in 10-year bonds (yield 7.8%, duration 8.1), portfolio convexity 0.90.\\n\\nHer economist expects the yield curve to FLATTEN: short rates to rise 0.40% while long rates fall 0.40%.\",\nparts:[{prompt:\"A. Verify that the barbell's duration is close to 5, and compare the two portfolios' current yields. (4 points)\",points:4,model:\"Barbell duration = 0.5 x 1.9 + 0.5 x 8.1 = 0.95 + 4.05 = 5.0 - a match for the bullet's 4.8. Barbell yield = 0.5 x 6.4% + 0.5 x 7.8% = 7.1%, versus the bullet's 7.0%. The barbell gives up nothing in yield here and actually picks up 0.1%, though normally barbells yield less when the curve is steeply upward-sloping.\",keys:[\"Barbell duration = 0.5(1.9) + 0.5(8.1) = 5.0\",\"Barbell yield = 7.1% versus bullet 7.0%\",\"Notes the duration match is the whole point of the comparison\"]},\n{prompt:\"B. Under the economist's flattening forecast, which structure outperforms and why? Use the durations and the rate changes given. (4 points)\",points:4,model:\"The barbell outperforms. Its 10-year leg gains about 8.1 x 0.40% = 3.24% on that half (+1.62% on the portfolio), while its 2-year leg loses only about 1.9 x 0.40% = 0.76% on that half (-0.38% portfolio) - net gain about +1.24%. The bullet, all at the 5-year point which the forecast leaves roughly unchanged, gains almost nothing. Flattening rewards holding the two ends over the middle.\",keys:[\"Barbell wins under flattening\",\"Long leg: +8.1 x 0.40% on half the portfolio; short leg: -1.9 x 0.40% on half\",\"Bullet roughly unchanged because the 5-year point barely moves\"]},\n{prompt:\"C. The barbell's convexity is 0.90 versus the bullet's 0.30. Explain what this extra convexity is worth and when it matters. (4 points)\",points:4,model:\"Higher convexity means the barbell gains MORE than duration alone predicts when rates move sharply, and loses less - the price-yield curve bends in the investor's favor. It matters most in volatile rate environments: for small moves the two structures behave alike, but in a big rally or selloff the barbell's extra convexity (3x the bullet's) adds a cushion or a kicker. Investors usually PAY for this via lower yield - here the barbell even yields more, making it attractive if rates stay volatile.\",keys:[\"Convexity = extra gains in rallies, smaller losses in selloffs, beyond duration\",\"Matters most when rate moves are large/volatile\",\"Notes convexity is normally paid for through yield\"]}]},\n{id:\"l3s5-i-pm-trade\",sess:1,kind:\"mcq\",t:\"pm\",title:\"Vignette 3 - The cost of actually getting it done (Trade Execution)\",vig:\"A PM decides to buy 10,000 shares of Mehta Auto when the price is 500 (the decision price). The desk buys 6,000 shares at an average of 505 before the price runs away; the remaining 4,000 are cancelled with the price at 508. Fees and taxes total 6,000 rupees on the executed shares.\\n\\nThe investment committee reviews the implementation shortfall of the trade.\",\nqs:[[\"The execution (fill) cost component of the shortfall is:\",\"30,000 - (505 - 500) x 6,000 shares actually bought\",\"50,000 - (505 - 500) x 10,000\",\"6,000 - the fees\",\"Execution cost applies the price slippage only to shares actually filled: 5 x 6,000 = 30,000. Extending it to all 10,000 double-counts - the unbought 4,000 carry their own separate cost.\"],\n[\"The opportunity cost component is:\",\"32,000 - (508 - 500) x 4,000 shares never bought\",\"20,000 - (505 - 500) x 4,000\",\"Zero - shares not bought cannot lose money\",\"Opportunity cost prices the unfilled shares at the cancellation price versus the decision price: 8 x 4,000 = 32,000. The idea existed, the market moved, and the portfolio got nothing - that missed profit is a real cost of slow execution.\"],\n[\"Total implementation shortfall as a percentage of the paper portfolio (10,000 x 500) is closest to:\",\"1.36% - (30,000 + 32,000 + 6,000) on 50 lakh\",\"0.60%\",\"1.00%\",\"Total = 30,000 + 32,000 + 6,000 = 68,000 on a 50,00,000 paper portfolio = 1.36%. The paper portfolio gained nothing; the real one starts 1.36% behind - this gap is what execution desks exist to shrink.\"],\n[\"The single most effective change to reduce THIS trade's shortfall would have been:\",\"Trading with more urgency once the decision was made - the cost came from hesitation while the price ran, not from fees or spreads\",\"Trading more slowly over several days\",\"Choosing a cheaper broker\",\"Decompose the 68,000: 32,000 is opportunity cost from unexecuted shares and 30,000 is slippage on filled ones - both grew because the desk worked the order passively into a rising market. When the alpha is short-lived, urgency beats patience; fee shopping saves almost nothing by comparison.\"]]},\n{id:\"l3s5-e-alt-hf\",sess:1,kind:\"essay\",t:\"alt\",title:\"Essay 4 - Three hedge funds, three different animals (Alternative Investments)\",vig:\"A family office screens three hedge funds for a 5-crore allocation:\\n\\nFUND 1 - 'Meridian Neutral': always 100% long and 100% short equities, beta near zero, target return 9% a year in all markets.\\nFUND 2 - 'Atlas Macro': trades equity index futures, currencies, bonds and gold based on the manager's view of world events; returned +18% in the last crisis year and -8% in the calm year after.\\nFUND 3 - 'Konark Convertible': buys convertible bonds and shorts the issuing companies' stock against them, earning the bond's yield plus trading gains.\\n\\nThe family's brief: 'We want something that protects us when markets crash. We are terrified of another 2008 or 2020.'\",\nparts:[{prompt:\"A. For EACH fund, name the strategy and its primary return driver. (4 points)\",points:4,model:\"Fund 1: equity market neutral - returns come from stock selection spread (longs beating shorts), not market direction, since beta is hedged to zero. Fund 2: global macro - returns come from the manager's discretionary directional calls on macro trends across asset classes. Fund 3: convertible arbitrage - returns come from the convertible's coupon/yield plus mispricing between the convertible and the underlying equity, harvesting volatility through delta hedging.\",keys:[\"Fund 1: equity market neutral driven by selection spread, not beta\",\"Fund 2: global macro driven by discretionary directional macro views\",\"Fund 3: convertible arbitrage driven by yield plus convert-vs-equity mispricing/volatility\"]},\n{prompt:\"B. Given the family's stated brief, which fund fits BEST and which fits WORST? Justify both. (4 points)\",points:4,model:\"Best: Fund 2 (global macro) - its mandate lets it go short or defensive anywhere, and the case shows it actually delivered +18% in the last crisis; macro funds historically profit in sustained stress when trends become powerful. Worst: Fund 3 (convertible arbitrage) - it is a credit-and-liquidity trade; in 2008-style crises, credit spreads blow out, short squeezes and leverage force unwinds, and convert arb funds posted deep losses exactly when protection was needed. Fund 1 sits between: beta-hedged, but stock-selection spreads can still suffer in panics.\",keys:[\"Picks global macro for crash protection, citing the +18% crisis year or the go-anywhere mandate\",\"Picks convertible arbitrage as worst, citing credit spread/liquidity crisis mechanics\",\"Shows the reasoning is about the brief (crisis behavior), not generic returns\"]},\n{prompt:\"C. State TWO due-diligence questions specific to hedge funds that the family must ask before allocating, and why each matters. (4 points)\",points:4,model:\"Any two of: (1) Liquidity terms - lockups, gates, and notice periods: can the fund suspend redemptions exactly when the family needs the 'protection' to pay out? (2) Leverage and prime-broker arrangements - how much borrowing, and what happens if financing is pulled? (3) Transparency/valuation - are positions independently priced, especially the convertibles? (4) Key-person risk - for Fund 2 the manager IS the strategy. (5) Side pockets or illiquid holdings history.\",keys:[\"Liquidity terms (lockup/gates) tied to the protection-use conflict\",\"Leverage/financing, valuation transparency, or key-person risk as the second\",\"A reason attached to each question\"]}]},\n{id:\"l3s5-i-ethics-amc\",sess:1,kind:\"mcq\",t:\"ethics\",title:\"Vignette 4 - Running the firm by the Code (Asset Manager Code)\",vig:\"An asset management firm adopts the CFA Institute Asset Manager Code (AMC). The compliance review finds: client trades are allocated at month-end after seeing which accounts did well; soft-dollar commissions pay for the CEO's Bloomberg terminal used firm-wide; and a portfolio manager bought shares in a company two days before his funds did, at a lower price.\",\nqs:[[\"Allocating trades at month-end after performance is known violates the AMC principle requiring:\",\"Fair and equitable trade allocation - all clients must share fills pro-rata at average prices, not by hindsight\",\"Best execution\",\"Disclosure of fees\",\"Allocating after seeing outcomes lets a manager steer winners to favored accounts - cherry-picking. The AMC (and Standard III(B) Fair Dealing) requires allocation procedures fixed BEFORE trades: pro-rata fills at average price, documented in advance.\"],\n[\"The soft-dollar arrangement for the firm-wide Bloomberg terminal is:\",\"Permissible - soft dollars may pay for research and services that benefit the firm and clients generally\",\"A violation, because soft dollars may only buy reports about specific stocks\",\"Permissible only if clients never find out\",\"Soft commissions are acceptable when they buy research or services benefiting client decision-making - a market data terminal qualifies. They become abusive when used for rent, travel, or marketing, and best practice is disclosure of the arrangement either way.\"],\n[\"The manager buying shares two days ahead of his funds is:\",\"Front-running - a violation of the AMC and Standard VI(B) Priority of Transactions, because client orders must come before personal ones in the same security\",\"Acceptable, because he bought at a lower price than the funds\",\"A violation only if the amount exceeds a de minimis threshold\",\"Personal trades that take liquidity or price advantage ahead of client orders betray the duty of loyalty. The size is irrelevant; the sequence is the offense. Proper procedure: client trades first, personal trades after, with pre-clearance.\"],\n[\"The AMC differs from the Code and Standards for individual members chiefly in that it:\",\"Applies to the FIRM as an organization - policies, compliance systems, and firm-wide conduct - rather than to individual professionals\",\"Is legally enforceable by CFA Institute\",\"Applies only to firms managing more than a threshold of assets\",\"The Code and Standards bind individuals; the AMC is the parallel framework for firms: compliance support, fair dealing systems, disclosure documents, and firm-level policies. CFA Institute membership and enforcement attach to members, not legal force - the AMC is voluntary but signals firm-wide commitment.\"]]},\n{id:\"l3s5-i-pm-risk2\",sess:1,kind:\"mcq\",t:\"pm\",title:\"Vignette 5 - Where the risk actually sits (Risk Budgeting)\",vig:\"A 70/30 portfolio: 70% equities (volatility 16%, beta to the total portfolio 1.30), 30% bonds (volatility 6%, beta to the portfolio 0.30). Total portfolio volatility is 12%.\\n\\nThe board sees the 70/30 split and assumes risk is split seventy-thirty. The risk officer prepares the true decomposition: marginal contribution to risk (MCTR) = asset beta x portfolio volatility; component risk = weight x MCTR.\",\nqs:[[\"The equity component risk contribution is:\",\"10.92% - 0.70 x (1.30 x 12%)\",\"8.4% - 0.70 x 12%\",\"16% - the equity volatility\",\"MCTR of equities = 1.30 x 12% = 15.6%. Component = weight x MCTR = 70% x 15.6% = 10.92% of the portfolio's 12% total volatility - equities supply about 91% of the RISK despite being 70% of the money.\"],\n[\"The bond component risk contribution is:\",\"1.08% - 0.30 x (0.30 x 12%)\",\"3.6%\",\"6%\",\"Bond MCTR = 0.30 x 12% = 3.6%; component = 30% x 3.6% = 1.08%. Check: 10.92% + 1.08% = 12.00% - component contributions sum exactly to total portfolio volatility, which is what makes this decomposition a genuine budget.\"],\n[\"The board's seventy-thirty intuition fails because:\",\"Risk contributions depend on each asset's volatility and correlation, not just its weight - equities are far more volatile and dominate the total\",\"Bonds have no risk\",\"70/30 is actually correct for risk\",\"Weights measure money, not risk. When one asset is far more volatile and drives the portfolio's covariance, a 70% weight can carry 90%+ of the risk. Risk budgeting reallocates by risk contribution, which is the logic behind risk parity and balanced-risk approaches.\"],\n[\"To bring equities' risk share down WITHOUT selling equities, the cleanest move is:\",\"Add a low-correlation asset (e.g., bonds or alternatives) or overlay equity index futures/put options to cut equity beta\",\"Sell bonds\",\"Raise the cash weight to 50%\",\"Risk contribution falls if equity beta to the portfolio falls - diversification with low-correlation assets or a derivative overlay does that while keeping the holdings. Selling the diversifier (bonds) raises equity's share further; cash de-risks but at a heavy return cost.\"]]},\n{id:\"l3s5-e-pm-rebal\",sess:1,kind:\"essay\",t:\"pm\",title:\"Essay 5 - Putting the weights back (Rebalancing)\",vig:\"A retired couple's 3.0 crore portfolio targets 60% equity / 40% bonds. After a strong equity run, the holdings stand at: equity 2.04 crore, bonds 0.96 crore - weights 68/32.\\n\\nTheir advisor notes: 'Every extra point in equities is return you enjoyed and risk you did not sign up for. The IPS says 60/40 with a 5-point corridor. We are past the corridor now.'\\n\\nThe couple asks: what exactly should be traded, and how to think about doing this repeatedly - every quarter, or only when weights drift too far?\",\nparts:[{prompt:\"A. Calculate the trades required to return the portfolio exactly to target weights. (4 points)\",points:4,model:\"Target equity = 60% x 3.0 crore = 1.80 crore; current 2.04 crore - SELL 0.24 crore (24 lakh) of equity. Target bonds = 40% x 3.0 = 1.20 crore; current 0.96 crore - BUY 0.24 crore of bonds. The trade moves 8% of the portfolio from equity to bonds.\",keys:[\"Target equity 1.80 crore vs current 2.04 crore\",\"SELL 24 lakh equity / BUY 24 lakh bonds\",\"Recognizes this is 8% of the total portfolio\"]},\n{prompt:\"B. Compare calendar (e.g., quarterly) rebalancing with corridor (percentage-band) rebalancing, and state which fits THIS couple's IPS. (4 points)\",points:4,model:\"Calendar rebalancing trades on a fixed schedule - simple and disciplined, but it can trade when nothing needs doing and miss big mid-period drifts. Corridor rebalancing trades only when a weight breaches its band (here 60% +/- 5, i.e. 55-65%) - risk-targeted and cost-efficient, but needs monitoring. THIS IPS already specifies a 5-point corridor, and the 68% weight has breached it - corridor logic is in force, so rebalance now rather than waiting for quarter-end.\",keys:[\"Calendar = fixed schedule; corridor = trade only on band breach, with the trade-offs of each\",\"Reads the IPS: 5-point corridor around 60%\",\"Concludes the 68% breach triggers action NOW under the corridor rule\"]},\n{prompt:\"C. State TWO practical costs or frictions of rebalancing, and one way to reduce each. (4 points)\",points:4,model:\"Any two of: (1) Transaction costs - brokerage, spreads, impact; reduce by using cash flows (dividends, new money, pension withdrawals) to nudge weights instead of selling. (2) Taxes - selling appreciated equity realizes capital gains; reduce by rebalancing inside tax-advantaged accounts first or widening bands modestly. (3) Behavioral drag - selling winners feels wrong; reduce by pre-committing the corridor rule in the IPS so the decision is mechanical.\",keys:[\"Transaction costs mitigated by rebalancing with cash flows\",\"Taxes mitigated by using tax-advantaged accounts / adjusted bands\",\"Or behavioral resistance solved by pre-commitment in the IPS\"]}]},\n{id:\"l3s5-i-alt-real\",sess:1,kind:\"mcq\",t:\"alt\",title:\"Vignette 6 - Real assets and the roll (Real Assets & Commodities)\",vig:\"A family office considers two inflation hedges: a timberland fund, and a commodity futures index. The commodity strategist explains the futures index return has three parts: spot price change, roll yield, and collateral (T-bill) yield. Current data: cotton spot 100 per unit, one-year futures 102.\\n\\nThe timberland fund pitches: 'Trees grow 4% a year biologically, whatever markets do. But you can only sell a forest when a buyer shows up.'\",\nqs:[[\"With spot at 100 and one-year futures at 102, the commodity market is in contango, and the roll yield for a long futures investor is approximately:\",\"Negative 2% - the futures price must fall toward the spot as expiry nears, so a long rolls at a loss\",\"Positive 2%\",\"Zero, because nothing has happened yet\",\"In contango (futures above spot), convergence pulls the futures price DOWN toward spot as expiry approaches - a long position loses roughly (102-100)/100 = 2% to the roll even if spot is flat. Backwardation flips this into a positive roll.\"],\n[\"The total return of a long commodity FUTURES position is best decomposed as:\",\"Spot return + roll yield + collateral yield on the posted margin\",\"Spot return only\",\"Futures price change plus dividends\",\"Futures are margined, not fully funded: you earn the collateral yield on margin cash, plus the spot move, plus the roll as futures converge. Ignoring roll and collateral - the two components many investors never see - misreads years of commodity index history.\"],\n[\"The timberland fund's '4% biological growth' claim should be read as:\",\"A real, market-independent return component - but only one part of total return, which also depends on timber PRICES, and it does nothing about liquidity risk\",\"A guaranteed 4% yield\",\"Marketing fiction\",\"Biological growth is genuine and price-independent - trees add volume regardless of markets. But total return = growth + price change on timber and land; prices can fall for years. And the growth cannot be converted to cash on demand: the exit depends on finding a buyer, which is the illiquidity the pitch glosses over.\"],\n[\"For the family's stated goal - inflation protection - the strongest argument FOR these two assets is:\",\"Timber and commodities are real assets whose prices and incomes historically rise with inflation, unlike nominal bonds whose fixed payments inflation erodes\",\"They always go up\",\"They have no correlation with anything\",\"Inflation is precisely a rise in real-asset prices; owning the assets (land, timber, commodities) passes that rise to the investor, while fixed-rate bonds lose purchasing power by construction. The hedge is imperfect year to year but structurally sound over the long horizons that matter to the family.\"]]}\n];\n\n// ===================== CFA LEVEL III - MOCK 3, SESSION 2 (5 item sets + 6 essay sets, 132 points) =====================\n// Fresh content; Mock 1 and 2 sub-topics not repeated. Numbers verified. Item-set correct answers stored first (engine shuffles deterministically).\nvar L3_SETS_S6=[\n{id:\"l3s6-e-pm-tax\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 1 - After tax, not before (Private Wealth: Taxes)\",vig:\"A client has 100 lakh in a taxable account and asks the advisor to compare two 10-year strategies, both earning 8% before tax, with a 30% tax rate on investment gains:\\n\\nPLAN A: a fund taxed on its gains every year.\\nPLAN B: a deferred structure where gains compound untaxed and the whole gain is taxed at 30% only when the money comes out in year 10.\\n\\nHe also mentions his father's house, bought for 40 lakh years ago and now worth 2 crore, which he expects to inherit.\",\nparts:[{prompt:\"A. Calculate the 10-year after-tax value of each plan. Show your work. (4 points)\",points:4,model:\"Plan A: annual after-tax return = 8% x (1 - 0.30) = 5.6%; 100 x 1.056^10 = 100 x 1.7241 = 172.4 lakh. Plan B: 100 x 1.08^10 = 215.9 lakh; gain 115.9 lakh taxed at 30% = 34.8; net = 215.9 - 34.8 = 181.1 lakh. Deferral wins by about 8.7 lakh on the same pre-tax return.\",keys:[\"Plan A: 8% x 0.7 = 5.6%; 100 x 1.056^10 = about 172.4 lakh\",\"Plan B: 100 x 1.08^10 = 215.9, tax 30% on the 115.9 gain, net about 181.1 lakh\",\"States the deferral advantage of roughly 8-9 lakh\"]},\n{prompt:\"B. Explain WHY deferral wins even though the same 30% rate applies in both plans. (4 points)\",points:4,model:\"Under annual taxation, the government takes 30% of every year's gain and that money stops compounding - each year's tax is a permanent leak from the snowball. Under deferral, the untaxed gains keep earning 8% on the government's share too; the final 30% tax is paid once, on money that has been compounding for a decade. Same rate, different timing - and compounding makes timing worth real money.\",keys:[\"Annual tax removes money from the compounding base every year\",\"Deferral lets the deferred-tax share keep earning the full pre-tax return\",\"Concludes the benefit is timing/compounding, not a lower rate\"]},\n{prompt:\"C. The father wants to sell the house now and gift the 2 crore cash to the client instead of leaving it in the estate. Give TWO reasons this may be tax-inefficient compared with inheriting it. (4 points)\",points:4,model:\"Any two of: (1) Selling now triggers capital gains tax on the 1.6 crore gain immediately - the tax reduces what can be gifted and the money stops compounding inside the family. (2) Holding to death can reset (step up) the cost basis to the market value at inheritance, so the decades of gain may never be taxed at all. (3) Gift tax or clubbing provisions may apply to the transfer. (4) Selling loses the option of borrowing against the house while keeping the asset. Exact rules vary by country; the principle - do not realize gains early when an inheritance route can erase them - travels.\",keys:[\"Early sale triggers capital gains tax on the 1.6 crore gain now\",\"Basis step-up at death can eliminate the historical gain entirely\",\"Gift/clubbing rules or the lost compounding as a valid second point\"]}]},\n{id:\"l3s6-i-gips\",sess:2,kind:\"mcq\",t:\"ethics\",title:\"Vignette 1 - Selling the track record honestly (GIPS)\",vig:\"A fund house markets its flagship equity strategy to institutions. Its presentation shows: only the strategy's three best years out of five; a 'composite' containing the two largest accounts while small accounts were excluded for being 'operationally awkward'; and the star manager's performance from her PREVIOUS employer, presented as the firm's own.\",\nqs:[[\"Showing only the three best years of five violates the GIPS requirement of:\",\"A minimum five-year GIPS-compliant performance history (building to ten years), with no cherry-picked periods\",\"Annual returns\",\"Quarterly reporting\",\"GIPS requires firms to show at least five years of compliant history, building toward ten, so prospects see full cycles - not just flattering windows. Selecting only good years is exactly the presentation abuse the standard exists to stop.\"],\n[\"Excluding the small accounts from the composite is:\",\"A violation - composites must include all actual fee-paying discretionary portfolios managed to the strategy, not a selected subset\",\"Acceptable if disclosed\",\"Acceptable if the accounts are below the firm's minimum size stated in its policy\",\"The composite definition must capture every qualifying portfolio so the record is not flattered by selection. A pre-announced, consistently applied minimum account size is legitimate; excluding 'awkward' accounts ad hoc after seeing their returns is cherry-picking.\"],\n[\"Presenting the manager's prior-employer performance as the firm's own is:\",\"Not permitted - a track record belongs to the firm where it was earned and is portable to a new firm only under strict conditions linking the staff, process, and records\",\"Permitted if the manager consents\",\"Permitted if the strategy name is unchanged\",\"Performance is earned by a firm, not a person. Portability requires the new firm to show substantially the same team, decision process, and supporting records - otherwise the old record must be shown as supplemental and clearly labeled as from the prior firm, never as the firm's own.\"],\n[\"GIPS verification by an independent third party means:\",\"The verifier tests whether the firm has properly constructed composites and followed GIPS policies firm-wide - it does not certify that any single return number is accurate\",\"The auditor guarantees future performance\",\"The firm's returns are certified correct account by account\",\"Verification is a firm-wide process review: policies, composite construction, calculation methodology. It gives prospects confidence in the SYSTEM, not a warranty on any number - and it says nothing about the future.\"]]},\n{id:\"l3s6-e-pm-endow\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 2 - Spending forever (Endowment Management)\",vig:\"A university endowment holds 500 crore. Its spending rule: distribute 4.5% of the average corpus over the trailing three years. Year-end corpus values: two years ago 480 crore, last year 500 crore, this year 520 crore. Educational-cost inflation runs 5% a year. Investment management costs are 0.5% of assets a year.\\n\\nThe board asks: how much can we spend this year, what return must we earn to keep this up forever, and why average three years at all?\",\nparts:[{prompt:\"A. Calculate this year's spending amount under the rule. (4 points)\",points:4,model:\"Trailing three-year average corpus = (480 + 500 + 520) / 3 = 1,500 / 3 = 500 crore. Spending = 4.5% x 500 = 22.5 crore.\",keys:[\"Averages the three values: (480+500+520)/3 = 500 crore\",\"Applies 4.5% to get 22.5 crore\",\"Uses the average, not the current 520 crore\"]},\n{prompt:\"B. Formulate the endowment's required return objective, with numbers. (4 points)\",points:4,model:\"Required return = spending rate + inflation + costs = 4.5% + 5.0% + 0.5% = 10.0% a year. Earning 10% lets the fund pay out 4.5%, cover 0.5% of costs, and grow the corpus by the 5% inflation rate so that the REAL (inflation-adjusted) value of both the corpus and the spending stream is preserved indefinitely - intergenerational equity.\",keys:[\"Adds 4.5 + 5.0 + 0.5 = 10%\",\"Identifies the 5% inflation component as what preserves real value\",\"States the goal as perpetual/intergenerational purchasing power\"]},\n{prompt:\"C. Why does the rule average three years of corpus instead of using just the latest value? (4 points)\",points:4,model:\"Smoothing. The university's budget cannot lurch 10-20% when markets swing; averaging three years damps the payout's sensitivity to any single year's market value, so a crash cuts spending gradually and a boom raises it gradually. The trade-off: in a long drawdown the effective payout rate on the depressed corpus temporarily exceeds 4.5%, slowly eating real value - which is why many endowments also cap the year-to-year change in spending.\",keys:[\"Smoothing protects the operating budget from market swings\",\"Explains payouts adjust gradually in both booms and crashes\",\"Notes the trade-off: payout rate drifts above 4.5% in sustained drawdowns (or mentions caps)\"]}]},\n{id:\"l3s6-i-pm-appraise\",sess:2,kind:\"mcq\",t:\"pm\",title:\"Vignette 2 - Four rulers, one fund (Performance Appraisal)\",vig:\"A fund returned 14% over the year. Risk-free rate 6%; market return 10%; the fund's beta is 1.2; fund return standard deviation 18%; market standard deviation 15%.\\n\\nTwo trustees argue: one says 'it beat the market by 4 points, keep it'; the other wants risk-adjusted numbers before deciding.\",\nqs:[[\"The fund's Sharpe ratio is:\",\"0.44 - (14% - 6%) / 18%\",\"0.78 - (14% - 6%) / 10%\",\"0.67\",\"Sharpe = excess return over total volatility = 8% / 18% = 0.44. It uses TOTAL risk, so it is the right ruler for a fund that is the investor's whole portfolio.\"],\n[\"The fund's Treynor ratio and Jensen's alpha are:\",\"Treynor 6.67 (8% / 1.2); alpha +3.2% - actual 14% minus the CAPM-required 6% + 1.2 x 4% = 10.8%\",\"Treynor 6.67; alpha +4.0%\",\"Treynor 3.2; alpha +6.67%\",\"Treynor scales excess return by beta alone: 8/1.2 = 6.67. Jensen's alpha compares with what CAPM says a 1.2-beta fund should earn: 6 + 1.2 x (10 - 6) = 10.8%, so alpha = 14 - 10.8 = +3.2%. Both use systematic risk only - right when the fund sits inside a diversified portfolio.\"],\n[\"The M-squared measure is:\",\"12.67% - 6% + 0.44 x 15% - the fund's return if its risk were levered to match the market's\",\"14%\",\"10%\",\"M2 = rf + Sharpe x market sigma = 6% + 0.44 x 15% = 12.67%. It restates Sharpe in RETURN units by scaling the fund to market risk - comparable directly with the market's 10%. Here M2 beats the market by 2.67 points, confirming genuine risk-adjusted outperformance.\"],\n[\"The 'beat by 4 points' trustee's argument is weakest because:\",\"Raw return differences ignore risk - a 1.2-beta fund SHOULD beat a 10% market in an up year; the appraisal measures show what was earned above that mechanical expectation\",\"4 points is not a large margin\",\"The market is not the right benchmark for any fund\",\"With beta 1.2 and the market up 10%, CAPM already promises 10.8%. Claiming skill from the raw 4-point gap pays the manager for market exposure the trustee could buy in an index fund. Alpha, M2, and Sharpe strip that out - and still leave 3.2%, which is the part worth a fee.\"]]},\n{id:\"l3s6-e-equity-constr\",sess:2,kind:\"essay\",t:\"equity\",title:\"Essay 3 - Building the equity sleeve (Equity Portfolio Construction)\",vig:\"A CIO must rebuild a 40-crore equity sleeve. Two managers pitch:\\n\\nMANAGER X runs 15 stocks, all in banking and pharma - the two sectors she knows deeply. Her best ideas are 'obviously better than the index, and diversification just dilutes them.'\\nMANAGER Y proposes an 80-stock portfolio built sector-by-sector to match the index's sector weights, with the best two or three stocks inside each.\\n\\nThe CIO's own view: 'Our whole risk budget is in this sleeve. I want alpha, but I cannot explain a 15% underweight in a rallying sector to the board.'\",\nparts:[{prompt:\"A. Classify each manager's approach (concentrated vs diversified; sector-agnostic vs sector-aware) using the case facts. (4 points)\",points:4,model:\"Manager X: concentrated (15 stocks) and sector-agnostic - she holds only the two sectors she knows, letting sector bets dominate by accident of expertise rather than by view. Manager Y: diversified (80 stocks) and sector-aware/neutral - sector weights match the index so the active bets are pure stock selection within sectors, not sector calls.\",keys:[\"X: concentrated, 15 stocks, two sectors only\",\"X's sector exposure is incidental, not a deliberate view\",\"Y: diversified and sector-neutral, with stock selection as the active bet\"]},\n{prompt:\"B. Using the fundamental law, explain the breadth-versus-conviction trade-off between the two managers. (4 points)\",points:4,model:\"Expected active return scales with skill x the square root of independent bets. X has few, large bets (15 stocks, 2 sectors - so maybe 15 bets plus 2 huge sector bets): if her IC is genuinely high, concentration maximizes each unit of skill, but a single wrong call is deeply felt and the sector bets add risk with no evidence of sector-forecasting skill. Y has ~80+ independent selection bets: lower per-bet conviction, but breadth compounds reliability - lower IR volatility and a higher chance the alpha survives a bad quarter. The law does not say breadth beats skill; it says unreliable skill needs breadth.\",keys:[\"Applies IR = IC x root(breadth): X few large bets, Y many small ones\",\"X's sector bets are risk without demonstrated sector skill\",\"Concludes breadth buys reliability when skill is uncertain; concentration only pays with proven high IC\"]},\n{prompt:\"C. Recommend a structure consistent with the CIO's stated constraint, and justify it. (4 points)\",points:4,model:\"A core-satellite: a diversified core (Manager Y style, sector-aware) as the majority, sized so sector underweights stay small enough to explain to the board; one or two concentrated satellites (Manager X) capped at a minority share where her demonstrated stock skill can add alpha without dominating the sleeve's risk. This respects the constraint - 'cannot explain a 15% sector underweight' - by keeping benchmark-like sector exposure at the core, while not discarding X's edge entirely.\",keys:[\"Proposes core-satellite with the diversified manager as core\",\"Caps the concentrated sleeve so sector risk stays explainable\",\"Ties the recommendation explicitly to the CIO's board-communication constraint\"]}]},\n{id:\"l3s6-i-fixed-strat\",sess:2,kind:\"mcq\",t:\"fixed\",title:\"Vignette 3 - Riding the curve (Fixed Income Strategy)\",vig:\"The one-year point on the government curve yields 7.0%; the two-year point yields 7.2%, and the curve is expected to stay exactly where it is. A trader with a one-year horizon can: (a) buy a one-year bond at 7.0%, or (b) buy a two-year bond at 7.2% and sell it after one year - when, if the curve is unchanged, it will be a one-year bond yielding 7.0%.\",\nqs:[[\"If the curve is unchanged, strategy (b) earns approximately:\",\"7.4% - the 7.2% yield plus about 0.2% of price gain from rolling down from 7.2% to 7.0% over the final year\",\"7.2% - the yield it was bought at\",\"7.0%\",\"The bond earns its 7.2% yield, and as it ages from the 2-year to the 1-year point it is repriced at the lower 7.0% yield - a price gain of roughly duration (about 1) x the 0.2% yield drop = 0.2%. Total about 7.4%: the yield plus the 'roll-down'.\"],\n[\"The strategy's excess return over simply buying the one-year bond disappears if:\",\"One-year yields RISE by roughly 0.4% or more during the year - the price loss from higher rates wipes out the roll-down and yield advantage\",\"The curve stays unchanged\",\"Two-year yields fall\",\"Riding loses when rates back up. The cushion is the 0.4% combination of extra yield (0.2%) plus roll-down (0.2%); a rise beyond that in the applicable one-year rate turns the trade negative versus the simple one-year hold.\"],\n[\"Riding the yield curve works as a recurring strategy only when:\",\"The curve is upward-sloping AND stays roughly stable - the slope pays the rider, and stability keeps rate moves inside the cushion\",\"The curve is flat\",\"Rates are falling sharply every year\",\"The roll-down exists because longer points yield more than shorter ones - an upward slope. But the cushion is small; if the curve shifts up (even while staying sloped), the rider gives back the roll. Falling rates help everyone, not specifically the rider, so they are not the strategy's premise.\"],\n[\"Compared with holding the one-year bond, the rider's additional risk is best described as:\",\"Price risk on a longer-duration instrument if rates move against him - he must SELL in one year rather than hold to a known maturity value\",\"Default risk\",\"Reinvestment risk on coupons\",\"The one-year bond is redeemed at par at the horizon - no market risk at exit. The two-year bond must be SOLD at whatever one-year rate then prevails, so the rider is short volatility at the horizon. That exit-price exposure is the entire extra risk of the strategy.\"]]},\n{id:\"l3s6-e-deriv-currency\",sess:2,kind:\"essay\",t:\"deriv\",title:\"Essay 4 - Half-hedged on purpose (Currency Overlay)\",vig:\"A 60-crore portfolio holds 40% foreign equities (24 crore) denominated in dollars. The investment committee adopts a strategic hedge ratio of 50% on the foreign sleeve - a passive, always-on hedge.\\n\\nThis year: foreign equities return +8% in local terms, but the dollar weakens 6% against the rupee. One member asks whether the hedge helped or hurt, and whether the ratio should be raised to 100% 'to stop thinking about it.'\",\nparts:[{prompt:\"A. State the forward position needed to implement the 50% hedge: instrument, direction, and notional. (4 points)\",points:4,model:\"Sell USD / buy INR forward with a notional of 12 crore (50% of the 24 crore foreign exposure). Selling the foreign currency forward locks the conversion rate on that half; the other 12 crore stays fully exposed to the dollar-rupee rate.\",keys:[\"Correct instrument: FX forward\",\"Correct direction: SELL USD / buy INR\",\"Correct size: 12 crore (half of 24 crore)\"]},\n{prompt:\"B. Calculate the foreign sleeve's approximate rupee return this year WITH the 50% hedge, and compare it with no hedge. (4 points)\",points:4,model:\"Unhedged: +8% local return minus the 6% currency loss = about +2% in rupees. With 50% hedged: the currency loss applies only to the unhedged half, so -3%; return = +8% - 3% = about +5%. The hedge HELPED this year by about 3 percentage points because the dollar fell - hedging converts half the currency exposure into a locked rate that gained when the dollar weakened.\",keys:[\"Unhedged rupee return: about +2% (8% - 6%)\",\"Hedged: currency loss halves to -3%, return about +5%\",\"Concludes the hedge helped BECAUSE the foreign currency fell - it is symmetric the other way\"]},\n{prompt:\"C. Give TWO arguments against raising the hedge ratio to 100% 'to stop thinking about it'. (4 points)\",points:4,model:\"Any two of: (1) Symmetry - a full hedge also forfeits currency GAINS; when the dollar strengthens, the 100%-hedged investor gives up the entire tailwind and must fund forward losses in cash. (2) Cost - hedging costs the interest differential (forward points) every year on the full amount, a persistent drag. (3) Cash-flow/liquidity strain - forward settlements must be paid even when the portfolio is down. (4) Foreign currency exposure itself diversifies a rupee-based portfolio in domestic crises, when the rupee often falls. 'Stop thinking' is not a policy argument; the hedge ratio should reflect goals, horizon, and costs.\",keys:[\"Full hedge forfeits gains symmetrically / must fund forward losses in cash\",\"Ongoing forward-point (interest differential) cost on the full amount\",\"Currency as a diversifier in domestic stress, or liquidity strain, as a valid second point\"]}]},\n{id:\"l3s6-i-alt-pe\",sess:2,kind:\"mcq\",t:\"alt\",title:\"Vignette 4 - Reading the waterfall (Private Equity)\",vig:\"A private equity fund took 100 crore of commitments, invested 90 crore, and over its life returned total proceeds of 160 crore. Terms: European (whole-fund) waterfall, 8% preferred return (hurdle), 20% carry. For simplicity, the preferred return owed to investors totals 22 crore by the time proceeds are distributed.\\n\\nA new LP studies the fund's numbers: DPI 1.78x on called capital; the fund took 4 years before its first distribution.\",\nqs:[[\"Under the European waterfall, the GP's carry is:\",\"9.6 crore - proceeds first return the 90 crore invested and the 22 crore preferred return; carry is 20% of the remaining 48 crore\",\"32 crore - 20% of 160\",\"12 crore\",\"European waterfall order: return contributed/invested capital (90) + full preferred return (22) before ANY carry. Excess = 160 - 90 - 22 = 48; carry = 20% x 48 = 9.6 crore. LPs receive the remaining 38.4 crore of profit on top of capital and pref.\"],\n[\"The European structure differs from the American (deal-by-deal) waterfall chiefly in that:\",\"It delays carry until ALL fund capital plus the hurdle is returned - friendlier to LPs, since early winning deals alone cannot trigger carry\",\"It pays carry faster\",\"It charges no preferred return\",\"Deal-by-deal waterfalls can pay carry on early winners while later losers have not yet returned capital, forcing clawbacks later. The European whole-fund test pays carry only after the whole fund has returned capital plus pref - the standard LP-protective structure.\"],\n[\"A DPI of 1.78x tells the LP that:\",\"For every rupee of capital actually paid in, 1.78 rupees have come back in cash distributions - a realized, hard-number multiple\",\"The fund is 78% above its benchmark\",\"The IRR is 1.78%\",\"DPI (distributions to paid-in) is cash-out over cash-in: real money returned, immune to valuation marks. It ignores whatever value still sits unrealized in the fund - that is captured by RVPI, and the two together make TVPI.\"],\n[\"The four years before the first distribution reflect:\",\"The J-curve - fees and early losses are paid in first, and value from portfolio companies takes years to build and exit\",\"Mismanagement\",\"The GP hoarding cash\",\"PE funds call capital to pay fees and buy companies whose value is built over years; early net returns are negative by construction, then distributions accelerate as exits happen. A four-year wait for first distributions is typical, which is why PE allocations must be sized against spending needs.\"]]},\n{id:\"l3s6-e-pm-manager\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 5 - Choosing the person, not the brochure (Manager Selection)\",vig:\"A family office must pick one of two equity managers.\\n\\nMANAGER P: 10-year record beating the index by 2% a year; the two founding partners retired last year; the strategy's sector weights have wandered far from the stated 'consumer focus' in the last 18 months; fees 1.5%.\\nMANAGER Q: 6-year record beating the index by 1.2% a year; same team throughout; holdings match the stated process precisely in quarterly reviews; fees 1.0%.\\n\\nThe family's advisor warns: 'Returns are the least reliable page of the pitch book.'\",\nparts:[{prompt:\"A. Give TWO reasons Manager P's headline 2% outperformance is weaker evidence than it looks, using case facts. (4 points)\",points:4,model:\"(1) The people who produced it are gone - a track record belongs to the team that earned it; with both founders retired, the 10-year record describes a firm that no longer exists. (2) The recent drift from the stated consumer focus means future returns will come from a DIFFERENT process than the one the record measures - style drift breaks the link between past and expected future performance.\",keys:[\"Founders retired - the record's authors left\",\"Style drift - current holdings no longer match the process behind the record\",\"Explains why each fact severs past performance from future expectation\"]},\n{prompt:\"B. Distinguish returns-based style analysis from holdings-based style analysis, and state which would detect Manager P's drift faster. (4 points)\",points:4,model:\"Returns-based analysis regresses the fund's historical returns on style/sector indices to infer exposures from behavior - cheap and needs no disclosures, but it lags: it infers drift only after enough returns accumulate. Holdings-based analysis inspects the actual portfolio - precise and current, but needs position disclosure. HOLDINGS-based detects drift faster: the 18-month sector wander would be visible in the first quarterly holdings report showing non-consumer names, long before a regression confirms it.\",keys:[\"Returns-based: infers style from return behavior; lagging\",\"Holdings-based: inspects actual positions; current and precise\",\"Holdings-based catches the drift first\"]},\n{prompt:\"C. Recommend a manager, weighing performance, people, process and fees - and state the single biggest residual risk of your pick. (4 points)\",points:4,model:\"Manager Q. Slightly lower historical alpha (1.2% vs 2%), but the team that made it is intact, holdings verifiably follow the stated process - so the record is likely repeatable - and fees are 0.5% lower, clawing back nearly half the alpha gap. P's edge rests on departed people and a wandering mandate. Biggest residual risk of Q: the shorter, 6-year record may not span a full market cycle - the process is unproven through a severe bear market; mitigate with a smaller initial allocation and a review trigger.\",keys:[\"Picks Q with people/process/fees reasoning, not just returns\",\"Notes the 0.5% fee saving narrows the alpha gap\",\"Names Q's shorter cycle coverage as the residual risk (or equivalent honest risk)\"]}]},\n{id:\"l3s6-e-fixed-attr\",sess:2,kind:\"essay\",t:\"fixed\",title:\"Essay 6 - Where the bond return came from (Fixed Income Attribution)\",vig:\"A bond portfolio returned 7.2% over the year. The income (carry) it earned was 4.0% and its effective duration was 5.0. Over the year, government yields FELL 0.50%, and the portfolio's roll-down added 0.3%. The manager also took credit exposure; the residual after yield, rate-move and roll effects is +0.4%.\\n\\nSeparately: the portfolio's spread duration is 4.0, and the trustee worries about credit spreads WIDENING 0.25% next year.\",\nparts:[{prompt:\"A. Decompose the 7.2% total return into its yield, rate-move, roll and residual components, showing the arithmetic. (4 points)\",points:4,model:\"Income (carry) component: +4.0%, as given. Rate-move component: -duration x change in yield = -5.0 x (-0.50%) = +2.5%. Roll-down: +0.3%. Residual (credit/selection): +0.4%. Sum: 4.0 + 2.5 + 0.3 + 0.4 = 7.2% - the decomposition reconciles exactly to the reported total.\",keys:[\"Rate-move = -5.0 x (-0.50%) = +2.5%\",\"Carry/yield 4.0% + rate 2.5% + roll 0.3% + residual 0.4% = 7.2%\",\"Explicitly reconciles the components to the reported 7.2%\"]},\n{prompt:\"B. Quantify the effect on the portfolio if credit spreads widen 0.25% next year. (4 points)\",points:4,model:\"Spread effect = -spread duration x change in spread = -4.0 x 0.25% = -1.0%. On top of whatever the government-yield part does, the credit exposure alone would subtract about 1 percentage point from the year's return - the trustee's worry is a full point of performance, which against a 6% starting yield is material but survivable.\",keys:[\"Uses -spread duration x spread change\",\"Computes -4.0 x 0.25% = -1.0%\",\"Frames it as about one point off the year's return\"]},\n{prompt:\"C. Which components of this year's 7.2% are evidence of manager skill, and which are not? Justify briefly. (4 points)\",points:4,model:\"Not skill: the +2.5% rate-move component - falling government yields lift every duration-matched portfolio; a passive index with duration 5 earned the same. Partly skill (if deliberate): the +0.3% roll-down, only if the curve positioning that produced it was an intentional, repeatable choice. Skill: the +0.4% residual credit/selection component - it is what the manager added beyond yield, rates and curve mechanics, i.e. genuine security or sector selection. Honest attribution pays the manager for the 0.4%, not the 2.5%.\",keys:[\"Rate-move component is beta, not skill - any duration-5 portfolio earned it\",\"Residual/credit component is the true selection skill\",\"Roll-down credited only if it was deliberate positioning\"]}]},\n{id:\"l3s6-i-econ-cycle\",sess:2,kind:\"mcq\",t:\"econ\",title:\"Vignette 5 - Reading the cycle (Economics for Allocation)\",vig:\"A strategist sets the house view. Data: the yield curve has flattened to near-inversion; new factory orders have fallen three months running; the central bank's neutral rate is 2%, current inflation 6% versus a 2% target, and the output gap is estimated at -1%.\\n\\nShe drafts the Taylor rule benchmark: policy rate = neutral + inflation + 0.5 x (inflation - target) + 0.5 x (output gap).\",\nqs:[[\"The Taylor rule benchmark policy rate is:\",\"9.5% - 2% + 6% + 0.5 x (6% - 2%) + 0.5 x (-1%)\",\"8.0%\",\"10.5%\",\"2 + 6 + 0.5 x 4 + 0.5 x (-1) = 2 + 6 + 2 - 0.5 = 9.5%. The rule mechanically balances the inflation overshoot (pushing the rate up 2 points) against the below-potential economy (pulling it down half a point).\"],\n[\"The flattening-to-inverting yield curve and falling new orders are best classified as:\",\"LEADING indicators - they historically turn before the economy does, so they inform the allocation before the slowdown arrives\",\"Coincident indicators\",\"Lagging indicators\",\"Yield curve shape and new orders move ahead of output - they are the classic leading pair. Coincident indicators (industrial production, payrolls) tell you where you are; lagging ones (unemployment duration, credit costs) confirm where you have been. Asset prices respond to the leading set.\"],\n[\"If the strategist concludes a slowdown is coming, the standard allocation tilt is:\",\"Toward high-quality bonds and defensive equities - duration gains as rate-cut expectations build, and defensives hold earnings when cyclicals do not\",\"Toward small-cap cyclicals\",\"Toward commodities\",\"Late-cycle/slowdown playbook: growth-sensitive assets (cyclicals, commodities, small caps) suffer as earnings fall; government bonds rally on expected cuts, and quality/defensive equity sectors keep their margins. The tilt is paid for only if the slowdown call is right - which is why it is a view, not a default.\"],\n[\"The Taylor rule's main limitation as an allocation input is that:\",\"Its outputs swing with whichever inflation and output-gap estimates are used, and both are revised and contested - it is a benchmark for debate, not a forecast\",\"It uses too little data\",\"It can only be computed annually\",\"The output gap is unobservable and heavily revised; inflation has half a dozen measures. Small input changes move the prescribed rate by points, so practitioners treat the rule as a disciplined starting framework - useful for asking 'is the central bank tight or loose relative to the rule?' rather than as an oracle.\"]]}\n];\n\n// ===================== v97.14: Level II/III mock engine (item sets + L3 constructed response) =====================\n// L2: 22 vignettes x 4 MCQ, 2 sessions x 44, 2 h 12 min. L3: 11 sets per session mixing item sets and\n// write-compare-self-score essay sets, 132 points per session, real 2 h 12 min timing.\nvar MOCKL_CFG={2:{mins:132,per:44,total:88,name:\"Level II\",tlabel:\"2 h 12 min\",s2desc:\"44 fresh questions\"},\n               3:{mins:132,per:132,total:264,name:\"Level III\",tlabel:\"2 h 12 min\",points:true,s2desc:\"11 fresh case sets\"}};\nfunction mocklExpand(sets,r,lvl){var out=[];sets.forEach(function(s){\n if(s.kind===\"essay\"){s.parts.forEach(function(p){out.push({_essay:true,q:p.prompt,prompt:p.prompt,model:p.model,keys:p.keys,_pts:p.points,t:s.t,_vig:s.vig,_set:s.title,opts:[],a:0,why:\"\"})});return}\n s.qs.forEach(function(a){var ord=[0,1,2];for(var i=2;i>0;i--){var j=Math.floor(r()*(i+1));var t=ord[i];ord[i]=ord[j];ord[j]=t}\n  out.push({q:a[0],opts:ord.map(function(k){return a[1+k]}),a:ord.indexOf(0),why:a[4],t:s.t,_vig:s.vig,_set:s.title,_pts:lvl===2?1:3})})});return out}\nfunction mocklBank(lvl,n){var g=(typeof window!==\"undefined\")?window:globalThis;\n var a=g[\"L\"+lvl+\"_SETS_S\"+(n*2-1)],b=g[\"L\"+lvl+\"_SETS_S\"+(n*2)];\n if(typeof a!==\"undefined\"&&typeof b!==\"undefined\")return a.concat(b);\n return g[\"L\"+lvl+\"_SETS_S1\"].concat(g[\"L\"+lvl+\"_SETS_S2\"])}\nfunction buildMockL(lvl,seed){\n var all=mocklBank(lvl,seed);\n var r=RNG(seed*104729+13);\n var byS={1:[],2:[]};all.forEach(function(s){byS[s.sess||(s.id.indexOf(\"s1\")>=0?1:2)].push(s)});\n var shuf=function(arr){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}return arr};\n var pick=function(list){var mcq=list.filter(function(s){return s.kind!==\"essay\"}),es=list.filter(function(s){return s.kind===\"essay\"});\n  return shuf(mcq).concat(shuf(es))}; // all sets included; interleave MCQ first then essays like the real paper blocks\n return {s1:mocklExpand(pick(byS[1]),r,lvl),s2:mocklExpand(pick(byS[2]),r,lvl)};\n}\nfunction examStartL(lvl,seed){var m=buildMockL(lvl,seed);var cfg=MOCKL_CFG[lvl];\n EX={lvl:lvl,cfg:cfg,seed:lvl*1000+seed,sess:1,all:m,qs:m.s1,idx:0,ans:{},flags:{},end:Date.now()+cfg.mins*60*1000,scores:null,drafts:{},checked:{}};\n examPersist();examRender()}\n// Persist/resume learn the level so an interrupted L2/L3 mock rebuilds from the right bank.\nexamPersist=function(){S.exam=EX?{seed:EX.seed,sess:EX.sess,idx:EX.idx,ans:EX.ans,flags:EX.flags,end:EX.end,drill:EX.drill||null,topic:EX.topic||null,lvl:EX.lvl||0,drafts:EX.drafts||{},checked:EX.checked||{}}:null;save()};\nexamResume=function(){var s=S.exam;va
