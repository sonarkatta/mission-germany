he market return itself, paying for active bets is pure cost and tracking risk. Active approaches need a stated edge belief and tolerance for multi-year underperformance - otherwise the index wins by default.\"]]},\n{id:\"l3s1-i-ethics\",sess:1,kind:\"mcq\",t:\"ethics\",title:\"Vignette 4 - Manager selection ethics (Ethics)\",vig:\"A wealth platform is onboarding an external fund manager. During due diligence: the manager offers the platform's research team a sponsored trip to visit portfolio companies; the manager's marketed track record mixes actual and simulated results without labeling which is which; and the platform discovers the manager's star fund's 'assets under management' figure includes committed-but-uncalled capital.\",\nqs:[[\"The marketed track record mixing actual and simulated results without labels violates:\",\"Standard III(D) - Performance Presentation: simulated and actual results must be clearly distinguished\",\"Standard I(B) - Independence and Objectivity\",\"No standard, if the simulation method is disclosed in a footnote\",\"Clients must be able to tell real money results from hypothetical ones - the distinction is fundamental to judging a manager. Unlabeled blending misleads even with a buried footnote.\"],\n[\"The sponsored trip for the research team should be:\",\"Declined or paid for by the platform itself - third-party travel can compromise independent judgment under Standard I(B)\",\"Accepted if the flights are economy class\",\"Accepted if disclosed to the platform's compliance officer afterwards\",\"Modest, disclosed, business-purpose items can be acceptable, but sponsored travel for those judging the manager creates exactly the appearance of captured judgment that Standard I(B) targets. Best practice: the platform pays its own way.\"],\n[\"Counting committed-but-uncalled capital in 'assets under management' is:\",\"Misleading under Standard I(C) - Misrepresentation, because uncalled commitments are not managed assets\",\"Standard industry practice\",\"Acceptable for private funds only\",\"AUM means assets actually managed. Uncalled commitments may never arrive and earn no fees yet; inflating the figure misrepresents the firm's scale and experience.\"],\n[\"If the platform hires the manager despite these findings, its own strongest defense under the Standards is:\",\"Documenting a thorough due-diligence process and requiring the manager to remediate the practices before onboarding\",\"Saying the manager is independent, so the platform bears no responsibility\",\"Requiring higher returns to compensate for the risk\",\"Advisors stay responsible for the managers they select. A documented process plus requiring fixes shows the duty was taken seriously; willful blindness to misrepresentation transfers the conduct problem to the platform's own clients.\"]]},\n{id:\"l3s1-e-alt\",sess:1,kind:\"essay\",t:\"alt\",title:\"Essay 4 - Adding alternatives to a family portfolio (Alternatives)\",vig:\"A family holds 80% listed Indian equities and 20% bonds. Their advisor proposes a 10% allocation to alternatives: 6% to a private equity fund (10-year lockup) and 4% to a real-estate income fund. The family's known spending needs over the next 5 years total 60 lakh, comfortably covered by the bond sleeve and income.\\n\\nThe family asks: what alternatives actually do for a portfolio, what to check before signing, and whether the lockups are dangerous for them.\",\nparts:[{prompt:\"A. State TWO distinct roles alternatives can play in this portfolio, tied to the family's situation. (4 points)\",points:4,model:\"(1) Return enhancement - private equity targets returns above public markets, compounding the long-horizon money the family will not need for 5+ years. (2) Diversification/inflation hedging - real-estate income correlates weakly with listed equities and rents tend to track inflation, smoothing the 80% equity concentration's swings.\",keys:[\"Return enhancement linked to the long-horizon surplus\",\"Diversification/low correlation and/or inflation hedging for the real-assets sleeve\",\"Both tied to facts of THIS family (80/20 mix, 5-year buffer)\"]},\n{prompt:\"B. List TWO due-diligence items specific to the private equity fund, and why each matters. (4 points)\",points:4,model:\"Any two of: (1) Track record by vintage year - PE returns cluster by vintage; one lucky fund does not prove skill. (2) Fees and waterfall - 2% management fee plus 20% carry over a hurdle; European vs American waterfall decides how early the GP gets paid. (3) GP alignment - how much of the GP's own money is in the fund. (4) Realization history - distributions, not paper IRR.\",keys:[\"Vintage-by-vintage track record or realization/distribution history\",\"Fees, carry and waterfall structure, or GP co-investment/alignment\",\"A reason attached to each item\"]},\n{prompt:\"C. Are the lockups dangerous for THIS family? Justify your answer with the case facts. (4 points)\",points:4,model:\"No, at this size. The known 5-year spending (60 lakh) is covered by bonds and income, so no near-term need touches the alternatives sleeve. 10% of the portfolio is illiquid, but 90% stays liquid, and the education/goal money is elsewhere. The lockup becomes dangerous only if spending needs jump or the allocation grows so large that forced early exits (at discounts on secondary markets) become likely.\",keys:[\"Uses the 60-lakh/5-year buffer fact\",\"Weighs the 10% size against the 90% liquid remainder\",\"Names the condition that WOULD make it dangerous (bigger needs or allocation)\"]}]},\n{id:\"l3s1-i-pm-perf\",sess:1,kind:\"mcq\",t:\"pm\",title:\"Vignette 5 - Where did the return come from? (Performance Evaluation)\",vig:\"A balanced fund reports +9.0% versus its benchmark's +7.5%. The Brinson attribution for the largest sector shows: portfolio sector weight 30% versus benchmark 20%; benchmark sector return 12%; portfolio sector return 10%.\\n\\nThe trustee wants to know whether the manager added value by picking stocks or by sizing sectors, and how to judge the fund overall.\",\nqs:[[\"The sector's allocation effect is closest to:\",\"(30% - 20%) x (12% - 7.5%) = +0.45% - overweighting a sector that beat the overall benchmark added value\",\"(30% - 20%) x 12% = +1.20%\",\"30% x (12% - 7.5%) = +1.35%\",\"Brinson allocation = (wp - wb) x (Rb,sector - Rb,total) = 0.10 x (12% - 7.5%) = +0.45%. It isolates the bet on the SECTOR, stripping out how the whole market did.\"],\n[\"The sector's selection effect is closest to:\",\"20% x (10% - 12%) = -0.40% - the manager's picks in this sector lagged the sector itself\",\"30% x (10% - 12%) = -0.60%\",\"(10% - 12%) x (30% - 20%) = -0.20%\",\"Brinson selection = wb x (Rp,sector - Rb,sector) = 0.20 x (-2%) = -0.40%. Using benchmark weight isolates pure stock-picking; the interaction term (wp-wb)(Rp-Rb) = -0.20% is usually shown separately.\"],\n[\"Reading the two effects together, the trustee should conclude:\",\"Good sector timing, weak stock selection in this sector - the manager sized the bet right but picked the wrong names\",\"The manager is skilled at both\",\"Neither effect can be judged from these numbers\",\"Allocation +0.45% (sized into a winning sector) against selection -0.40% (names lagged that sector) is the classic split verdict. Attribution separates the two skills so the trustee pays for the one that actually exists.\"],\n[\"For judging the fund OVERALL, the most complete single check is:\",\"Whether the +1.5% excess return persists over a full market cycle net of all fees, with risk similar to the benchmark\",\"This quarter's +1.5% excess return alone\",\"The fund's total return rank in its category this year\",\"One period proves nothing; fees compound; and excess return earned by quietly taking more risk is not skill. Cycle-long, net-of-fee, risk-matched performance is the honest bar for keeping or firing the manager.\"]]},\n{id:\"l3s1-e-deriv-fx\",sess:1,kind:\"essay\",t:\"deriv\",title:\"Essay 5 - The unhedged dollar question (Currency Management)\",vig:\"A family's portfolio holds US equities worth 2.0 crore rupees, unhedged - the full position is exposed to the dollar. Their advisor notes the rupee has weakened about 3% a year against the dollar over the past decade, and that one-year USD/INR forwards price roughly in line with the interest differential (US rates about 2% below Indian rates).\\n\\nThe family asks: are we being paid for this risk, should we hedge some of it, and what does hedging cost?\",\nparts:[{prompt:\"A. Explain what happens to the rupee value of the US equity holding if the rupee weakens 5% against the dollar while US share prices are unchanged. (4 points)\",points:4,model:\"The rupee value rises by about 5%: the shares convert into more rupees. 2.0 crore becomes about 2.1 crore - a pure currency gain of roughly 10 lakh with zero help from the stocks. The reverse happens symmetrically if the rupee strengthens 5%.\",keys:[\"Rupee depreciation raises the INR value of dollar assets\",\"Quantifies: about +5%, roughly 10 lakh on 2 crore\",\"Notes the symmetric loss if the rupee strengthens\"]},\n{prompt:\"B. Describe how to hedge HALF the exposure using one-year forwards, including the direction of the forward trade. (4 points)\",points:4,model:\"Sell USD / buy INR forward for an amount equal to 1.0 crore of the exposure (half of 2.0 crore). Selling dollars forward locks the conversion rate on that half: if the rupee strengthens, the shares lose rupee value but the short forward gains by the same amount; if the rupee weakens, the forward loss cancels the currency gain. The hedged half is neutralized; the unhedged half keeps full currency exposure.\",keys:[\"Correct direction: SELL dollars forward (not buy)\",\"Sizes it at half the exposure (1.0 crore)\",\"Explains the offset logic in at least one scenario\"]},\n{prompt:\"C. State the approximate annual cost of this hedge and its source. (4 points)\",points:4,model:\"About 2% a year on the hedged amount - the forward discount on dollars, which equals the interest differential (Indian rates about 2% above US rates). Selling USD forward means giving up the higher rupee interest rate, so the hedge 'costs' the differential; it is not a fee but an opportunity cost locked into the forward rate. Hedging half costs about 1% of the total position per year.\",keys:[\"Approximately 2% per year on the hedged half (about 1% on the whole position)\",\"Source = interest differential / forward points, not a commission\",\"Recognizes it as an opportunity cost embedded in the forward rate\"]}]},\n{id:\"l3s1-i-pm-risk\",sess:1,kind:\"mcq\",t:\"pm\",title:\"Vignette 6 - Three ways to say 'how bad' (Risk Management)\",vig:\"A risk officer presents the same 20-crore equity portfolio three ways: parametric (variance-covariance) 1-day 95% VaR of 40 lakh; historical 1-day 95% VaR of 55 lakh; and a stress test replaying the March 2020 crash, showing a 2.6 crore loss.\\n\\nThe CIO asks why the numbers differ and which one to put on the board slide.\",\nqs:[[\"The gap between the parametric VaR (40 lakh) and the historical VaR (55 lakh) most likely reflects:\",\"Fat tails and skew in real returns - the parametric method's normality assumption understates how bad bad days get\",\"A calculation error in one of the two\",\"Different confidence levels\",\"Parametric VaR assumes (near-)normal returns, so it inherits the bell curve's thin tails. Historical VaR reads actual past days, crashes included, and lands higher when the sample holds real stress. Same data window, different assumptions, honest gap.\"],\n[\"The stress test's 2.6 crore loss figure tells the board something VaR cannot, namely:\",\"What this specific portfolio would have lost in a named, extreme historical episode - regardless of how probable the model thinks that episode is\",\"The average daily loss\",\"The maximum the portfolio can ever lose\",\"VaR is a probability statement about ordinary distributions; stress tests answer 'what if THAT happens?' for events outside the model's imagination or sample. Boards need both: the routine yardstick and the disaster rehearsal.\"],\n[\"A board slide allowed ONE number should carry:\",\"The historical VaR with the stress figure beside it - a probability-based routine measure plus the concrete worst-episode rehearsal\",\"Only the parametric VaR, because it is the smallest and cleanest\",\"No number, because all risk measures mislead\",\"One number alone misleads: parametric flatters, and VaR never describes the tail beyond itself. Historical VaR (empirical, honest about fat tails) plus the stress loss gives the board both the routine and the extreme view.\"],\n[\"If the portfolio's options book grows large, the risk method LEAST trustworthy becomes:\",\"Parametric VaR, because option payoffs are non-linear and normality assumptions break exactly where options bend the distribution\",\"Historical VaR\",\"Stress testing\",\"Non-linear payoffs make return distributions asymmetric by construction - the variance-covariance method's linearity/normality assumptions fail first and worst. Full-revaluation historical or Monte Carlo simulation handles options properly.\"]]}\n];\n\n// ===================== CFA LEVEL III - MOCK 1, SESSION 2 (5 item sets + 6 essay sets) =====================\nvar L3_SETS_S2=[\n{id:\"l3s2-e-pm-behavioral\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 6 - Reading the client (Behavioral Finance)\",vig:\"Notes from three client meetings:\\n\\nClient A: 'Every stock I own is from the state I grew up in - I know these companies. I refuse to sell any of them at a loss; I will wait until each one gets back to what I paid.'\\n\\nClient B: 'My salary account money is for safety, so it stays in deposits. My trading account is play money - there I take big swings.'\\n\\nClient C: 'Tech is the future, nothing can stop it. The fund manager who disagrees with me is simply behind the times.'\",\nparts:[{prompt:\"A. Identify the TWO clearest behavioral biases in Client A's statement, and the portfolio danger in each. (4 points)\",points:4,model:\"(1) Familiarity/home bias - owning only companies from one region because they feel known; the portfolio loses diversification and concentrates in one local economy. (2) Loss aversion / disposition effect - refusing to realize losses and waiting to 'get back to even'; losers are held too long, tax losses go unharvested, and capital stays trapped in weak companies. (Anchoring on the purchase price is the same trap's reference point and is acceptable as the second answer.)\",keys:[\"Familiarity/home bias + lost diversification\",\"Loss aversion/disposition (or anchoring to purchase price) + holding losers too long\",\"Each bias tied to a quoted behavior\"]},\n{prompt:\"B. Client B's statement is a textbook example of which bias, and what is its real cost? (4 points)\",points:4,model:\"Mental accounting - money is sorted into arbitrary buckets ('safety' versus 'play money') with different risk rules, although a rupee is a rupee. The real cost: the overall portfolio is not managed as one plan - the 'play' account can take risks the family's goals cannot afford, while the 'safe' account may hold too much in low-return deposits, so total wealth drifts from the optimal mix.\",keys:[\"Names mental accounting\",\"Explains buckets get different rules though money is fungible\",\"Cost: the whole portfolio no longer serves the plan - hidden risk or excess conservatism\"]},\n{prompt:\"C. Name Client C's bias and recommend ONE corrective action the advisor should take. (4 points)\",points:4,model:\"Overconfidence (with confirmation bias - dismissing contrary views as 'behind the times'). Corrective action: introduce structured disagreement - require a written bear case and a pre-set review rule (for example, position-size limits and rebalancing triggers) before increasing the tech bet, so decisions are tested against evidence instead of conviction.\",keys:[\"Overconfidence and/or confirmation bias, tied to the quote\",\"A concrete corrective: written counter-case, position limits, or rebalancing rules\",\"The action forces evidence into the decision\"]}]},\n{id:\"l3s2-i-fixed-curve\",sess:2,kind:\"mcq\",t:\"fixed\",title:\"Vignette 7 - Playing the curve (Fixed Income)\",vig:\"A bond manager runs 100 crore with a 5-year mandate. The government curve is upward sloping and she expects it to stay roughly stable. Three structures are on the table: a bullet concentrated in 5-year bonds; a barbell of 2-year and 10-year bonds with the same duration; and a ladder from 1 to 10 years. She also considers 'riding the yield curve' - buying 7-year bonds and selling them as they age into 5-year paper.\",\nqs:[[\"Riding the yield curve earns an extra return when:\",\"The curve is upward sloping AND stays stable - the bond 'rolls down' to lower yields and its price rises beyond what carry alone gives\",\"The curve is flat, because rolldown needs no slope\",\"Rates rise sharply, because coupons get reinvested higher\",\"Rolldown is a slope trade: as the 7-year bond seasons into a 5-year bond, its yield drops toward the 5-year point and the price gains. A flat curve has nothing to roll down; rising rates swamp the effect. Upward AND stable is the whole thesis.\"],\n[\"If she expects the curve to FLATTEN (long rates falling more than short rates), the better structure is:\",\"The barbell - its long end gains more from falling long rates than the bullet's mid-curve bonds\",\"The bullet, because concentration always wins\",\"The ladder, because it holds every maturity\",\"A flattening move rewards long-duration exposure at the long end. The barbell carries that exposure while the bullet has none beyond 5 years. (The same convexity logic flips the answer for a steepening view - shape of the expected move picks the structure.)\"],\n[\"The ladder's main advantage over the other two is:\",\"Smooth, predictable reinvestment - a slice matures every year, averaging out timing risk and matching steady cash needs\",\"Highest yield in every environment\",\"Maximum convexity\",\"The ladder never bets on a rate call: equal slices keep duration stable and put cash in hand every year, whatever rates do. It trades the barbell's convexity and the bullet's precision for reliability.\"],\n[\"Choosing the bullet specifically (all 5-year) over a same-duration barbell makes most sense when:\",\"The goal is to fund a known payment near year 5 - cash flows clustered at the horizon minimize structural risk\",\"The manager expects the curve to steepen\",\"Concentration is required by regulation\",\"Immunization logic: when a liability sits at one date, clustering assets at that date (bullet) minimizes exposure to curve twists. A same-duration barbell matches duration but not dispersion, leaving more structural risk against non-parallel moves.\"]]},\n{id:\"l3s2-e-pm-institutional\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 7 - Writing the pension fund's objectives (Institutional Investors)\",vig:\"You advise the defined-benefit pension plan of a manufacturing company. Facts: the plan is 90% funded (assets cover 90% of the pension obligation); the workforce is relatively young (average age 38); contributions this year exceed benefit payments; the sponsor's own profits are cyclical and only weakly correlated with the markets.\\n\\nThe board asks for the return objective and an honest statement of how much risk the plan can take.\",\nparts:[{prompt:\"A. Formulate the plan's return objective. (4 points)\",points:4,model:\"Earn a total return sufficient to close the funding gap and keep pace with the growth of pension liabilities - at minimum the liability's discount rate plus the growth in accrued benefits - so the plan reaches and maintains full funding while supporting benefit payments, within the risk the plan can bear.\",keys:[\"Ties return to funding the liability/reaching full funding\",\"References the discount rate or liability growth as the floor\",\"Mentions closing the 90% funded gap or sustaining benefits\"]},\n{prompt:\"B. Give TWO case facts that RAISE this plan's ability to take risk, and explain each. (4 points)\",points:4,model:\"(1) Young workforce (average 38) - liabilities are far in the future, giving a long horizon to ride out market drawdowns. (2) Contributions exceed benefit payments - positive net cash flow means no forced selling in bad markets; the plan is a net buyer in drawdowns. (Also acceptable: the sponsor's profits are weakly correlated with markets, so sponsor support is more likely available exactly when the portfolio suffers.)\",keys:[\"Young workforce -> long horizon -> more risk capacity\",\"Contributions exceed payouts -> no forced selling\",\"Sponsor correlation argument acceptable as a substitute\"]},\n{prompt:\"C. Give the ONE case fact that LOWERS risk tolerance, and its implication for the allocation. (4 points)\",points:4,model:\"The 90% funded status: the plan is already behind its promises, so a large equity drawdown would deepen the deficit and could force painful sponsor contributions. Implication: the allocation should lean toward liability-matching bonds and limit drawdown-prone risk, unless the sponsor explicitly commits to backstop the shortfall - risk capacity from the young workforce is capped by the deficit.\",keys:[\"Identifies the underfunding (90% funded) as the limiting fact\",\"Explains: a drawdown deepens the deficit / forces sponsor contributions\",\"Concludes with a more liability-aware, drawdown-limited allocation\"]}]},\n{id:\"l3s2-i-alt-hf\",sess:2,kind:\"mcq\",t:\"alt\",title:\"Vignette 8 - Four hedge fund calls (Alternatives)\",vig:\"An allocator reviews four hedge funds pitching for the same slot:\\n\\nFund 1 buys strong Indian mid-caps and shorts weak ones, keeping roughly 40% net long exposure.\\nFund 2 pairs long and short positions so tightly that its net market exposure is near zero, harvesting pure stock-spread returns.\\nFund 3 trades on macro views - long commodities on supply shocks, short bonds ahead of expected rate rises.\\nFund 4 follows price trends across futures markets systematically, long uptrends and short downtrends.\",\nqs:[[\"Fund 2's near-zero net exposure classifies it as:\",\"Equity market neutral - return comes from the long/short spread, not from the market's direction\",\"Long/short equity with a growth tilt\",\"Global macro\",\"Market neutral strips out beta by construction; what remains is the manager's selection spread. Fund 1 (40% net long) still carries real market exposure - it is long/short equity, not market neutral.\"],\n[\"Fund 3 is best labeled:\",\"Global macro - top-down bets across asset classes on economic themes\",\"Managed futures\",\"Event driven\",\"Discretionary bets on rates, currencies, commodities and growth themes from the top down is the definition of global macro. Fund 4's systematic trend-following in futures is managed futures/CTA - same markets, different engine (rules versus views).\"],\n[\"A key reason funds like Fund 4 historically earned a 'crisis offset' reputation is:\",\"Trends persist most strongly in panics, so a system long past winners and short past losers tends to be positioned with the crash, not against it\",\"Futures never gap\",\"They hold only government bonds\",\"In sustained sell-offs, trend systems end up short equities/long safe assets because that IS the trend - they often profit exactly when long-only portfolios bleed. The offset is empirical, not guaranteed: a sharp V-shaped reversal whipsaws them.\"],\n[\"Across all four funds, the due-diligence question that matters MOST for this allocator is:\",\"Whether the fund's stated style matches what the portfolio actually does day to day (style drift and true exposure)\",\"The size of the marketing deck\",\"Whether the fund charges 2 and 20\",\"Hedge fund disasters usually start with drift: a 'market neutral' book quietly loading beta, a macro fund doubling one bet. Verifying real positions, exposure and leverage against the pitch protects the slot the fund was hired to fill.\"]]},\n{id:\"l3s2-e-equity\",sess:2,kind:\"essay\",t:\"equity\",title:\"Essay 8 - Building the equity sleeve (Equity Portfolio Management)\",vig:\"A family's 1.2 crore equity sleeve is currently 40 random inherited stocks with no design. The advisor proposes rebuilding it as: 60% a broad index fund, 30% a value-and-quality factor fund, and 10% a high-conviction active manager. The family also asks whether 'responsible investing' can fit without hurting returns.\",\nparts:[{prompt:\"A. Explain the logic of the 60/30/10 structure - what each sleeve is hired to do. (4 points)\",points:4,model:\"Core-satellite design: the 60% index core guarantees the market return at minimal cost and anchors risk; the 30% factor fund pursues documented premiums (value, quality) with rules and moderate tracking error; the 10% active manager is a sized bet on genuine stock-picking skill - small enough that a wrong call cannot sink the plan, large enough to matter if right.\",keys:[\"Names core-satellite logic\",\"Index core = cheap market return and risk anchor\",\"Factor sleeve = systematic premiums; active sleeve = sized skill bet with limited damage if wrong\"]},\n{prompt:\"B. State ONE advantage and ONE risk of putting 30% into the factor fund instead of the index. (4 points)\",points:4,model:\"Advantage: exposure to the value/quality premiums, which have historically beaten the cap-weighted market over long horizons, at fees far below active management. Risk: factor cycles - value can underperform the market for years at a stretch (as in growth-led rallies), and a family that bails out mid-cycle converts temporary underperformance into a permanent loss; the tilt only pays if held through its droughts.\",keys:[\"Advantage: factor premiums at low cost\",\"Risk: multi-year factor underperformance/drought\",\"The behavioral requirement: holding through the drought\"]},\n{prompt:\"C. Describe ONE honest way to add responsible/ESG investing to this sleeve and its likely effect on returns. (4 points)\",points:4,model:\"Any coherent answer, for example: (1) Integration - choose managers/funds that price ESG risks (governance failures, regulatory exposure) into stock selection; expected effect: roughly neutral-to-slightly-positive, because it is risk control, not exclusion. (2) Exclusion/screening - drop whole sectors on values grounds; honest cost: a smaller opportunity set and tracking difference versus the broad market, with no reliable return penalty or bonus. (3) Impact/thematic - buy clean-energy or similar themes; expected effect: higher volatility and valuation risk in exchange for alignment with values. The key honest point: values-based choices are legitimate but should be made with eyes open about what they cost or do not cost.\",keys:[\"Names a real approach (integration, screening or impact)\",\"Gives a balanced return expectation (not 'free money', not 'certain loss')\",\"Honest about the trade-off involved\"]}]},\n{id:\"l3s2-i-deriv-swaps\",sess:2,kind:\"mcq\",t:\"deriv\",title:\"Vignette 9 - The swap on the books (Derivatives)\",vig:\"A company has a 50 crore floating-rate loan (paying MIBOR + 1%) and wants certainty. It enters a 3-year interest rate swap: it PAYS a fixed rate of 6.5% and RECEIVES MIBOR on 50 crore notional. Six months later, market rates have risen 1% and the swap is being marked to market for the accounts.\",\nqs:[[\"After entering the pay-fixed/receive-floating swap, the company's effective borrowing cost becomes:\",\"Fixed at about 7.5% - the floating MIBOR leg of the loan is offset by the swap's MIBOR receipt, leaving fixed 6.5% + the loan's 1% spread\",\"Floating MIBOR + 1%, unchanged\",\"Fixed 6.5% total\",\"The loan pays MIBOR + 1%; the swap pays 6.5% fixed and receives MIBOR. The MIBOR legs cancel, leaving 6.5% + 1% spread = 7.5% fixed. Forgetting the loan's own spread (answering 6.5%) is the classic miss.\"],\n[\"After rates rise 1%, the swap's mark-to-market value to the company is:\",\"Positive - a payer of fixed receives back a now-cheap 6.5% while floating receipts have risen; the swap is an asset\",\"Negative, because rates rose\",\"Zero, because swaps are always worth zero\",\"A swap is worth zero only at initiation. Once rates rise, paying the old lower fixed rate is valuable: the company locked yesterday's price of money. The gain mirrors what a receiver of fixed loses.\"],\n[\"The most direct bond-portfolio equivalent of this pay-fixed swap position is:\",\"Being long a floating-rate note and short a fixed-rate bond\",\"Being long both a fixed and a floating bond\",\"Being short the floating-rate note and long the fixed-rate bond\",\"Pay fixed / receive float = own the floater, owe the fixed bond. This replication is why swap values move like bond prices: rising rates hurt the short fixed leg... that is, they HELP this position, exactly as the mark-to-market shows.\"],\n[\"A remaining risk the company still bears after the swap is:\",\"Counterparty risk - if the swap dealer fails while the swap is an asset, the hedge can vanish just when it is most valuable\",\"Floating-rate risk on the hedged loan\",\"The risk of owing MIBOR twice\",\"Hedging converts rate risk into counterparty exposure. Collateral/margining and central clearing exist precisely because a winning swap is a claim on the counterparty - and claims can default.\"]]},\n{id:\"l3s2-e-pm-rebalance\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 9 - When to pull the portfolio back (Monitoring and Rebalancing)\",vig:\"A family's target allocation is 60% equities / 40% bonds. After a strong equity rally the mix stands at 70/30. Their current rule is 'rebalance every March, whatever happens.' Their advisor proposes switching to a corridor rule: rebalance any time equities move more than 5 percentage points from target (i.e., beyond 55% or 65%).\\n\\nThe family asks which rule is better for them and what either rule really costs.\",\nparts:[{prompt:\"A. Compare the calendar rule and the corridor rule on THIS family's facts - which triggers action today, and why? (4 points)\",points:4,model:\"The corridor rule triggers today: 70% equities is 10 points above target, well outside the 5-point corridor, so it rebalances now, when the drift is large. The calendar rule ignores the 70/30 mix until March, letting the riskiest position ride for months. For a family whose danger is an oversized equity bet meeting a crash, the corridor answers the actual risk; the calendar answers the date.\",keys:[\"Corridor triggers NOW because 70% is outside 65%\",\"Calendar waits until March regardless of drift\",\"Frames the corridor as answering risk, the calendar as answering dates\"]},\n{prompt:\"B. State TWO genuine costs of rebalancing more often or with tighter corridors. (4 points)\",points:4,model:\"(1) Transaction costs and taxes - every rebalance sells winners, realizing capital gains and paying spreads/brokerage; tighter corridors compound the count of trades. (2) Momentum give-up - rebalancing sells what is rising and buys what is lagging; in trending markets a tight corridor systematically cuts winners early, and the disciplined risk control can lag a never-rebalanced portfolio for long stretches.\",keys:[\"Transaction costs and taxes from more/frequent trades\",\"Giving up momentum / cutting winners early\",\"Both framed as real costs, not inconveniences\"]},\n{prompt:\"C. Recommend a rule for this family and justify it in one short paragraph. (4 points)\",points:4,model:\"A 5-point corridor with quarterly checks is the better fit: the family's true risk is an equity allocation silently growing past their tolerance, and the corridor acts exactly then - as it would today at 70%. Pairing it with scheduled quarterly reviews keeps monitoring cheap without waiting a fixed year. The corridor should not be tightened below about 5 points, where trading costs and tax drag start eating the risk benefit it buys.\",keys:[\"Recommends the corridor (with a monitoring cadence)\",\"Justifies by the family's risk, citing the 70% drift\",\"Warns against corridors so tight that costs swamp the benefit\"]}]},\n{id:\"l3s2-i-pm-monitor\",sess:2,kind:\"mcq\",t:\"pm\",title:\"Vignette 10 - Reading the dashboard (Monitoring)\",vig:\"A quarterly review shows: the portfolio's equity weight drifted from 60% to 68%; the 10-year government yield fell from 7.2% to 6.1%, lifting bond prices; the family's daughter now starts college in 2 years instead of the 4 assumed in the IPS; and the family's breadwinner changed jobs with a large one-time bonus parked in the bank account.\",\nqs:[[\"Which of these changes is a change in INVESTMENT OBJECTIVES rather than just market movement, and why?\",\"The daughter starting college in 2 years instead of 4 - a goal moved closer, shortening the horizon and raising liquidity needs\",\"The equity drift to 68%\",\"The yield fall to 6.1%\",\"Monitoring separates two triggers: markets move the portfolio (rebalancing question), and lives move the IPS (objectives question). A goal arriving two years early rewrites time horizon and liquidity - that sends the family back to the IPS, not just to the trade blotter.\"],\n[\"The drift to 68% equities, on its own, most directly raises the question of:\",\"Rebalancing back toward the 60% target to restore the intended risk level\",\"Rewriting the IPS to 68% equities\",\"Firing the equity manager\",\"Drift changes the portfolio's actual risk without any decision being taken. The default discipline is to ask whether to rebalance (corridor/calendar rules), not to retrofit the IPS around wherever markets happened to leave the mix.\"],\n[\"The bonus parked in the bank account is best described as:\",\"Cash drag on the family's total plan until it is deployed according to the IPS\",\"A completed investment decision\",\"An emergency fund, by definition\",\"Uninvested cash quietly lowers the whole plan's expected return. Until the IPS says where it goes - goals reserve, equities, bonds - it is inertia, not strategy. (If the IPS earmarks it as the safety reserve, that is a decision; otherwise it is drag.)\"],\n[\"The fall in yields from 7.2% to 6.1% most affects the plan by:\",\"Raising the present value of both the bond portfolio and any future spending goals measured against those rates\",\"Lowering the value of the bond portfolio\",\"Having no effect until the bonds are sold\",\"Lower discount rates lift the price of existing bonds (the gain) AND the present value of future liabilities/goals (the cost). Plans that celebrate the bond gain without checking the liability side misread their true funded position.\"]]},\n{id:\"l3s2-e-pm-perfeval\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 10 - Grading the manager (Performance Evaluation)\",vig:\"A family hired an equity manager 3 years ago. Results: manager +14.2% a year, benchmark +11.0% a year, over all three years. The manager's portfolio beta was 1.25 against the benchmark's 1.0. The risk-free rate averaged 6%. The family's advisor says: 'Before we celebrate, let us see where the 3.2% a year actually came from.'\",\nparts:[{prompt:\"A. Using beta, estimate how much of the manager's excess return over the benchmark is explained simply by taking more market risk. (4 points)\",points:4,model:\"With beta 1.25, the expected market pickup is 1.25 x (11.0% - 6.0%) + 6.0% = 6.0% + 6.25% = 12.25% - versus the benchmark's 11.0%, so about 1.25 percentage points of the 3.2-point edge is explained by beta alone. The remaining roughly 1.9-2.0 points a year (14.2% - 12.25%) is the part not explained by market exposure - the candidate for genuine skill (alpha).\",keys:[\"Computes the beta-implied return 12.25% (or the 1.25-point beta contribution)\",\"Subtracts correctly, leaving about 1.9-2 points unexplained\",\"Names the remainder as alpha/skill candidate\"]},\n{prompt:\"B. State TWO further checks before calling the remaining edge skill rather than luck. (4 points)\",points:4,model:\"Any two of: (1) Statistical significance/length of record - three years of one market phase is too short; the edge must survive a full cycle and be distinguishable from noise. (2) Risk taken beyond beta - concentration, small-cap or sector tilts may carry their own premiums that explain the return without any skill. (3) Consistency - did the edge arrive steadily or in one lucky quarter? (4) Net-of-fee result - the family's actual experience is after costs.\",keys:[\"Record length/statistical significance over a full cycle\",\"Other risk exposures (size, sector, concentration) explaining the return\",\"Consistency or net-of-fee check as valid alternatives\"]},\n{prompt:\"C. The manager proposes raising the fee because of these results. Give the family ONE principled basis for deciding. (4 points)\",points:4,model:\"Pay for alpha, not beta: the family can own market exposure for a few basis points in an index fund, so the fee is justified only by the roughly 2-point alpha - and only if it persists net of the higher fee. A fair test: does the expected net-of-fee alpha still exceed what a cheaper factor fund would deliver, with confidence it is skill? If the raise eats the alpha, the family should decline or move the money.\",keys:[\"Frames it as paying for alpha, since beta is nearly free\",\"Compares expected net-of-fee alpha to cheaper alternatives\",\"Concludes with a decision rule (decline/move if the raise consumes the edge)\"]}]},\n{id:\"l3s2-i-ethics2\",sess:2,kind:\"mcq\",t:\"ethics\",title:\"Vignette 11 - The last three checks (Ethics)\",vig:\"Final compliance review at an advisory firm: (1) an advisor tells a prospective client 'our composite returns are GIPS-verified' when only some composites are; (2) a research analyst's report says 'we expect strong growth' based on a model, without separating the facts from the estimate; (3) the firm changes a client's IPS risk level after a phone call with the client's adult son, who is not an authorized party on the account.\",\nqs:[[\"Claiming firm-wide GIPS verification when only some composites are verified is:\",\"A violation of Standard I(C) - Misrepresentation, and of GIPS itself: verification claims must be precise about their scope\",\"Acceptable if the verified composites are the largest\",\"A violation only if performance was poor\",\"GIPS verification claims are exact claims. Stretching a partial verification to the whole firm overstates third-party assurance - precisely the trust signal the claim is designed to create.\"],\n[\"The research report's failure to separate facts from the growth estimate violates:\",\"Standard V(B) - Communication with Clients: distinguish fact from opinion\",\"Standard I(D) - Misconduct\",\"No standard, because estimates are inherently opinions\",\"Clients can only weigh a recommendation if they know what is hard fact (reported results, announced contracts) and what is the analyst's judgment (the forecast). Blurring the line sells opinion as fact.\"],\n[\"Changing the IPS on the adult son's instruction alone is:\",\"A violation of Standard III(C) - Suitability: the IPS belongs to the client; changes need the client's own instructions or an authorized agent's\",\"Acceptable, because family members share interests\",\"A violation only if the change loses money\",\"The IPS is the client's document. Authority to change it comes from the client or someone legally empowered - not from a relative, however well-meaning. Suitability work rebuilt on unauthorized instructions is built on air.\"],\n[\"The common thread through all three findings is:\",\"Each one misstates who stands behind a promise - the verifier's scope, the analyst's facts, or the client's own authority\",\"They are all minor documentation issues\",\"They would all be cured by disclaimers\",\"Each finding is about the integrity of a claim made to a client: what was verified, what is fact, whose instruction governs. Disclaimers do not cure any of them - accurate claims and proper authority do.\"]]},{id:\"l3s2-e-pm-conc\",sess:2,kind:\"essay\",t:\"pm\",title:\"Essay 11 - One stock too many (Concentrated Positions)\",vig:\"A senior executive's family holds 55% of its 3-crore wealth in the shares of her employer - built up over years through ESOPs she never sold. Her salary, bonus and career also depend on the same company. She says: 'Selling feels like betraying the company I helped build.'\",\nparts:[{prompt:\"A. Explain the TOTAL risk this family carries, beyond 'one stock can fall'. (4 points)\",points:4,model:\"The family's human capital and financial capital ride on the same company: if the employer stumbles, the stock falls at the very moment her salary, bonus and job are at risk - the losses correlate exactly when she can least afford them. The position is also undiversified: 55% in a single name carries company-specific (idiosyncratic) risk that the market does not pay anyone to hold.\",keys:[\"Human capital + financial capital tied to one employer\",\"Losses correlate in bad times (job and stock fall together)\",\"Idiosyncratic/uncompensated risk of a 55% single-stock weight\"]},\n{prompt:\"B. Name her stated bias and one practical technique to start reducing the position despite it. (4 points)\",points:4,model:\"Her statement shows emotional attachment / loyalty framing (with anchoring on the company's story - familiarity and status-quo bias). Practical techniques (any one): (1) a pre-committed staged-sale plan - sell a fixed slice each quarter regardless of feeling, which removes the decision from each day; (2) tax-aware transition - spread sales across tax years; (3) hedging with options or an exchange fund where available, diversifying economically without an immediate outright sale.\",keys:[\"Names the attachment/loyalty bias (or familiarity/status-quo)\",\"A concrete reduction technique: staged sales, tax-spreading, or hedging/exchange fund\",\"The technique works by removing emotion from the act, not by arguing with it\"]},\n{prompt:\"C. Set a target for the position and justify it briefly. (4 points)\",points:4,model:\"A defensible target: cut the single stock to at most 10-15% of total wealth over a defined period (for example 2-3 years of scheduled sales). Justification: below that range, even a company collapse no longer threatens the family's goals; the proceeds diversify into the broad portfolio so her future depends on markets generally - where she is paid to take risk - rather than on one employer, where she is not.\",keys:[\"A concrete target range around 10-15% (any small, reasoned cap is acceptable)\",\"A timeframe/mechanism for getting there\",\"Justification: cap the damage case; move to compensated, diversified risk\"]}]}\n];\n\n// ===================== CFA LEVEL III - MOCK 2, SESSION 1 (6 item sets + 5 essay sets, 132 points) =====================\n// Fresh content; Mock 1 sub-topics not repeated. Numbers verified. Item-set correct answers stored first (engine shuffles deterministically).\nvar L3_SETS_S3=[\n{id:\"l3m2-ethics\",sess:1,kind:\"item\",t:\"ethics\",title:\"Item Set 1 - Vasudevan Wealth (Ethics)\",vig:\"Vasudevan Wealth Management is preparing its first GIPS compliance claim. Four questions reach the compliance officer, Meera Vasudevan, CFA:\\n\\nA: A marketing colleague proposes a 'model portfolio' composite built from backtested results going back ten years, presented alongside the firm's real composites without any label that it is simulated.\\n\\nB: A portfolio manager asks whether terminated clients must stay in their composites' historical returns.\\n\\nC: The firm wants to exclude accounts below 1 million rupees from all composites 'because they are operationally inconvenient'.\\n\\nD: A manager who traded ahead of a client's large order argues the harm was minimal because the client still received 'a fair average price'.\",\nqs:[[\"The backtested composite in A is:\",\"Prohibited from being presented as a composite - simulated results are not actual assets and may only be shown clearly labeled as hypothetical, separate from GIPS composites\",\"Compliant if the backtest used real historical prices\",\"Compliant if fewer than five years are shown\",\"GIPS composites contain actual portfolios only. Backtested/model performance is hypothetical: it can never be a composite and must be clearly labeled as simulated wherever presented. Mixing it unlabeled with real composites is misleading.\"],\n[\"Terminated clients in B must:\",\"Remain in their composites' history through the last full measurement period they were under management\",\"Be removed from all historical composite returns\",\"Remain only if they left on good terms\",\"Removing terminated portfolios from history creates survivorship bias. GIPS requires keeping them in the composite through the last full period managed - only future periods exclude them.\"],\n[\"The minimum-account-size rule in C is:\",\"Permissible only as a documented, asset-level threshold applied consistently and disclosed - not as a moving convenience filter\",\"Always prohibited\",\"Permissible because small accounts are immaterial\",\"A minimum asset level for composite inclusion is allowed if it is pre-established, disclosed, and consistently applied. Using it opportunistically to drop inconvenient accounts violates the spirit and letter of composite construction.\"],\n[\"The manager's defense in D fails because:\",\"Standard VI(B) - Priority of Transactions prohibits trading ahead of client orders regardless of the price the client ultimately received\",\"The client must prove a loss of at least 5%\",\"It only violates the firm's manual, not the Standards\",\"The violation is the act of front-running itself. Client harm is not an element of VI(B) - trading on knowledge of pending client orders is prohibited even if the client's execution was acceptable.\"]]},\n{id:\"l3m2-aa\",sess:1,kind:\"item\",t:\"pm\",title:\"Item Set 2 - Surplus thinking (Portfolio Management)\",vig:\"Advisory firm Kanchan Partners reviews two clients. Client A is a family office with 120 million rupees of assets and a clearly defined 100 million present-value education liability; its surplus is 20 million. Client B is a young investor with no formal liabilities, only goals.\\n\\nThe partners debate asset-only versus liability-relative (ALM) approaches, surplus optimization, and which risk measure matters for each client.\",\nqs:[[\"For Client A, the most appropriate framing is:\",\"Liability-relative / surplus optimization - risk is shortfall versus the liability, not absolute volatility\",\"Pure asset-only mean-variance on the 120 million\",\"Cash matching only, because any risk is unacceptable\",\"With a defined liability, the relevant risk is the SURPLUS's volatility and the chance of falling below it. Surplus optimization runs mean-variance on surplus returns; asset-only optimization can choose a low-absolute-risk portfolio that is high-risk relative to the liability.\"],\n[\"If Client A's liability PV grows 5% and assets grow 8%, the funded ratio moves from 1.20 to approximately:\",\"1.234\",\"1.176\",\"1.200\",\"New ratio = 120 x 1.08 / (100 x 1.05) = 129.6/105 = 1.2343. Assets growing faster than liabilities improves the funded ratio - surplus risk management in one line.\"],\n[\"For Client B (goals but no fixed liabilities), the better starting point is:\",\"Asset-only mean-variance with goals translated into a required return\",\"Full ALM with an imputed liability of zero\",\"A surplus framework with the goal treated as a legal liability\",\"Without contractual liabilities, asset-only MVO is standard. Goals still discipline the required return and risk level, but there is no balance-sheet liability to immunize.\"],\n[\"A key practical criticism of surplus optimization is:\",\"It inherits mean-variance's sensitivity to input estimates - small changes in expected returns swing the 'optimal' allocation\",\"It ignores the liability entirely\",\"It cannot handle more than two asset classes\",\"Surplus optimization is still MVO machinery: estimation error in expected returns, volatilities and correlations produces unstable, concentrated outputs - which is why resampling, Black-Litterman or constraints accompany it in practice.\"]]},\n{id:\"l3m2-credit\",sess:1,kind:\"item\",t:\"fixed\",title:\"Item Set 3 - Pricing credit (Fixed Income)\",vig:\"Credit strategist Pooja Hegde analyzes a 5-year corporate bond trading at a z-spread of 240 bp over the government curve. Her model estimates annual probability of default at 2.0% and loss given default at 60%. A colleague asks her to separate the credit spread into its compensation components and to explain how an OAS differs from the z-spread.\",\nqs:[[\"The bond's annual expected credit loss is closest to:\",\"1.2%\",\"2.0%\",\"0.8%\",\"Expected loss = PD x LGD = 2.0% x 60% = 1.2% per year. Only 120 bp of the 240 bp spread compensates expected loss; the rest is risk premium, liquidity and other factors.\"],\n[\"The portion of the 240 bp spread ABOVE expected loss most likely compensates investors for:\",\"Credit risk premium (default-risk uncertainty), liquidity and tax/timing effects\",\"Exactly the recovery rate\",\"The risk-free term structure\",\"Spreads systematically exceed expected loss. The residual covers the risk premium for uncertain losses clustering in bad times, lower liquidity, and other frictions - which is why spread > expected loss is normal, not mispricing.\"],\n[\"The OAS differs from the z-spread in that the OAS:\",\"Removes the value of embedded options, making bonds with and without options comparable\",\"Is always larger than the z-spread\",\"Is measured over swaps rather than governments\",\"The z-spread is a flat spread over the benchmark curve; the OAS is the spread after adjusting for embedded optionality using a rate tree. For a callable bond, OAS < z-spread; option-free, they coincide.\"],\n[\"If Pooja expects the issuer's credit rating to be upgraded and spreads to tighten 40 bp, the best positioning is:\",\"Overweight the bond now - spread tightening adds price appreciation on top of carry\",\"Underweight - upgrades are already priced\",\"Hedge the credit exposure fully with CDS\",\"Credit strategy is about spread direction: expected tightening means the bond outperforms duration-matched governments by roughly spread change x spread duration, plus carry. Position BEFORE the market prices the migration.\"]]},\n{id:\"l3m2-futures\",sess:1,kind:\"item\",t:\"deriv\",title:\"Item Set 4 - Hedging with futures (Derivatives)\",vig:\"Portfolio manager Rahul Sinha runs a 50 million rupee equity portfolio, beta 1.10 to the index. He wants to hedge fully for three months using index futures. The futures price is 4,000 with a multiplier of 50 rupees per point, so one contract covers 200,000 rupees of index exposure.\\n\\nLater, he considers the same math for reducing (not eliminating) beta to 0.60.\",\nqs:[[\"The number of futures contracts for a full hedge is closest to:\",\"Sell 275 contracts\",\"Sell 250 contracts\",\"Buy 275 contracts\",\"N = -beta x V / (futures price x multiplier) = -1.10 x 50,000,000 / 200,000 = -275. SELL 275 contracts. Ignoring beta (250) under-hedges because the portfolio is 10% more volatile than the index.\"],\n[\"To reduce beta to 0.60 instead of zero, Rahul should:\",\"Sell contracts equal to (1.10 - 0.60) x 50 million / 200,000 = 125 contracts\",\"Sell 275 contracts and buy back 125\",\"Buy 125 contracts\",\"Partial hedging sells only the unwanted beta: target reduction 1.10 - 0.60 = 0.50, so N = -0.50 x 50,000,000/200,000 = -125 contracts. Same formula, smaller target change.\"],\n[\"The main reason the hedge will not track perfectly in practice is:\",\"Basis risk - the futures price and the portfolio's value do not move identically\",\"The multiplier is too small\",\"Futures expire before the hedge horizon always\",\"Basis = spot exposure value vs futures price can shift (dividends, rates, index composition). Combined with the portfolio's own tracking error to the index, the realized hedge deviates from the model.\"],\n[\"If the index falls 8% over the three months, the fully hedged position approximately:\",\"Loses little overall - the futures gain offsets the portfolio loss\",\"Gains 8%\",\"Loses the full 8%\",\"Short futures profit roughly 8% x 1.10 beta-adjusted exposure, offsetting the portfolio's roughly 8.8% equity loss. Net result is close to flat (earning roughly the risk-free rate), which is the point of the hedge.\"]]},\n{id:\"l3m2-equity\",sess:1,kind:\"item\",t:\"equity\",title:\"Item Set 5 - Justified multiples (Equity)\",vig:\"Strategist Ishaan Mehta screens two consumer companies with the same sustainable growth rate g = 6% and required return r = 10%. Company Kaveri pays out 40% of earnings; Company Goda pays out 70%.\\n\\nHe wants their justified leading P/E ratios, an explanation of why they differ, and a check on when DDM and FCFE valuations should give the same answer.\",\nqs:[[\"Kaveri's justified leading P/E is closest to:\",\"10.6\",\"7.0\",\"16.0\",\"Justified leading P/E = payout x (1+g)/(r-g) = 0.40 x 1.06/0.04 = 10.6. The multiple is fully determined by payout, growth and required return under Gordon assumptions.\"],\n[\"Goda's justified leading P/E is closest to:\",\"18.6\",\"10.6\",\"12.4\",\"0.70 x 1.06/0.04 = 18.55. At the same g and r, the higher payout supports a much higher justified multiple - but note the tension: sustainable g would normally fall as payout rises, so identical g across payouts is a modeling convenience.\"],\n[\"DDM and FCFE valuations give the same value per share when:\",\"Dividends equal FCFE - or FCFE is fully paid out; otherwise they can differ by the value of retained cash deployment\",\"The growth rate is zero\",\"The firm has debt\",\"DDM values only the dividend stream; FCFE values all cash available to shareholders. They coincide when the firm pays out everything it could. A firm hoarding cash or investing below its cost of equity makes DDM < FCFE value.\"],\n[\"If Kaveri's market P/E is 13 while its justified P/E is 10.6, the stock is:\",\"Expensive versus fundamentals on these inputs - the market prices higher growth or lower risk than assumed\",\"Cheap - buy immediately\",\"Fairly valued\",\"Market multiple above justified means investors pay more than the Gordon inputs support: either the stock is overvalued, or the market expects better g/r than the analyst. The multiple framework forces that question explicitly.\"]]},\n{id:\"l3m2-commod\",sess:1,kind:\"item\",t:\"alt\",title:\"Item Set 6 - Rolling commodities (Alternative Investments)\",vig:\"Allocator Smita Rao evaluates a commodity futures index for a multi-asset portfolio. The curve is in contango: spot 80, one-year futures 82. The collateral earns 4%. She must explain the three return components and what contango does to a long-only futures position over time.\",\nqs:[[\"The three components of a fully collateralized commodity futures return are:\",\"Spot (price) return + roll return + collateral return\",\"Carry + momentum + value\",\"Convenience yield + storage + insurance\",\"Total return = price (spot) return + roll return + collateral yield. The roll component exists because futures are renewed at different curve points; collateral (usually T-bills) adds its yield.\"],\n[\"With spot 80 and futures 82 (contango), a long futures position rolled as the contract converges to spot earns a roll return that is:\",\"Negative - the position repeatedly buys high on the curve and the contract slides toward spot\",\"Positive - futures always converge upward\",\"Zero - convergence is already priced\",\"In contango the futures price exceeds spot; holding spot flat, the long contract loses the 2.5% gap as it converges. Persistent contango is the structural drag on long-only commodity indices.\"],\n[\"If the curve flips to backwardation (futures below spot), the roll return becomes:\",\"Positive - convergence now works in the long position's favor\",\"Negative - backwardation is bad for longs\",\"Irrelevant to returns\",\"In backwardation the long buys below spot and the contract rises toward spot at expiry: roll return turns positive. Backwardated markets (often supply-stressed) historically rewarded long futures exposure.\"],\n[\"Assuming the spot price ends the year unchanged at 80 and the roll loss realizes in full, the fully collateralized one-year total return is closest to:\",\"+1.4%\",\"-2.5%\",\"+4.0%\",\"Total = spot 0% + roll (82 converging to 80 = -2.44% on the 82 notional... precisely (80-82)/82 = -2.44%) + collateral 4% = about +1.5%. The lesson: even a flat commodity market can yield a positive total return via collateral, but contango eats most of it here.\"]]},\n{id:\"l3m2-e1\",sess:1,kind:\"essay\",t:\"pm\",title:\"Essay 1 - The retiring executive (Portfolio Management)\",vig:\"Anil Deshpande, 60, retires next month. His investable portfolio is 8 million rupees. He needs 350,000 rupees per year of after-tax spending starting immediately, growing with inflation of 2.5%. He also wants to gift 1 million to his daughter in 3 years. He tells his advisor: 'I cannot afford to lose money - but I also want the portfolio to grow for my heirs.' He has no other income sources beyond a small government pension covering 100,000 of the 350,000.\",\nqs:null,parts:[\n{prompt:\"A. Calculate the after-tax real return requirement for the coming year, and state the nominal after-tax requirement assuming 2.5% inflation. (4 points)\",points:4,model:\"Net spending need from the portfolio = 350,000 - 100,000 pension = 250,000. Real required return = 250,000 / 8,000,000 = 3.125%. Nominal after-tax requirement = (1.03125)(1.025) - 1 = 5.70% (or approximately 3.125% + 2.5% = 5.63% additive; geometric is preferred).\",keys:[\"Identifies the net need 250,000 (pension offset)\",\"Divides by the 8,000,000 base = 3.125% real\",\"Compounds with inflation: 1.03125 x 1.025 - 1 = 5.70%\",\"States it is an after-tax, after-inflation requirement\"]},\n{prompt:\"B. Formulate the liquidity constraint for the IPS. (4 points)\",points:4,model:\"Ongoing: 250,000 per year from the portfolio, inflation-linked. One-time: 1,000,000 gift in 3 years - this must be earmarked (held in liquid, low-volatility assets) and excluded from the long-term return base. The IPS should state both the annual distribution need and the dated lump sum.\",keys:[\"Annual 250,000 inflation-linked distribution\",\"1,000,000 gift due in 3 years is a dated liquidity event\",\"Gift amount should be segregated/earmarked\",\"Liquidity constraint belongs explicitly in the IPS\"]},\n{prompt:\"C. Assess Anil's ability and willingness to take risk, noting any conflict. (4 points)\",points:4,model:\"Ability: moderate - a 3.1% real draw on 8 million is sustainable, but the near-term gift and retirement status reduce flexibility; the portfolio must fund spending for a long horizon. Willingness: low ('cannot afford to lose money'). His growth wish for heirs conflicts with his stated low willingness. Resolution: the IPS should anchor on the LOWER of the two (willingness) while educating him that a 5.7% nominal requirement cannot be met with zero-risk assets - some market risk is required, making the constraint the return requirement itself.\",keys:[\"Ability assessed as moderate with reasoning\",\"Willingness identified as low from his own words\",\"Names the conflict between his loss aversion and growth goal\",\"Advises resolving toward the binding (lower) tolerance with education\"]},\n{prompt:\"D. State the appropriate time horizon framing. (4 points)\",points:4,model:\"Long, multistage horizon: stage 1 = next 3 years until the gift (higher liquidity need), stage 2 = retirement thereafter (potentially 25-30 years). A 25-30 year horizon argues for a meaningful growth allocation despite his loss aversion - short-term volatility matters less than long-run purchasing power, which connects back to the answer in C.\",keys:[\"Long horizon (retirement, 25+ years)\",\"Multistage: gift date separates stage 1 from stage 2\",\"Links horizon to the ability to bear interim volatility\",\"Connects horizon to the inflation-protection need\"]}]},\n{id:\"l3m2-e2\",sess:1,kind:\"essay\",t:\"fixed\",title:\"Essay 2 - The single liability (Fixed Income)\",vig:\"A family trust owes a single payment of 200 million rupees in exactly 5 years. The 5-year spot rate is 5.0% (annual compounding). The trustee is choosing between (1) duration-matching immunization with a portfolio of government bonds and (2) buying a 5-year zero-coupon government bond.\",\nqs:null,parts:[\n{prompt:\"A. Calculate the amount that must be set aside today to fund the liability at 5.0%. (4 points)\",points:4,model:\"PV = 200 / (1.05)^5 = 200 / 1.27628 = 156.71 million. Setting aside 156.71 million growing at 5% reaches exactly 200 million in 5 years.\",keys:[\"Uses 200/(1.05)^5\",\"Computes 1.05^5 = 1.2763\",\"Arrives at about 156.7 million\",\"States this fully funds the liability at the assumed rate\"]},\n{prompt:\"B. Explain why the zero-coupon bond approach is free of immunization risk while the duration-matched coupon portfolio is not. (4 points)\",points:4,model:\"The zero-coupon bond's cash flow lands exactly on the liability date - no reinvestment of coupons is needed and no price risk exists if held to maturity (cash-flow matching). The duration-matched coupon portfolio only balances price risk against reinvestment risk AT the matched duration for a small parallel shift; coupons must be reinvested at unknown future rates, and non-parallel curve moves (structural/immunization risk) break the balance, requiring periodic rebalancing.\",keys:[\"Zero coupon = cash-flow match, no reinvestment risk\",\"Duration matching only offsets price vs reinvestment risk for small parallel shifts\",\"Non-parallel shifts create structural/immunization risk\",\"Duration-matched portfolios need rebalancing\"]},\n{prompt:\"C. The trustee asks: which approach is usually cheaper and more flexible in practice, and why might the trust still prefer the zero? (4 points)\",points:4,model:\"Duration immunization is usually cheaper and more flexible: a coupon portfolio can be assembled from more liquid bonds at better yields and adjusted over time, and exact zero-coupon supply may be thin. The trust may still prefer the zero for certainty - no rebalancing cost, no model risk, and no monitoring burden for a small, unsophisticated trustee; the price of that safety is typically a slightly higher required outlay.\",keys:[\"Immunization typically cheaper/more flexible\",\"Zero-coupon supply/liquidity may be limited\",\"Zero offers certainty with no rebalancing or model risk\",\"Frames the choice as cost/flexibility vs certainty\"]}]},\n{id:\"l3m2-e3\",sess:1,kind:\"essay\",t:\"deriv\",title:\"Essay 3 - The concentrated founder (Derivatives)\",vig:\"Startup founder Vikram Rao holds 1 million shares of his now-listed company, currently 100 rupees per share - 90% of his wealth. He cannot sell (lock-up, signaling), but options are available: a 95-strike 1-year put costs 3; a 110-strike 1-year call earns premium 4.\",\nqs:null,parts:[\n{prompt:\"A. Vikram buys the 95 put. Calculate his maximum loss per share over the year and his breakeven sale-equivalent price. (4 points)\",points:4,model:\"Protective put: maximum loss = (100 - 95) + 3 = 8 per share (stock can fall any amount; below 95 the put pays the difference, but the 3 premium is sunk). Breakeven = 100 + 3 = 103 - the stock must rise past the premium cost for the combined position to beat simply holding cash at today's price.\",keys:[\"Max loss = strike gap 5 + premium 3 = 8\",\"Recognizes the put floors the exit at 95 minus premium\",\"Breakeven 103 (must recover the premium)\",\"Per-share framing\"]},\n{prompt:\"B. Instead, Vikram sells the 110 covered call. Calculate his maximum gain per share and the effective sale price if exercised. (4 points)\",points:4,model:\"Covered call: if the stock exceeds 110, shares are called away: effective sale price = 110 + 4 premium = 114. Maximum gain = (110 - 100) + 4 = 14 per share. Below 110 he keeps the 4 premium but retains all downside on the stock itself.\",keys:[\"Effective sale price 114\",\"Max gain = 10 + 4 = 14\",\"Keeps premium in all scenarios\",\"Notes downside is NOT protected by a covered call\"]},\n{prompt:\"C. Combining both (the collar), list Vikram's floor, cap and net premium cost. (4 points)\",points:4,model:\"Collar: floor = 95 strike plus net premium (put cost 3 - call premium 4 = -1, a net CREDIT of 1): worst case exit = 95 + 1 = 96 per share. Cap = 110 + 1 = 111. Net premium = -1 (he is paid 1 to enter). He gives up upside above 111 in exchange for a guaranteed exit no worse than 96 - a zero-cost (here, negative-cost) risk band around a position he cannot sell.\",keys:[\"Net premium = 3 - 4 = -1 (credit)\",\"Floor exit 95 + 1 = 96\",\"Cap 110 + 1 = 111\",\"Frames the collar as the standard concentrated-stock solution\"]}]},\n{id:\"l3m2-e4\",sess:1,kind:\"essay\",t:\"pm\",title:\"Essay 4 - Reading the client (Portfolio Management / Behavioral)\",vig:\"Advisor Kiran Rao reviews notes on client Sudha Kulkarni:\\n\\n1. Sudha refuses to sell her inherited textile shares, down 40%: 'Selling makes the loss real.'\\n2. She anchors every discussion on the shares' 2019 peak price.\\n3. She keeps a 'safe' bank account for expenses and a separate 'risk money' trading account she gambles with, despite identical total wealth.\\n4. 85% of her portfolio is her late father's textile company and its direct competitors - 'I understand this industry.'\",\nqs:null,parts:[\n{prompt:\"A. Identify the behavioral bias in EACH of the four statements. (4 points)\",points:4,model:\"1. Loss aversion / disposition effect - avoiding realized losses even when selling is rational. 2. Anchoring - using the 2019 peak as the reference for every decision. 3. Mental accounting - treating identical money as separate buckets with different risk rules. 4. Familiarity/availability bias (and overconfidence) - over-allocating to what feels known, destroying diversification.\",keys:[\"Loss aversion/disposition for (1)\",\"Anchoring for (2)\",\"Mental accounting for (3)\",\"Familiarity bias for (4)\"]},\n{prompt:\"B. For each bias, state whether the better advisor response is to ACCOMMODATE (adapt the portfolio) or CORRECT (educate/change behavior), with one line of reasoning. (4 points)\",points:4,model:\"Guideline: accommodate emotional biases when the client's wealth is large relative to goals; correct cognitive errors. 1. Loss aversion - emotional: accommodate partially (staged selling program), but the concentration risk forces education. 2. Anchoring - cognitive: correct with data (fundamental value estimate vs peak price). 3. Mental accounting - mostly cognitive: reframe as one consolidated wealth plan. 4. Familiarity - cognitive plus emotional: educate on diversification math; accommodate by capping the legacy position rather than forcing an immediate full exit.\",keys:[\"Distinguishes emotional (accommodate) vs cognitive (correct)\",\"Anchoring corrected with evidence\",\"Mental accounting corrected via a consolidated view\",\"Concentration handled with a capped/staged path, not a forced sale\"]}]},\n{id:\"l3m2-e5\",sess:1,kind:\"essay\",t:\"pm\",title:\"Essay 5 - Where did the return come from (Portfolio Management)\",vig:\"A balanced fund's India equity sleeve: portfolio weight 30%, return 12%. Benchmark: weight 25%, return 10%. Use the Brinson-Hood-Beebower decomposition:\\n\\nAllocation effect = (wp - wb) x Rb\\nSelection effect = wb x (Rp - Rb)\\nInteraction = (wp - wb) x (Rp - Rb)\",\nqs:null,parts:[\n{prompt:\"A. Calculate the allocation, selection and interaction effects for this sleeve. (4 points)\",points:4,model:\"Allocation = (0.30 - 0.25) x 10% = +0.50%. Selection = 0.25 x (12% - 10%) = +0.50%. Interaction = 0.05 x 2% = +0.10%. Total active = +1.10%.\",keys:[\"Allocation +0.50%\",\"Selection +0.50%\",\"Interaction +0.10%\",\"Sums to +1.10%\"]},\n{prompt:\"B. Interpret the results for the investment committee in two sentences. (4 points)\",points:4,model:\"The manager added value equally from being overweight the sleeve while it outperformed (allocation, +0.50%) and from picking better securities within it (selection, +0.50%); the small positive interaction (+0.10%) reflects the overweight coinciding with the outperformance. Because allocation skill and selection skill are different competencies, the committee should check whether the manager's stated mandate emphasizes sector timing, security selection, or both before crediting the process as repeatable.\",keys:[\"Attributes half the value to the overweight decision\",\"Attributes half to security selection\",\"Explains interaction briefly\",\"Links decomposition to judging the manager's process\"]},\n{prompt:\"C. State ONE limitation of the Brinson-Hood-Beebower decomposition. (4 points)\",points:4,model:\"It assumes buy-and-hold within the period - real portfolios trade intra-period and hold cash, so realized trading and timing effects are not captured; and the interaction term has no clean economic owner, which is why many practitioners fold it into selection. Accept either limitation stated clearly.\",keys:[\"Buy-and-hold assumption ignores intra-period trading/cash\",\"Interaction term is economically ambiguous (often merged into selection)\"]}]}\n];\n\n// ===================== CFA LEVEL III - MOCK 2, SESSION 2 (5 item sets + 6 essay sets, 132 points) =====================\n// Fresh content; Mock 1 sub-topics not repeated. Numbers verified. Item-set correct answers stored first (engine shuffles deterministically).\nvar L3_SETS_S4=[\n{id:\"l3m2-ethics2\",sess:2,kind:\"item\",t:\"ethics\",title:\"Item Set 7 - Records and research (Ethics)\",vig:\"Compliance reviews at Dhawan Advisors surface four files:\\n\\nA: Research notes supporting a 2022 Buy rating were kept only in the analyst's personal notebook, which left with the analyst when she resigned. No firm copy exists.\\n\\nB: A marketing page shows the firm's performance for 2020-2024, net of fees, but omits that the composite changed strategy in 2023.\\n\\nC: A senior manager personally guaranteed a client 'at least the RBI rate' on a market-linked product to close the mandate.\\n\\nD: An analyst covered a company for years, then joined its board and kept issuing research on it without any disclosure change.\",\nqs:[[\"File A is most directly a violation of:\",\"Standard V(C) - Record Retention: the firm must maintain records supporting its analysis and recommendations, and they are firm property\",\"Standard IV(A) - Loyalty only\",\"No violation - research notes are the analyst's personal work product\",\"Records supporting recommendations are firm property and must be retained (GIPS and V(C)); the firm's failure to keep copies after the analyst left leaves it unable to support the original recommendation.\"],\n[\"The marketing page in B most likely violates:\",\"Standard I(C) - Misrepresentation: omitting a material strategy change makes the performance history misleading\",\"Standard III(D) - Performance Presentation only if returns were overstated\",\"No violation - net-of-fee returns are best practice\",\"Performance must be fair, accurate and complete. A strategy change mid-history is material context; presenting the blended track record without disclosure misleads prospective clients about what produced the returns.\"],\n[\"The guarantee in C violates:\",\"Standard I(C) - Misrepresentation: no market-linked return can be guaranteed\",\"Standard III(A) - Loyalty, Prudence and Care\",\"No violation if the manager personally stands behind it\",\"Guaranteeing a minimum return on a market product is misrepresentation whether or not the manager 'means it' - a personal guarantee does not make the claim true or permissible.\"],\n[\"The analyst in D should:\",\"Disclose the board position prominently in all research and have the firm manage the conflict - ideally reassign coverage\",\"Continue covering, since expertise improves\",\"Stop researching permanently with no explanation\",\"A board seat at a covered company is a direct conflict of interest under Standard VI(A) - Disclosure of Conflicts, and it compromises I(B). Full, prominent disclosure is mandatory; best practice is reassigning coverage to an independent analyst.\"]]},\n{id:\"l3m2-cme\",sess:2,kind:\"item\",t:\"econ\",title:\"Item Set 8 - Building an equity return view (Economics / CME)\",vig:\"Strategist Ritu Sharma builds a 10-year expected return for the domestic equity market using the Grinold-Kroner model:\\n\\nExpected return = dividend yield + repurchase yield + real earnings growth + inflation + change in P/E\\n\\nInputs: dividend yield 2.0%, net repurchase yield 0.5%, expected real earnings growth 4.0%, expected inflation 3.0%, and her P/E model implies a -0.5% per year drag as multiples normalize.\",\nqs:[[\"The expected equity market return is closest to:\",\"9.0%\",\"6.5%\",\"11.0%\",\"2.0 + 0.5 + 4.0 + 3.0 - 0.5 = 9.0%. The model sums income, net buybacks, growth, inflation, and the valuation-change term.\"],\n[\"If Sharma's P/E model instead implied a +0.5% annual re-rating, the estimate would be:\",\"10.0%\",\"9.0%\",\"9.5%\",\"Replacing -0.5 with +0.5 moves the total by 1.0 point: 10.0%. The valuation-change term is usually the least persistent input - long-horizon estimates often set it toward zero.\"],\n[\"The repurchase yield term properly includes:\",\"Net buybacks - gross repurchases minus new share issuance\",\"All announced buyback intentions\",\"Only cash dividends not yet paid\",\"Dilution from issuance offsets buybacks; the correct input is the NET repurchase yield. Companies issuing as much as they repurchase contribute zero here.\"],\n[\"A key limitation of the Grinold-Kroner estimate is:\",\"It is only as good as its inputs - the growth and P/E-change terms are forecasts that can be badly wrong\",\"It ignores dividends\",\"It cannot be used for markets outside the US\",\"The model is a disciplined accounting identity for expected return, but the earnings-growth and re-rating terms are judgmental forecasts; treating the output as precise overstates it.\"]]},\n{id:\"l3m2-rebal\",sess:2,kind:\"item\",t:\"pm\",title:\"Item Set 9 - Keeping the mix (Portfolio Management)\",vig:\"A 60/40 equity/bond policy portfolio has target corridors of ±5 percentage points on equity. Equities rally: the mix drifts to 66/34. Transaction costs are material, and the asset committee debates calendar versus corridor rebalancing, and how the corridor width should relate to costs, volatility and correlation.\",\nqs:[[\"With a ±5-point corridor, the 66/34 mix:\",\"Breaches the 65% trigger - rebalance back toward 60/40\",\"Is within tolerance - no action\",\"Requires a full rebalance to exactly 60.00% by rule\",\"66% exceeds the 60+5 trigger. Corridor rebalancing acts when a boundary is crossed; practice is to trade back toward (not necessarily exactly to) target - the key is that the breach forces a decision, unlike calendar rebalancing which ignores drift between dates.\"],\n[\"All else equal, a HIGHER transaction cost environment justifies:\",\"Wider corridors - expensive trading raises the hurdle for acting\",\"Narrower corridors - trade more precisely\",\"Daily calendar rebalancing\",\"Rebalancing balances tracking error against cost. Costlier trading means deviations must be larger before correction pays - wider corridors or less frequent review.\"],\n[\"Higher asset volatility, all else equal, argues for:\",\"Tighter corridors, because the mix drifts out of bounds faster\",\"Wider corridors\",\"No change\",\"More volatile assets breach a fixed corridor more often; holding rebalancing frequency steady, higher volatility argues for narrower bands - though the interaction with costs and correlation makes this a judgment, not a formula.\"],\n[\"Compared with calendar rebalancing, corridor (percentage-of-portfolio) rebalancing:\",\"Controls risk exposure at all times but can trade more often in trending markets\",\"Is always cheaper\",\"Ignores how far the mix has drifted\",\"Calendar rebalancing trades on schedule regardless of drift; corridors monitor continuously and trade on breach. Corridors keep risk nearer target but may trade into strong trends; costs and governance decide which fits.\"]]},\n{id:\"l3m2-fx\",sess:2,kind:\"item\",t:\"deriv\",title:\"Item Set 10 - Hedging the euro inflow (Derivatives)\",vig:\"Exporter Nandi Engineering expects a 10 million euro payment in 6 months. EUR/INR spot is 90.00. Six-month forward points are +1.80 (the euro trades at a forward premium because euro rates are below rupee rates). The treasurer considers: (1) selling euros forward; (2) leaving it unhedged; (3) a minimum-variance cross-hedge framework for a different exposure where only a correlated proxy contract exists (correlation 0.85, exposure volatility 6%, proxy volatility 7.5%).\",\nqs:[[\"Selling the 10 million euros forward at the premium locks in approximately:\",\"91.80 rupees per euro - 918 million total\",\"90.00 - spot is always the hedge price\",\"88.20 - forward points are subtracted\",\"Forward = spot + points = 90.00 + 1.80 = 91.80. The exporter sells euros at the forward premium, locking 10,000,000 x 91.80 = 918 million rupees regardless of the spot outcome.\"],\n[\"The +1.80 forward premium arises because:\",\"Euro interest rates are below rupee rates - covered interest parity prices the euro higher forward\",\"The market expects the euro to rally\",\"Banks charge a markup called points\",\"Covered interest parity: the lower-yielding currency trades at a forward premium by roughly the rate differential. It is arithmetic, not a forecast - the forward premium is not an expected appreciation.\"],\n[\"Leaving the receipt unhedged is best described as:\",\"A speculative open currency position - the firm is short euro/rupee volatility whether it wants the view or not\",\"Risk-free, because the sale is contracted\",\"A neutral business decision with no market exposure\",\"An unhedged foreign receipt is a full currency bet: the rupee value swings with EUR/INR. For an operating exporter, that exposure is incidental to its business - which is why policy, not market views, should drive the hedge ratio.\"],\n[\"The minimum-variance hedge ratio for the proxy cross-hedge is closest to:\",\"0.68\",\"1.18\",\"0.85\",\"Minimum-variance hedge ratio = correlation x (sigma exposure / sigma proxy) = 0.85 x (6.0/7.5) = 0.68. Contract count scales the exposure by this ratio - it reflects both relative volatility and co-movement.\"]]},\n{id:\"l3m2-hf\",sess:2,kind:\"item\",t:\"alt\",title:\"Item Set 11 - Mapping the hedge funds (Alternative Investments)\",vig:\"Consultant Devika Menon classifies four managers for an endowment:\\n\\nFund W: buys convertible bonds and shorts the underlying stock to harvest volatility and the bond floor.\\nFund X: long/short equities in pairs with net market exposure pinned near zero, profiting from stock selection.\\nFund Y: trades index futures and currencies on macroeconomic views - central bank paths, elections.\\nFund Z: buys the stock of announced acquisition targets and shorts the acquirer at the deal's exchange ratio.\",\nqs:[[\"Fund W is best classified as:\",\"Convertible arbitrage\",\"Equity market neutral\",\"Global macro\",\"Long the convertible, short the stock: the classic convertible arbitrage structure - extracts cheap embedded optionality while hedging equity delta.\"],\n[\"Fund X is best classified as:\",\"Equity market neutral\",\"Convertible arbitrage\",\"Dedicated short bias\",\"Net exposure near zero with long/short stock pairs defines equity market neutral: returns come from selection alpha, not market beta.\"],\n[\"Fund Y is bes
