 AR(1) with b1 = 1.0 was correctly rejected because:\",\"It is a random walk - not covariance stationary, so mean and variance are not stable and the regression statistics are invalid\",\"Its forecasts would be too accurate\",\"It violates the assumption that residuals have a mean of zero\",\"Covariance stationarity requires |b1| < 1. At b1 = 1 the series is a random walk with no mean-reverting level (b0/(1-b1) is undefined), and standard t-tests on the regression are invalid - the model must be re-specified, usually in first differences.\"]]},\n{id:\"l2m2-econ2\",sess:2,kind:\"item\",t:\"econ\",title:\"Vignette 14 - The policy mix (Economics)\",vig:\"Economist Ira Bhosale briefs clients on a small open economy with high capital mobility and a freely floating currency. The government announces a large fiscal expansion (higher spending, wider deficit) while the central bank simultaneously cuts rates. She also fields questions on the 'impossible trinity' and what sustained money-printing does to a currency.\",\nqs:[[\"Under high capital mobility with a floating currency, the fiscal expansion alone most likely causes:\",\"The currency to appreciate, as capital flows in to chase higher interest rates\",\"The currency to depreciate immediately\",\"No change, because floating rates insulate the economy\",\"Mundell-Fleming: with mobile capital, fiscal expansion pushes domestic rates up, attracting capital inflows that bid the currency UP - which then dampens net exports and blunts the stimulus.\"],\n[\"The central bank's rate cut alongside the fiscal expansion most likely:\",\"Offsets the currency appreciation - monetary easing pushes the currency down, supporting net exports\",\"Reinforces the appreciation\",\"Has no currency effect because rates are a domestic matter\",\"An easy monetary stance lowers rates and drives capital out, depreciating the currency. Combined with fiscal expansion it counteracts the fiscal-driven appreciation - the classic policy-mix question.\"],\n[\"The 'impossible trinity' (trilemma) states that a country cannot simultaneously have:\",\"Free capital movement, a fixed exchange rate, and an independent monetary policy\",\"Low inflation, low unemployment, and low deficits\",\"Open trade, floating currency, and fiscal surpluses\",\"Only two of the three can coexist. Fixing the exchange rate with open capital markets hands monetary policy to the anchor country; keeping monetary independence with open capital flows requires letting the currency float.\"],\n[\"If the central bank persistently expands money supply faster than trading partners, the monetary approach predicts the currency will:\",\"Depreciate over time roughly in line with the excess money growth\",\"Appreciate, because liquidity attracts capital\",\"Be unaffected, because money is neutral\",\"The monetary approach ties exchange rates to relative money supplies and real demand. Sustained excess money growth raises the price level and weakens the currency proportionally - purchasing power parity's cousin.\"]]},\n{id:\"l2m2-fra3\",sess:2,kind:\"item\",t:\"fra\",title:\"Vignette 15 - Quality control (Financial Statement Analysis)\",vig:\"Analyst Saurabh Jain screens Tekno Components for earnings quality. The year shows: net income 120 million rupees, operating cash flow 80 million. Revenue grew 8%, but days sales outstanding stretched from 40 to 52 days. The company capitalized 15 million of software spending it used to expense, and changed its warranty provision from 2% to 1% of sales 'based on experience'.\",\nqs:[[\"The gap between net income (120) and operating cash flow (80) most likely suggests:\",\"Accrual-heavy earnings - profits booked faster than cash arrives, a quality red flag\",\"Strong earnings quality, because accruals smooth timing\",\"Nothing - CFO is always below net income\",\"Persistent NI > CFO means earnings rest on accruals rather than cash. CFO/NI of 0.67 warrants digging into receivables and revenue recognition; healthy firms roughly convert profits into cash over time.\"],\n[\"The jump in DSO from 40 to 52 days while revenue grew only 8% most likely indicates:\",\"Receivables growing far faster than sales - possibly channel stuffing or relaxed credit terms booked as revenue\",\"Improved collection efficiency\",\"A pure seasonality effect that can be ignored\",\"Receivables outpacing revenue is the classic aggressive-recognition signal: sales may be pulled forward or granted to weaker credits. It inflates both revenue and the NI-CFO gap.\"],\n[\"Capitalizing 15 million of previously expensed software costs has which effect this year:\",\"Raises reported profit, and shifts the cash outflow from operating to investing - flattering both this year's earnings and CFO\",\"Lowers profit but raises operating cash flow\",\"No effect - it is a non-cash change\",\"Capitalizing converts a current expense into an asset: this year's expense falls (profit up) and the cash outflow moves from CFO to CFI, flattering BOTH earnings and operating cash flow. It also creates future amortization drag.\"],\n[\"Halving the warranty provision to 1% of sales most likely:\",\"Boosts current earnings and is an accounting estimate change that deserves scrutiny when it coincides with other red flags\",\"Is mandatory under accounting standards\",\"Reduces revenue by 1%\",\"Warranty provisions are estimates; cutting them releases expense straight to earnings. A convenient estimate change layered on rising DSO and capitalization shifts the pattern toward aggressive reporting - each item alone may be defensible; together they are a story.\"]]},\n{id:\"l2m2-fra4\",sess:2,kind:\"item\",t:\"fra\",title:\"Vignette 16 - Paying in shares (Financial Statement Analysis)\",vig:\"Zephyr Industries grants its CEO 10,000 stock options on 1 January. The grant-date fair value per option (from an option-pricing model) is 5 rupees. The options vest over 3 years of continued service. Separately, Zephyr grants cash-settled stock appreciation rights (SARs) to senior managers.\\n\\nThe CFO asks how each award hits the income statement over time.\",\nqs:[[\"The annual compensation expense recognized for the options is closest to:\",\"16,667 rupees\",\"50,000 rupees in year 1, then zero\",\"Zero until exercise\",\"Equity-settled awards expense the GRANT-DATE fair value over the vesting period: 10,000 x 5 = 50,000 over 3 years = 16,667 per year. Later share-price moves do not change the expense.\"],\n[\"The expense for the options is measured using:\",\"Grant-date fair value, never remeasured\",\"Fair value remeasured at every reporting date\",\"Intrinsic value at exercise\",\"Equity-settled share-based payments lock in grant-date fair value and spread it over the service period. Remeasurement to current fair value is the treatment for CASH-settled awards, not equity-settled ones.\"],\n[\"The cash-settled SARs are accounted for by:\",\"Remeasuring the liability to fair value each reporting date, with changes through profit or loss\",\"Spreading grant-date value over vesting with no remeasurement\",\"Recording nothing until settlement\",\"Cash-settled awards create a LIABILITY remeasured at each reporting date; fair-value changes flow through earnings until settlement - more income-statement volatility than equity-settled grants.\"],\n[\"Compared with expensing options fairly, assuming them away (no expense) would:\",\"Overstate operating income and understate true compensation cost\",\"Have no effect because options are non-cash\",\"Only affect the balance sheet\",\"Options are real economic pay. Expensing them, though non-cash, matches the cost of the service received to the period; skipping the expense flatters margins - which is exactly why standards require it.\"]]},\n{id:\"l2m2-corp2\",sess:2,kind:\"item\",t:\"corp\",title:\"Vignette 17 - The discount rate question (Corporate Issuers)\",vig:\"CFO Anand Kulkarni of Trident Engineering sets the firm's cost of capital. Capital structure target: 30% debt, 70% equity. Pre-tax cost of debt 7.0%, tax rate 30%, and the CAPM cost of equity is 12.0%.\\n\\nTwo debates follow: how to treat the 4% flotation cost on a planned new share issue, and whether the firm's high-risk mining division should use Trident's WACC for its own projects.\",\nqs:[[\"Trident's weighted average cost of capital is closest to:\",\"9.87%\",\"9.10%\",\"10.50%\",\"WACC = 0.30 x 7.0% x (1 - 0.30) + 0.70 x 12.0% = 1.47% + 8.40% = 9.87%. Debt enters after tax; equity has no tax shield.\"],\n[\"The theoretically preferred treatment of the 4% flotation cost on the new equity is:\",\"Subtract it from the project's initial cash flow, rather than inflating the cost of equity\",\"Add 4% to the cost of equity in the WACC\",\"Ignore it - flotation is a financing detail, not an investment one\",\"Flotation costs are a real project cash outflow, not a permanent rise in the cost of capital. Spreading them into the discount rate overstates the hurdle for long projects; the NPV-preferred treatment deducts them from the initial outlay.\"],\n[\"Using Trident's 9.87% WACC to evaluate the riskier mining division's projects would:\",\"Make bad projects look acceptable - the division needs a higher, division-specific discount rate\",\"Be conservative and reject too many projects\",\"Be exactly right, since one firm means one rate\",\"The discount rate must reflect the project's risk, not the firm's average. A company-wide WACC is too low for a high-risk division: its negative-NPV projects can clear the bar, and capital drifts into the riskiest units.\"],\n[\"The weights in the WACC should be:\",\"Target market-value weights the firm intends to maintain\",\"Current book values from the balance sheet\",\"Whatever mix existed when the oldest project started\",\"WACC uses the TARGET capital structure at market values - the mix the firm will raise going forward. Book values record history, and market values capture the current opportunity cost of each source.\"]]},\n{id:\"l2m2-equity2\",sess:2,kind:\"item\",t:\"equity\",title:\"Vignette 18 - Free cash flow at Pavan Auto (Equity)\",vig:\"Analyst Lakshmi Menon values Pavan Auto. Forecast EBIT 100 million rupees, tax rate 30%, depreciation 20 million, capital expenditure 30 million, increase in working capital 10 million. Free cash flow to the firm then grows 4% forever, and the WACC is 9%. Net debt outstanding is 240 million; 40 million shares are outstanding. The stock trades at 17.\",\nqs:[[\"Pavan's forecast FCFF is closest to:\",\"50 million\",\"70 million\",\"40 million\",\"FCFF = EBIT(1-t) + Dep - FCInv - WCInv = 100 x 0.7 + 20 - 30 - 10 = 70 + 20 - 30 - 10 = 50 million.\"],\n[\"The value of the whole firm is closest to:\",\"1,040 million\",\"1,000 million\",\"556 million\",\"Single-stage FCFF: Firm value = FCFF x (1+g)/(WACC-g) = 50 x 1.04/0.05 = 52/0.05 = 1,040 million. Discount FCFF at WACC because it belongs to ALL capital providers.\"],\n[\"The value per share is closest to:\",\"20.00\",\"26.00\",\"14.00\",\"Equity value = 1,040 - 240 net debt = 800 million; per share 800/40 = 20.00. At a market price of 17 the stock looks undervalued on these forecasts.\"],\n[\"If Lakshmi instead modeled FCFE (free cash flow to equity), the correct discount rate would be:\",\"The cost of equity, not the WACC\",\"The after-tax cost of debt\",\"The same 9% WACC\",\"Match the flow to the rate: FCFF (flows to all providers) discounts at WACC; FCFE (flows to shareholders only) discounts at the cost of equity. Mixing them misvalues the firm in a leveraged structure.\"]]},\n{id:\"l2m2-fi2\",sess:2,kind:\"item\",t:\"fixed\",title:\"Vignette 19 - Up the tree (Fixed Income)\",vig:\"Quant Sameer Khatri values a 2-year 5% annual-coupon bond (face 100) with a binomial interest-rate tree. Today's 1-year rate is 4.0%. One year from now the rate is either 6.0% (up) or 4.5% (down), each with 50% probability.\\n\\nHe then adds an issuer call option at par (100), exercisable in one year.\",\nqs:[[\"The bond's value at the up node (one year out) is closest to:\",\"99.06\",\"100.00\",\"105.00\",\"At the up node one year remains: V1u = (100 + 5)/1.06 = 99.06. Higher rates, lower price - the remaining 105 payment is discounted at 6%.\"],\n[\"The bond's value today is closest to:\",\"100.74\",\"100.00\",\"99.55\",\"V1d = 105/1.045 = 100.48. V0 = [0.5 x (99.06+5) + 0.5 x (100.48+5)]/1.04 = (52.03 + 52.74)/1.04 = 104.77/1.04 = 100.74. Each node discounts expected next-year value plus coupon at that node's rate.\"],\n[\"Adding the issuer call at 100 changes today's value to approximately:\",\"100.51 - the callable bond is worth less, the call being worth about 0.23\",\"101.20 - options always add value\",\"100.74 - the call never binds\",\"At the down node the bond is worth 100.48, but the issuer calls at 100, capping it. Callable V0 = [0.5 x (99.06+5) + 0.5 x (100+5)]/1.04 = 104.53/1.04 = 100.51. Call option value = 100.74 - 100.51 = 0.23 - value the issuer holds against the investor.\"],\n[\"If instead the investor held an embedded PUT at 100, the bond would:\",\"Be worth more than 100.74, because the investor can sell back at 100 when rates rise\",\"Be worth the same 100.74\",\"Be worth less, mirroring the call\",\"A putable bond protects the investor: at the up node (value 99.06) the investor puts at 100. Putable value = [0.5 x (100+5) + 0.5 x (100.48+5)]/1.04 = 105.24/1.04 = 101.19 > 100.74. Investor-held options add value; issuer-held options subtract.\"]]},\n{id:\"l2m2-deriv2\",sess:2,kind:\"item\",t:\"deriv\",title:\"Vignette 20 - One step, two branches (Derivatives)\",vig:\"Dealer Chirag Shah prices a 1-year European call on Tamarind Agro stock with a one-period binomial model. Spot S0 = 40, strike K = 42, up factor u = 1.25, down factor d = 0.80, risk-free rate 5% (annual). He also wants the synthetic hedge ratio and the equivalent put price.\",\nqs:[[\"The risk-neutral up probability is closest to:\",\"0.556\",\"0.500\",\"0.625\",\"pi = (1 + r - d)/(u - d) = (1.05 - 0.80)/(1.25 - 0.80) = 0.25/0.45 = 0.5556. Risk-neutral probabilities come from the factors and the rate - not from any view on the stock.\"],\n[\"The value of the 1-year call is closest to:\",\"4.23\",\"8.00\",\"2.00\",\"Su = 50 gives Cu = 8; Sd = 32 gives Cd = 0. C = [0.5556 x 8 + 0.4444 x 0]/1.05 = 4.444/1.05 = 4.23. Discount the risk-neutral expected payoff one year.\"],\n[\"The hedge ratio (shares per short call) is closest to:\",\"0.44\",\"1.00\",\"0.25\",\"h = (Cu - Cd)/(Su - Sd) = (8 - 0)/(50 - 32) = 8/18 = 0.4444. Holding 0.44 shares against each short call makes the portfolio worth the same in both states - that is where risk-neutral pricing comes from.\"],\n[\"The 1-year put with the same 42 strike is closest to:\",\"4.23\",\"1.77\",\"6.00\",\"Put-call parity with a forward-style discount: P = C - S0 + K/(1+r) = 4.23 - 40 + 42/1.05 = 4.23 - 40 + 40 = 4.23. The strike's present value exactly equals the stock price here, so put and call carry the same time value.\"]]},\n{id:\"l2m2-alt2\",sess:2,kind:\"item\",t:\"alt\",title:\"Vignette 21 - The buyout (Alternative Investments)\",vig:\"PE fund Arjuna Partners buys manufacturing firm Koral Industries for an enterprise value of 100 million rupees, financed with 60 million of debt and 40 million of fund equity. Over four years, Koral grows EBITDA and pays down debt; at exit the enterprise sells for 140 million with 20 million of debt remaining.\\n\\nThe fund's LPA calls for an 8% hurdle, 20% carried interest, and management fees on committed capital.\",\nqs:[[\"The equity multiple (MOIC) on the deal is:\",\"3.0x\",\"3.5x\",\"2.0x\",\"Equity out at exit = 140 - 20 = 120 million; equity in = 40 million. MOIC = 120/40 = 3.0x. Debt paydown plus EBITDA growth does the heavy lifting - the classic LBO engine.\"],\n[\"The fund's IRR over the four years is closest to:\",\"32%\",\"25%\",\"40%\",\"IRR = MOIC^(1/n) - 1 = 3.0^(1/4) - 1 = 31.6%, about 32%. IRR compresses with holding period: the same 3.0x over six years would be about 20%.\"],\n[\"The 8% hurdle in the LPA means:\",\"Carried interest is earned only on profits above an 8% IRR to limited partners\",\"The GP keeps the first 8% of all gains\",\"Management fees fall to 8% in down years\",\"The preferred return: LPs must receive their capital plus an 8% IRR before the GP's 20% carry kicks in. It aligns the GP with genuine outperformance, not mere leverage.\"],\n[\"Charging management fees on committed capital (rather than invested capital) most likely:\",\"Front-loads GP income and can reward raising large funds over deploying them well\",\"Aligns fees perfectly with performance\",\"Is prohibited in most LPA structures\",\"Fees on committed capital are paid from day one on money not yet invested - steady GP income regardless of deployment. It is a standard L2 criticism of the PE fee model and a reason net LP returns lag headline MOICs.\"]]},\n{id:\"l2m2-pm2\",sess:2,kind:\"item\",t:\"pm\",title:\"Vignette 22 - Scoring the manager (Portfolio Management)\",vig:\"Consultant Reva Pillai grades a portfolio: return 14%, volatility 18%, beta 1.15. Risk-free rate 4%; market return 12%, market volatility 14%. The fund's tracking error against its benchmark is 4%.\",\nqs:[[\"The portfolio's Sharpe ratio is closest to:\",\"0.56\",\"0.78\",\"0.44\",\"Sharpe = (14 - 4)/18 = 0.556. Excess return per unit of TOTAL volatility - right for an investor's whole portfolio.\"],\n[\"The portfolio's Treynor ratio is closest to:\",\"8.70\",\"12.17\",\"0.56\",\"Treynor = (14 - 4)/1.15 = 8.70 (in percent). Excess return per unit of SYSTEMATIC risk - appropriate when the portfolio is one slice of a diversified whole.\"],\n[\"The M-squared measure implies the portfolio:\",\"Earns a risk-adjusted 11.78% - slightly below the market's 12%, so it underperformed on a like-for-like risk basis\",\"Beat the market by 2 full points\",\"Exactly matched the market\",\"M2 = rf + Sharpe x sigma_market = 4 + 0.556 x 14 = 11.78%. Levering the portfolio to market-level volatility yields less than the market's own 12% - a slight underperformance despite the higher raw return.\"],\n[\"The portfolio's Jensen's alpha and information ratio are closest to:\",\"Alpha +0.8%; IR 0.50\",\"Alpha -1.2%; IR 0.50\",\"Alpha +0.8%; IR 3.0\",\"Jensen: 14 - [4 + 1.15 x (12-4)] = 14 - 13.2 = +0.8%. IR = active return / tracking error = (14 - 12)/4 = 0.50. Alpha prices performance against CAPM required return; IR prices it per unit of active risk.\"]]}\n];\n\n// ===================== CFA LEVEL II - MOCK 3, SESSION 1 (11 item sets, 44 questions) =====================\n// Fresh vignettes; Mocks 1-2 sub-topics not repeated. Numbers verified. Correct answer stored first; engine shuffles deterministically.\nvar L2_SETS_S5=[\n{id:\"l2m3-ethics\",sess:1,kind:\"item\",t:\"ethics\",title:\"Vignette 1 - Four envelopes (Ethics)\",vig:\"At Braganza Capital, four matters land in the same week:\\n\\nA: A long-standing client tells portfolio manager Fiona Braganza, CFA, that a recent account inflow 'came from a business you would not approve of' and asks her to keep it quiet. The activity is legal but ethically distasteful to Fiona.\\n\\nB: A supervisor learns a junior analyst has been publishing research without the required review, for months, and the supervisor's firm has no documented review procedure at all.\\n\\nC: A candidate who passed Level II tells colleagues: 'As a CFA charterholder-in-waiting, I guarantee my process is the industry standard.'\\n\\nD: A departing portfolio manager downloads the firm's model - which he built himself during employment - to use at his next job.\",\nqs:[[\"In A, Fiona's duty of confidentiality under Standard III(E) means she must:\",\"Keep the client's information confidential - the activity is legal, and III(E) protects even distasteful client information\",\"Report the client to the regulators immediately\",\"Resign the account publicly to send a message\",\"Confidentiality covers client information unless it concerns ILLEGAL activity (or disclosure is legally required or the client permits). Legal-but-distasteful business is the client's private affair; Fiona may raise it with the client or disengage per firm policy, but not disclose.\"],\n[\"In B, the supervisor's firm is most exposed under:\",\"Standard IV(C) - Responsibilities of Supervisors: without a reasonable review procedure, the firm failed to establish a system that would prevent the violation\",\"Standard V(A) - Diligence and Reasonable Basis only\",\"No standard - the analyst alone is responsible\",\"IV(C) requires reasonable procedures to prevent and detect violations. The complete absence of a review process is itself the violation - the firm cannot delegate that duty away, and the undetected months of unreviewed research are the predictable result.\"],\n[\"The candidate's statement in C is improper because:\",\"There is no such status as 'charterholder-in-waiting', and guaranteeing a standard of work is misrepresentation\",\"CFA candidates may never mention the program\",\"The word 'guarantee' is acceptable between colleagues\",\"Standard VII(B) governs references to the designation: candidates state candidacy accurately (e.g. 'passed Level II'), and no one may imply the charter guarantees competence or performance. Both the invented status and the guarantee fail.\"],\n[\"The model in D:\",\"Belongs to the firm - work product created during employment cannot be taken without permission, even by its author\",\"Belongs to the manager, who wrote it\",\"May be taken if no client data is included\",\"Standard IV(A) - Loyalty: work product created on the employer's time and resources is the employer's property. Authorship does not transfer ownership; he must rebuild from memory/public sources or get written permission.\"]]},\n{id:\"l2m3-quant\",sess:1,kind:\"item\",t:\"quant\",title:\"Vignette 2 - The restricted model (Quantitative Methods)\",vig:\"Analyst Ketan Joshi tests whether two sector dummies jointly matter in his return regression. Unrestricted model: SSE = 300, with n - k - 1 = 50 residual degrees of freedom. Restricted model (dummies dropped): SSE = 400. He also notices his full model has R-squared of 0.91 while every slope t-statistic is insignificant.\",\nqs:[[\"The F-statistic for the joint significance of the two dummies is closest to:\",\"8.33\",\"4.17\",\"16.67\",\"F = ((SSE_restricted - SSE_unrestricted)/q) / (SSE_unrestricted/(n-k-1)) = ((400-300)/2) / (300/50) = 50/6 = 8.33. Compare against the F critical value with (2, 50) degrees of freedom.\"],\n[\"The combination of R-squared = 0.91 with individually insignificant t-statistics most likely signals:\",\"Multicollinearity - the regressors move together, so the model explains a lot but cannot isolate each variable's effect\",\"Heteroskedasticity\",\"A perfect model\",\"High overall fit plus no individually significant slopes is the textbook multicollinearity fingerprint: variables carry shared information, inflating standard errors while the joint fit stays strong.\"],\n[\"A practical response to severe multicollinearity is:\",\"Drop or combine correlated regressors, accepting a simpler, more stable model\",\"Add more correlated variables\",\"Report only the R-squared\",\"There is no statistical fix that keeps all variables; standard practice drops or combines the collinear ones (or uses stepwise/principal components), trading 'completeness' for estimable, stable coefficients.\"],\n[\"If Ketan instead suspects the error variance grows with firm size, the right test and remedy are:\",\"Breusch-Pagan for detection; White-corrected (robust) standard errors for inference\",\"Durbin-Watson; first differences\",\"F-test; drop the intercept\",\"Conditional heteroskedasticity is detected with Breusch-Pagan; coefficients stay unbiased but standard errors are wrong, so use robust (White) standard errors for the t and F tests.\"]]},\n{id:\"l2m3-econ\",sess:1,kind:\"item\",t:\"econ\",title:\"Vignette 3 - Relative prices (Economics)\",vig:\"Economist Lara D'Souza studies the INR/EUR rate. Expected inflation: India 6%, euro area 2%. Current spot: 90.00 INR per EUR. A client asks what relative purchasing power parity implies, why the real exchange rate matters more than the nominal for competitiveness, and what the Balassa-Samuelson effect adds.\",\nqs:[[\"Under relative PPP, the rupee is expected over the year to:\",\"Depreciate by about 3.9% against the euro\",\"Appreciate by about 4%\",\"Stay at 90, since PPP holds only in levels\",\"Relative PPP: the high-inflation currency loses value by roughly the inflation differential - precisely 1.06/1.02 - 1 = 3.92%. Expected spot about 90 x 1.0392 = 93.5 INR per EUR.\"],\n[\"The real exchange rate differs from the nominal in that it:\",\"Adjusts for relative price levels - competitiveness depends on it, not the nominal rate alone\",\"Is set by central banks\",\"Excludes services trade\",\"A nominal depreciation with high domestic inflation may buy no competitiveness at all: the real rate = nominal rate x (foreign price level / domestic). Only real depreciation makes exports genuinely cheaper.\"],\n[\"The Balassa-Samuelson effect predicts that countries with fast productivity growth in TRADABLE goods will see:\",\"Real exchange rate appreciation over time, as wages and non-tradable prices rise\",\"Permanent currency weakness\",\"Falling price levels\",\"Productivity gains in tradables raise economy-wide wages; non-tradable prices rise without productivity gains, lifting the overall price level - a real appreciation. It is the standard explanation for rich countries' high price levels.\"],\n[\"For long-horizon forecasting, the combination of PPP and Balassa-Samuelson implies the rupee's path is best described as:\",\"Nominal depreciation from the inflation gap, partly offset in real terms if India's tradable productivity keeps outpacing Europe's\",\"Certain nominal appreciation\",\"Random with no anchor\",\"The inflation differential pushes the nominal rate up (weaker rupee), while a productivity advantage supports the real rate - the two forces coexist, which is why long-horizon currency work separates nominal from real drivers.\"]]},\n{id:\"l2m3-fra1\",sess:1,kind:\"item\",t:\"fra\",title:\"Vignette 4 - Buying Beta outright (Financial Statement Analysis)\",vig:\"Alpha Industries acquires 100% of Beta Chemicals for 500 million rupees in cash. The fair value of Beta's identifiable net assets at the date is 420 million. Transaction costs (legal, advisory) are 8 million. Two years later, Beta's cash-generating unit - carrying value 500 million including the goodwill - fails a review: its recoverable amount is 460 million.\",\nqs:[[\"Goodwill recognized at acquisition is:\",\"80 million\",\"92 million\",\"500 million\",\"Goodwill = consideration 500 - fair value of identifiable net assets 420 = 80 million. Transaction costs are expensed, NOT added to the purchase price (IFRS/US GAAP acquisition method).\"],\n[\"The 8 million of transaction costs are:\",\"Expensed as incurred\",\"Capitalized into goodwill\",\"Netted against retained earnings directly\",\"Acquisition-related costs are expensed in the period under the acquisition method; only the consideration paid (500) feeds the goodwill computation.\"],\n[\"The impairment charge two years later is:\",\"40 million, recognized in profit or loss\",\"60 million, recognized in OCI\",\"No charge - goodwill is never tested\",\"Recoverable 460 < carrying 500: impairment 40 million, allocated first to goodwill (wiping half of it), charged to earnings. Goodwill is tested annually, not amortized, and impairments are not reversed.\"],\n[\"If Alpha had instead bought 80% of Beta for 400 million, with non-controlling interest at fair value of 100 million, goodwill under the FULL goodwill method would be:\",\"80 million\",\"64 million\",\"96 million\",\"Full goodwill: consideration 400 + NCI at fair value 100 - net assets 420 = 80 million. (Partial-goodwill method, allowed under IFRS, would recognize only Alpha's share: 400 - 0.8 x 420 = 64 million.)\"]]},\n{id:\"l2m3-fra2\",sess:1,kind:\"item\",t:\"fra\",title:\"Vignette 5 - Reading cash flow quality (Financial Statement Analysis)\",vig:\"Analyst Rhea Kapoor compares two rivals on accruals quality. Firm A: net income 100 million, CFO 110 million, average net operating assets 800 million. Firm B: net income 130 million, CFO 90 million, average net operating assets 750 million, and receivables growing twice as fast as sales.\",\nqs:[[\"Firm A's balance-sheet accruals ratio is closest to:\",\"-1.25%\",\"+1.25%\",\"+13.75%\",\"Balance-sheet accruals = NI - CFO = 100 - 110 = -10 million. Ratio = -10/800 = -1.25%. Negative accruals - earnings backed by MORE cash than booked - signal high quality.\"],\n[\"Firm B's accruals ratio is closest to:\",\"+5.3%\",\"+4.0%\",\"-5.3%\",\"NI - CFO = 130 - 90 = 40 million; 40/750 = 5.33%. A persistently positive ratio - profits outpacing cash - is the accrual-quality warning, especially with receivables racing ahead of sales.\"],\n[\"The receivables pattern at Firm B most strongly suggests:\",\"Possible aggressive revenue recognition - booking sales ahead of collection\",\"Superior credit management\",\"A defensible growth story with no quality concern\",\"Receivables compounding at twice the sales rate means the firm is booking revenue it is not collecting - the signature of channel stuffing or weakened credit standards.\"],\n[\"Across many firms, research on accruals indicates that high-accrual firms tend to:\",\"Underperform subsequently, as the accrual portion of earnings reverses\",\"Outperform, because accruals signal confidence\",\"Perform identically - accruals are noise\",\"The accrual anomaly: earnings heavy with accruals are less persistent; the accrual component tends to reverse, and high-accrual stocks underperform on average. Cash-backed earnings persist.\"]]},\n{id:\"l2m3-corp\",sess:1,kind:\"item\",t:\"corp\",title:\"Vignette 6 - The buyback debate (Corporate Issuers)\",vig:\"Zenith Foods has 2.0 million shares at 50 rupees each, net income 12 million, and book equity of 80 million (40 per share). The board proposes using 10 million of surplus cash to repurchase shares at the market price, instead of paying the same amount as a special dividend. The CFO wants the EPS, BVPS and shareholder-value effects laid out.\",\nqs:[[\"EPS after the buyback is closest to:\",\"6.67\",\"6.00\",\"5.45\",\"Shares repurchased = 10 million / 50 = 200,000, leaving 1.8 million shares. EPS = 12 / 1.8 = 6.67, up from 6.00. (Ignoring the small interest income lost on the cash - the standard first-pass answer.)\"],\n[\"Book value per share after the buyback:\",\"Falls to about 38.89, because shares were bought ABOVE book value\",\"Rises to 41.11\",\"Stays at 40.00\",\"New book equity = 80 - 10 = 70 million over 1.8 million shares = 38.89. Buying back above book dilutes BVPS; buying back below book raises it. BVPS and market value are different questions.\"],\n[\"For a shareholder, the buyback versus an equal special dividend is, before taxes and market reaction:\",\"Economically equivalent in value terms - the choice is about taxes, signaling and flexibility\",\"Clearly better, because EPS rises\",\"Clearly worse, because cash leaves the firm\",\"Share repurchase and a same-rupee dividend deliver the same pre-tax value in the frictionless case; real-world choice hinges on tax treatment, the flexibility of an irregular payout, and the signal sent. EPS accretion alone is not value creation.\"],\n[\"A repurchase is most likely to CREATE value when:\",\"The shares are repurchased below their intrinsic value\",\"The shares are repurchased above intrinsic value\",\"The firm borrows at any cost to fund it\",\"Buying back undervalued stock transfers value from selling to remaining shareholders; overpaying destroys it. The accretion math (earnings yield vs after-tax borrowing cost) is only half the story - intrinsic value is the anchor.\"]]},\n{id:\"l2m3-equity\",sess:1,kind:\"item\",t:\"equity\",title:\"Vignette 7 - Price relative to book (Equity)\",vig:\"Analyst Nora Iyer compares two banks. Bank Tara: ROE 14%, growth 6%, required return 10%, P/E 20 with earnings growing 16%. Bank Seena: ROE 9%, growth 6%, required return 10%.\",\nqs:[[\"Bank Tara's justified P/B ratio is closest to:\",\"2.0\",\"1.4\",\"0.9\",\"Justified P/B = (ROE - g)/(r - g) = (14% - 6%)/(10% - 6%) = 8/4 = 2.0. A bank earning above its cost of equity deserves a premium to book.\"],\n[\"Bank Seena's justified P/B is closest to:\",\"0.75\",\"1.25\",\"1.0\",\"(9% - 6%)/(10% - 6%) = 3/4 = 0.75. ROE below the required return destroys value: growth at 6% while earning 9% against a 10% cost means the market should price the bank BELOW book.\"],\n[\"Bank Tara's PEG ratio (P/E divided by expected growth in percent) is closest to:\",\"1.25\",\"0.80\",\"2.00\",\"PEG = 20/16 = 1.25. Above 1.0, investors pay more per unit of growth than the naive 1.0 anchor - defensible only if growth persistence or quality is superior.\"],\n[\"The key limitation of the PEG screen is:\",\"It assumes a linear P/E-to-growth trade-off and ignores risk, payout and the duration of growth\",\"It uses book value\",\"It only works for banks\",\"PEG crams valuation into one ratio: it misses differences in required return, reinvestment quality, and how long growth lasts - two firms with the same PEG can have very different justified values.\"]]},\n{id:\"l2m3-fi\",sess:1,kind:\"item\",t:\"fixed\",title:\"Vignette 8 - Capacity under stress (Fixed Income)\",vig:\"Credit analyst Manav Shah rates a mid-size manufacturer. Year figures: EBITDA 100 million rupees, total debt 350 million, interest expense 25 million, funds from operations 80 million, capital expenditure 40 million, dividends 10 million. Covenants reference maximum debt/EBITDA of 4.0x and minimum EBITDA/interest of 3.0x.\",\nqs:[[\"The issuer's debt/EBITDA and EBITDA/interest are closest to:\",\"3.5x and 4.0x\",\"4.0x and 3.5x\",\"2.9x and 5.0x\",\"Debt/EBITDA = 350/100 = 3.5x (inside the 4.0x covenant cap); EBITDA/interest = 100/25 = 4.0x (above the 3.0x floor). Headroom exists but is thin on leverage.\"],\n[\"Free cash flow after capex and dividends is closest to:\",\"30 million\",\"80 million\",\"40 million\",\"FFO 80 - capex 40 - dividends 10 = 30 million. This is the discretionary cash genuinely available for deleveraging - the number credit committees watch.\"],\n[\"The FFO-to-debt ratio, a standard capacity metric, is closest to:\",\"22.9%\",\"28.6%\",\"11.4%\",\"FFO/debt = 80/350 = 22.9%. Rating-agency grids read low-20s as adequate for a mid-tier industrial but with little room for an EBITDA stumble.\"],\n[\"If a recession cuts EBITDA 25% while debt is unchanged, the covenant position becomes:\",\"Both covenants breached: 4.67x leverage and 3.0x coverage right at/beyond the limits\",\"Only leverage breaches\",\"Neither breaches\",\"EBITDA 75: debt/EBITDA = 350/75 = 4.67x > 4.0x breach; coverage = 75/25 = 3.0x = the floor - technically at, not above, the minimum, leaving zero cushion. Stress testing like this is the core of capacity analysis.\"]]},\n{id:\"l2m3-deriv\",sess:1,kind:\"item\",t:\"deriv\",title:\"Vignette 9 - Pricing the future (Derivatives)\",vig:\"Trader Kabir Anand prices a 6-month futures contract on a stock index. Spot index 900, annual risk-free rate 6% (6-month rate 3.0%), no dividends over the horizon. He then fields questions on futures versus forwards and why commodity futures add storage and convenience-yield terms.\",\nqs:[[\"The fair 6-month futures price is closest to:\",\"927\",\"900\",\"954\",\"F = S0 x (1+r)^T = 900 x 1.03 = 927. Cost of carry with no income: finance cost alone pushes the futures above spot.\"],\n[\"A quoted futures price of 950 most likely lets an arbitrageur:\",\"Sell the futures and buy the index with borrowed money, locking a riskless gain at expiry\",\"Buy the futures\",\"Do nothing - 950 reflects fair carry\",\"Market 950 > fair 927: futures rich. Cash-and-carry: borrow at 3%, buy the index at 900, deliver into the futures at 950 - the 23-point gap over carry is locked profit, minus frictions.\"],\n[\"Futures differ from forwards primarily in that futures:\",\"Are exchange-traded, standardized and marked to market daily, largely eliminating counterparty default risk\",\"Have no counterparty at all\",\"Always trade at a premium to forwards\",\"Daily settlement through the clearinghouse converts credit risk into margin flows; standardization adds liquidity but removes customization. Pricing theory is otherwise shared.\"],\n[\"For a storable commodity, the no-arbitrage futures price equals spot plus:\",\"Financing cost plus storage cost, minus the convenience yield of holding the physical\",\"Financing cost only\",\"Storage minus insurance\",\"Cost of carry generalized: F = (S0 + storage) x (1+r)^T - FV(convenience yield). Convenience yield - the value of having the physical on hand - can push commodity futures below the pure carry price (backwardation).\"]]},\n{id:\"l2m3-alt\",sess:1,kind:\"item\",t:\"alt\",title:\"Vignette 10 - Reading the J-curve (Alternative Investments)\",vig:\"Limited partner Sunita Rao reviews her PE fund's statements. Committed capital 100 million, paid-in 100 million. Distributions to date 60 million; current residual NAV 80 million. The fund is year 6 of 10.\",\nqs:[[\"The fund's DPI, RVPI and TVPI are:\",\"DPI 0.60, RVPI 0.80, TVPI 1.40\",\"DPI 0.75, RVPI 0.80, TVPI 1.55\",\"DPI 0.60, TVPI 1.40, so IRR is 40%\",\"DPI = 60/100 = 0.60; RVPI = 80/100 = 0.80; TVPI = (60+80)/100 = 1.40. TVPI = DPI + RVPI, always. TVPI is a multiple, NOT an IRR - 1.40x says nothing about the years taken.\"],\n[\"The J-curve describes:\",\"Early negative returns from fees and startup costs before portfolio gains emerge, then a rise in later years\",\"The shape of bond yields\",\"Rising fees over fund life\",\"PE funds typically show negative early net returns - management fees on committed capital plus early write-offs precede realizations - then recover as companies mature and exit. Interim TVPI < 1.0 in years 1-3 is normal, not alarming.\"],\n[\"A high RVPI relative to DPI at year 6 tells the LP:\",\"Most value is still unrealized - reported returns rest on the manager's NAV marks, which merit scrutiny\",\"The fund has fully exited\",\"Distributions were mistimed\",\"RVPI 0.8 vs DPI 0.6: over half the value is still on paper. Unrealized NAVs are manager estimates - smooth, sometimes optimistic - so realized-exit quality (DPI) is the harder evidence.\"],\n[\"Comparing this fund's 1.40x TVPI to a benchmark's requires care because:\",\"Private-market multiples ignore the timing of cash flows - IRR and public-market-equivalent (PME) give the missing dimensions\",\"TVPI is always inflated\",\"Benchmarks do not apply to PE\",\"TVPI omits time; IRR embeds it; PME maps interim cash flows onto a public index. A 1.40x over eight years can underperform a simple index investment - all three lenses belong in the review.\"]]},\n{id:\"l2m3-pm\",sess:1,kind:\"item\",t:\"pm\",title:\"Vignette 11 - The efficient frontier's corners (Portfolio Management)\",vig:\"Advisor Tarun Bedi builds a strategic allocation from corner portfolios. Risk-free rate 3%. Corner portfolio 1: expected return 8%, volatility 12%. Corner portfolio 2: expected return 10%, volatility 16%. A client has risk aversion A = 4 in the utility function U = E(r) - 0.005 x A x variance.\",\nqs:[[\"The corner portfolio with the higher Sharpe ratio is:\",\"Portfolio 2 - 0.4375 versus 0.4167\",\"Portfolio 1 - 0.6667 versus 0.6250\",\"They are equal\",\"Sharpe: P1 = (8-3)/12 = 0.4167; P2 = (10-3)/16 = 0.4375. Portfolio 2 lies on the steeper capital allocation line - the better building block when a risk-free asset exists.\"],\n[\"The client's utility from Portfolio 1 is closest to:\",\"5.12%\",\"6.72%\",\"8.00%\",\"U = 8 - 0.005 x 4 x 12^2 = 8 - 0.02 x 144 = 8 - 2.88 = 5.12%. Variance enters in percent-squared units - the 0.005 scaling keeps units consistent.\"],\n[\"The client's utility from Portfolio 2 is closest to:\",\"4.88%\",\"5.12%\",\"6.40%\",\"U = 10 - 0.005 x 4 x 16^2 = 10 - 0.02 x 256 = 10 - 5.12 = 4.88%. Despite the higher Sharpe ratio, this specific client prefers Portfolio 1 - utility captures personal risk aversion, Sharpe does not.\"],\n[\"The correct way to reconcile the Sharpe and utility answers is:\",\"With a risk-free asset, combine P2 (highest Sharpe) with T-bills to reach the client's risk point - dominating either corner held alone\",\"Ignore Sharpe and hold P1\",\"Split 50/50 between P1 and P2\",\"Tobin's separation: the risky sleeve is the maximum-Sharpe portfolio; risk tolerance chooses the blend with the risk-free asset, not the risky mix. The client's utility preference reshapes HOW MUCH risk, not WHICH risky portfolio.\"]]}\n];\n\n// ===================== CFA LEVEL II - MOCK 3, SESSION 2 (11 item sets, 44 questions) =====================\nvar L2_SETS_S6=[\n{id:\"l2m3-ethics2\",sess:2,kind:\"item\",t:\"ethics\",title:\"Vignette 12 - Claiming compliance (Ethics)\",vig:\"Pereira Asset Management wants to claim GIPS compliance. Four decisions come up:\\n\\nA: Whether to define 'the firm' as only the Bangalore equity desk, whose record is strongest, though Pereira also runs a Chennai bond desk.\\n\\nB: Whether to include simulated 'model' accounts in composites.\\n\\nC: Whether hiring a verifier is required before claiming compliance.\\n\\nD: Whether to link composite returns so that a strong five-year window hides a weak recent year by changing the composite's start date.\",\nqs:[[\"Defining the firm as only the Bangalore desk for GIPS purposes is:\",\"Improper if it misleads - the firm definition must reflect the actual organization and cannot be gerrymandered to showcase one desk\",\"Always permitted\",\"Required by GIPS\",\"The definition of the firm is the foundation of compliance: it must be the distinct business entity clients deal with. Carving out the best desk while hiding the rest defeats fair representation and violates the spirit of the standards.\"],\n[\"Simulated or model portfolios in composites are:\",\"Prohibited - composites may contain only actual portfolios; simulated results must be presented separately and labeled as hypothetical\",\"Permitted if labeled\",\"Permitted if under 10% of the composite\",\"Only actual assets enter composites. Backtested or model performance may be shown as supplemental, clearly-labeled hypothetical information - never blended into a composite.\"],\n[\"Third-party verification before claiming GIPS compliance is:\",\"Recommended but not required - compliance is self-declared; verification adds credibility\",\"Mandatory\",\"Forbidden\",\"Verification is voluntary. The claim is a self-declaration of compliance with all requirements; an independent verifier tests that claim, but the standards do not require it.\"],\n[\"Changing the composite start date to hide a weak year violates:\",\"The fair-representation and completeness principles - periods must be consistent and not chosen to flatter\",\"Nothing - start dates are discretionary\",\"Only GIPS advertising rules\",\"Cherry-picking periods misleads as surely as cherry-picking accounts. GIPS requires consistent, disclosed time periods and full histories - a moving start date is survivorship bias in the time dimension.\"]]},\n{id:\"l2m3-quant2\",sess:2,kind:\"item\",t:\"quant\",title:\"Vignette 13 - Teaching the machine (Quantitative Methods)\",vig:\"Quant researcher Amrita Rao builds a machine-learning model to flag earnings-manipulation risk. She has 10,000 labeled firm-years. Her colleague proposes: train on all 10,000, report the in-sample accuracy of 99%, and ship it.\",\nqs:[[\"The standard data split Amrita should insist on is:\",\"Training, validation (for tuning), and a final untouched test set\",\"Training and test only, reused freely\",\"All data for training, since more data is better\",\"The training set fits parameters, the validation set tunes hyperparameters and selects the model, and the test set - touched once - estimates out-of-sample performance. Skipping the split makes reported accuracy meaningless.\"],\n[\"A 99% in-sample accuracy with 55% out-of-sample accuracy is the signature of:\",\"Overfitting - the model memorized noise as if it were signal\",\"A well-specified model\",\"Data leakage that improves validity\",\"Overfit models fit the training sample's idiosyncrasies. The cure: fewer parameters, penalization (LASSO/ridge), cross-validation, more data - not more complexity.\"],\n[\"LASSO penalized regression helps chiefly by:\",\"Shrinking some coefficients to zero, performing feature selection and reducing variance\",\"Increasing R-squared\",\"Removing the need for a test set\",\"LASSO adds an absolute-value penalty that forces weak variables' coefficients to zero - automatic feature selection that trades a little in-sample fit for out-of-sample stability.\"],\n[\"Classifying firms as manipulators or not is an example of:\",\"Supervised learning - labeled outcomes guide the fit\",\"Unsupervised learning\",\"Reinforcement learning\",\"Labeled target (manipulator yes/no) with input features = supervised classification. Clustering firms without labels would be unsupervised; reinforcement learning involves sequential actions and rewards.\"]]},\n{id:\"l2m3-econ2\",sess:2,kind:\"item\",t:\"econ\",title:\"Vignette 14 - Convergence or not (Economics)\",vig:\"Economist Dev Menon briefs a fund on long-run growth. Country X: high savings rate, rapidly rising capital per worker. Country Y: similar institutions but already rich. He is asked about neoclassical convergence, what endogenous growth theory changes, and the roles of TFP versus capital deepening.\",\nqs:[[\"Neoclassical growth theory predicts Country X will:\",\"Grow faster than Y while capital is scarce, then converge toward Y's income level as diminishing returns to capital bite\",\"Permanently outgrow Y\",\"Grow only through population growth\",\"Diminishing returns to capital give poor countries high returns on investment and fast catch-up growth; both economies approach the same steady-state income per worker if institutions and technology access are shared.\"],\n[\"Endogenous growth theory differs chiefly in that:\",\"Sustained growth can come from within the model - knowledge spillovers, R&D and human capital - rather than from unexplained outside technical progress\",\"It denies technology matters\",\"It applies only to rich countries\",\"In endogenous models, investment in knowledge has constant or increasing social returns, so policy (education, R&D incentives, openness) can raise the LONG-RUN growth rate - not just the level path. Neoclassical theory leaves long-run growth to exogenous technology.\"],\n[\"Over decades, the largest share of differences in living standards across countries is attributed to:\",\"Total factor productivity - how effectively inputs are used, not how many are accumulated\",\"Capital stock differences alone\",\"Labor force size\",\"Growth accounting repeatedly finds TFP - technology, institutions, efficiency - dominates cross-country income differences. Capital deepening explains some; productivity explains most.\"],\n[\"A removal of trade barriers in the neoclassical model raises:\",\"The level of income per worker permanently, but not the long-run growth rate\",\"The long-run growth rate permanently\",\"Neither\",\"In the neoclassical model, openness and efficiency gains lift the steady-state LEVEL; the economy transitions faster but returns to the technology-driven growth rate. Only endogenous channels let such reforms change the growth rate itself.\"]]},\n{id:\"l2m3-fra3\",sess:2,kind:\"item\",t:\"fra\",title:\"Vignette 15 - The hyperinflation subsidiary (Financial Statement Analysis)\",vig:\"Hindustan Foods owns a subsidiary in a country whose currency has lost 80% of its value in three years - a hyperinflationary economy. The subsidiary's functional currency is the parent's presentation currency (the rupee). The CFO asks which translation method applies and how remeasurement gains and losses are treated, contrasting with a stable-currency self-sustaining subsidiary.\",\nqs:[[\"The hyperinflationary subsidiary must be translated using:\",\"The temporal (remeasurement) method - monetary items at current rates, non-monetary at historical, differences in profit or loss\",\"The current rate method, with differences in OCI\",\"Any method, disclosed\",\"When the functional currency is the parent's (or the local economy is hyperinflationary), temporal/remeasurement applies: monetary balance-sheet items at the current rate, non-monetary at historical, and the translation gain or loss lands in earnings - volatile P&L is the signature.\"],\n[\"Under the current rate method (self-sustaining foreign operation), translation adjustments go to:\",\"Other comprehensive income, accumulating in the CTA reserve in equity\",\"Profit or loss immediately\",\"Goodwill\",\"All assets and liabilities translate at the current rate, income items at average; the plug difference accumulates in equity as the cumulative translation adjustment - only realized (on disposal) through earnings.\"],\n[\"The translation exposure of the self-sustaining subsidiary is measured by:\",\"Its net asset position - assets minus liabilities exposed to the rate\",\"Its revenue only\",\"Its cash balance\",\"Translation exposure = exposed net assets. A local-currency net ASSET position loses value in the parent's currency when the local currency depreciates; hedging targets the net position, not gross flows.\"],\n[\"Choosing the subsidiary's functional currency correctly matters most because:\",\"It determines the method - and whether translation noise hits earnings or equity\",\"It changes the subsidiary's actual cash flows\",\"It sets the tax rate\",\"Functional currency drives the method: local-functional means current rate + OCI; parent-functional means temporal + P&L. Same economics, very different reported earnings volatility - a frequent exam and practice trap.\"]]},\n{id:\"l2m3-fra4\",sess:2,kind:\"item\",t:\"fra\",title:\"Vignette 16 - Modeling next year (Financial Statement Analysis)\",vig:\"Analyst Joel Mathew builds a financial statement model for Meridian Tools. He projects revenue growth of 8%, a stable gross margin, working capital scaling with sales, and capex at 6% of sales. A senior reviewer asks which items should be driven by revenue, which are discretionary, and how the model should be validated.\",\nqs:[[\"The most defensible driver structure is:\",\"Revenue-driven lines (COGS via margin, working capital, capex as % of sales) plus separately modeled discretionary items (dividends, buybacks, financing)\",\"Everything as a percent of sales\",\"Everything grown at last year's rate\",\"Income statement and working capital flow from the sales forecast and margin structure; financing and payout are management choices modeled separately. Rolling every line at one growth rate hides exactly the dynamics the model exists to reveal.\"],\n[\"The model's interest expense line should be:\",\"Driven by the debt schedule - opening debt, rates, and repayments - creating a circularity usually solved by iteration\",\"Set to zero for simplicity\",\"Grown at the revenue rate\",\"Interest depends on debt, debt depends on funding need, funding need depends on net income after interest - the classic circularity, resolved by iterative calculation or a simple average-debt convention.\"],\n[\"The strongest validation of a finished model is:\",\"Back-testing - driving the model with prior years' assumptions and comparing its outputs with what actually happened\",\"Checking the balance sheet balances\",\"Peer review of formulas only\",\"Balancing is necessary but trivial. Back-testing exposes which assumptions carried predictive value; sensitivity analysis on the key drivers (growth, margin) then maps how wrong the model can be.\"],\n[\"Meridian's forecast horizon for the explicit period should most reasonably be:\",\"Long enough to reach a steady state - typically 3-5 years, after which a terminal approach takes over\",\"Exactly one year\",\"Twenty years\",\"Explicit forecasts are credible only while company-specific assumptions are defensible; beyond that, terminal value (with conservative fade assumptions) carries the valuation. Five-plus years of false precision adds spurious accuracy, not information.\"]]},\n{id:\"l2m3-corp2\",sess:2,kind:\"item\",t:\"corp\",title:\"Vignette 17 - Governing the board (Corporate Issuers)\",vig:\"Trident Engineering's investors push for governance reform. On the table: separating the chair and CEO roles (currently combined), a staggered (classified) board, and a new ESG committee to manage the firm's carbon exposure ahead of tightening regulation.\",\nqs:[[\"Separating the chair and CEO roles primarily:\",\"Strengthens board independence - management stops chairing its own overseer\",\"Reduces the number of directors\",\"Is required by all listing rules\",\"An independent chair prevents the CEO from controlling the agenda and evaluation of their own performance - the classic structural safeguard for shareholder oversight.\"],\n[\"A staggered board, where only a fraction of directors stand for election each year, generally:\",\"Entrenches incumbents - a governance negative, since replacing a board takes multiple election cycles\",\"Improves accountability\",\"Has no governance effect\",\"Classified boards slow activist or acquirer takeovers and dilute annual accountability. They are usually scored as weakening shareholder rights - continuity arguments notwithstanding.\"],\n[\"The strongest business case for the ESG committee's carbon work is:\",\"Managing a real financial exposure - regulatory, transition and reputational risks hit cash flows and the cost of capital\",\"Public relations value only\",\"It substitutes for financial reporting\",\"Material ESG factors are business risks and opportunities. Carbon exposure ahead of regulation affects future costs, asset values and financing terms - integrating it into governance is risk management, not decoration.\"],\n[\"Effective stakeholder management in corporate governance means:\",\"Identifying stakeholder groups and their interests, and managing relationships so long-term firm value is protected\",\"Maximizing only shareholder votes\",\"Meeting every stakeholder demand fully\",\"The framework: identify stakeholders, weigh their legitimate interests (employees, creditors, customers, regulators, community), and balance them against long-term value - ignoring creditors or regulators destroys value as surely as ignoring shareholders.\"]]},\n{id:\"l2m3-equity2\",sess:2,kind:\"item\",t:\"equity\",title:\"Vignette 18 - Industry structure (Equity)\",vig:\"Strategist Alka Deshmukh profiles the domestic paint industry: four firms hold shares of 30%, 30%, 20% and 20%. She runs Porter's five forces, places the industry on its lifecycle, and computes concentration.\",\nqs:[[\"The industry's Herfindahl-Hirschman Index is:\",\"0.26\",\"0.50\",\"1.00\",\"HHI = 0.30^2 + 0.30^2 + 0.20^2 + 0.20^2 = 0.09 + 0.09 + 0.04 + 0.04 = 0.26. Above 0.18 reads as concentrated; 0.26 is an oligopoly, and antitrust authorities would scrutinize further consolidation.\"],\n[\"In Porter's framework, the four-firm structure with differentiated brands most directly affects which force:\",\"Rivalry among existing competitors - few players with differentiation compete on brand and pricing discipline rather than pure volume\",\"Threat of new entrants only\",\"Bargaining power of suppliers\",\"Concentration plus differentiation shapes rivalry: branded oligopolies tend to rational pricing; commodity oligopolies tend to price wars. The five forces are demand- and supply-side maps of who captures the industry's profit pool.\"],\n[\"An industry in the SHAKEOUT stage of its lifecycle is characterized by:\",\"Growth slowing toward economic growth, intensifying competition, and failing marginal players - margins peak and consolidation begins\",\"Explosive growth and no profits\",\"Stable oligopoly with no entry\",\"Lifecycle: embryonic (slow takeoff), growth (fast adoption, falling prices), shakeout (growth slows, weak players exit), mature (consolidation, barriers), decline. The shakeout is where pricing power is decided - a critical point for long-term returns.\"],\n[\"High HHI plus strong brands most likely implies for long-run industry profitability:\",\"Higher sustainable returns on capital - barriers limit entry and discipline pricing\",\"Lower returns, because concentration invites regulation immediately\",\"No relationship\",\"Concentration plus brand barriers keeps the profit pool with incumbents - the structural underpinning of pricing power. Regulation is a risk at extremes, but the economics of an oligopoly with differentiation support above-average returns.\"]]},\n{id:\"l2m3-fi2\",sess:2,kind:\"item\",t:\"fixed\",title:\"Vignette 19 - The mortgage pool (Fixed Income)\",vig:\"Structurer Veena Kulkarni explains a new RMBS deal to investors. A pool of mortgages backs three tranches. She covers prepayment risk (CPR 6% assumed), the difference between PAC and support tranches, and weighted-average measures.\",\nqs:[[\"A CPR of 6% corresponds to a single monthly mortality (SMM) rate of closest to:\",\"0.514%\",\"6.00%\",\"0.50%\",\"SMM = 1 - (1 - CPR)^(1/12) = 1 - 0.94^(1/12) = 1 - 0.99486 = 0.514%. Monthly prepayment compounds to the annual CPR; the simple division 6%/12 = 0.50% understates it.\"],\n[\"Prepayment risk in a pass-through MBS consists of:\",\"Contraction risk when rates fall (faster prepayments shorten the bond) and extension risk when rates rise (slower prepayments lengthen it)\",\"Default risk only\",\"Interest-rate risk identical to a bullet bond\",\"Falling rates trigger refinancings - principal returns early and must be reinvested at low rates (contraction); rising rates slow prepayments, locking the investor in below market (extension). Both make the MBS negatively convex.\"],\n[\"A PAC (planned amortization class) tranche is protected from prepayment variation because:\",\"A support (companion) tranche absorbs the excess or shortfall of prepayments within a PAC band\",\"It holds no mortgages\",\"The government guarantees it\",\"PACs get a schedule protected within a prepayment band; the support tranche takes the variability first. Protection is only as good as the support's size - outside the band, even PACs extend or contract.\"],\n[\"Weighted-average life (WAL) matters more than stated maturity for an MBS because:\",\"Principal returns continuously through the pool's life, so economic life is the average time principal is outstanding\",\"Maturity is illegal to quote\",\"Coupons dominate the cash flows\",\"Mortgages amortize and prepay: principal dribbles in from month one. WAL captures when the average rupee of principal actually returns - prepayment shifts move WAL dramatically while stated maturity stays fixed.\"]]},\n{id:\"l2m3-deriv2\",sess:2,kind:\"item\",t:\"deriv\",title:\"Vignette 20 - The rate cap (Derivatives)\",vig:\"Treasurer Sunil Patil's firm has a 100 million rupee floating-rate loan resetting semi-annually at 6-month MIBOR. He buys an interest-rate cap: strike 6.0%, notional 100 million, semi-annual periods. At the next reset, 6-month MIBOR fixes at 8.0%.\",\nqs:[[\"The cap payoff for that period is closest to:\",\"1.0 million rupees, received at period end\",\"2.0 million paid immediately\",\"Zero - caps only apply above 10%\",\"Cap payoff = notional x max(0, rate - strike) x (days/360 or 0.5) = 100,000,000 x (8% - 6%) x 0.5 = 1.0 million. Caps pay in arrears, at the END of the period the rate was set for.\"],\n[\"Economically, the cap is equivalent to:\",\"A series of European put options on interest rates (call options on the loan rate) - one caplet per reset\",\"A swap\",\"A floor on bond prices\",\"A cap = portfolio of caplets, each a put on the rate for one reset period. Buying a cap while borrowing floating converts the loan's rate exposure to a maximum of the strike plus the premium cost.\"],\n[\"The cap's value is HIGHER when:\",\"Rate volatility is higher - options gain from dispersion regardless of direction\",\"Rates are stable\",\"The strike is higher\",\"Like all options, caplets gain value with volatility. Higher vol raises the chance and size of payoffs above the strike while the downside is floored at zero - the premium rises.\"],\n[\"If Patil also sold a floor at 4.0%, the combined package would:\",\"Form a collar - capping his rate at 6% but giving up benefit below 4%, reducing or eliminating the net premium\",\"Double his protection\",\"Cancel the loan\",\"Cap + short floor = collar: the floor premium finances the cap. His effective rate is boxed between 4% and 6%; below 4% he pays the floor buyer, forfeiting further declines.\"]]},\n{id:\"l2m3-alt2\",sess:2,kind:\"item\",t:\"alt\",title:\"Vignette 21 - The REIT analyst (Alternative Investments)\",vig:\"Analyst Farah Siddiqui values a listed office REIT. Reported net income 50 million rupees, depreciation 30 million, gains on property sales 10 million, maintenance capex and leasing costs 15 million. She also prepares a NAV estimate.\",\nqs:[[\"The REIT's FFO (funds from operations) is closest to:\",\"70 million\",\"50 million\",\"90 million\",\"FFO = net income + depreciation - gains on sales = 50 + 30 - 10 = 70 million. Depreciation is added back (economic depreciation on well-kept buildings is slower), and one-off sale gains are excluded from recurring operations.\"],\n[\"AFFO (adjusted FFO), the better cash proxy, is closest to:\",\"55 million\",\"70 million\",\"40 million\",\"AFFO = FFO - recurring maintenance capex and leasing costs = 70 - 15 = 55 million. FFO overstates distributable cash because buildings need ongoing capital; AFFO is the dividend-capacity number.\"],\n[\"NAV-based valuation of the REIT uses:\",\"Market value of properties minus debt, per share - treating the REIT as a portfolio of assets rather than an earnings stream\",\"Book value of properties\",\"The P/E of the stock\",\"NAV marks the property portfolio to market (usually by cap rates on NOI), nets out debt, and divides by shares. REITs trading at large premiums or discounts to NAV signal sentiment; NAV is the asset-value anchor against the income measures.\"],\n[\"The main criticism of FFO as a valuation base is:\",\"It adds back ALL depreciation even though real properties do consume capital, overstating recurring cash flow\",\"It includes gains on sales\",\"It uses market values\",\"FFO's blanket depreciation add-back ignores the maintenance spending real assets require - which is exactly why AFFO exists. Using FFO multiples without the capex adjustment flatters the REIT's payout capacity.\"]]},\n{id:\"l2m3-pm2\",sess:2,kind:\"item\",t:\"pm\",title:\"Vignette 22 - Pricing with factors (Portfolio Management)\",vig:\"Manager Girish Rao prices a stock with a two-factor model:\\n\\nExpected return = risk-free + beta1 x factor premium 1 + beta2 x factor premium 2\\n\\nRisk-free 5%, factor-1 (market) premium 3%, factor-2 (size) premium 2%. The stock's betas: 1.2 on market, 0.8 on size.\",\nqs:[[\"The stock's expected return is closest to:\",\"10.2%\",\"10.0%\",\"8.6%\",\"5% + 1.2 x 3% + 0.8 x 2% = 5 + 3.6 + 1.6 = 10.2%. Multifactor expected returns are additive in beta-times-premium.\"],\n[\"A factor-mimicking portfolio for the size premium is constructed as:\",\"Long small-cap stocks, short large-cap stocks - a self-financing spread isolating the factor\",\"An equal-weighted index\",\"Long all stocks with any size exposure\",\"Factor-mimicking portfolios isolate one premium: long the favored leg, short the other, zero net investment. The spread's return IS the factor - the foundation of how multifactor betas and premia are estimated.\"],\n[\"The arbitrage pricing theory behind the model assumes:\",\"A few systematic factors price assets, and arbitrage eliminates deviations from the factor relation\",\"Investors are all mean-variance optimizers\",\"Markets are always in equilibrium at every instant\",\"APT needs only: returns generated by systematic factors, well-diversified portfolios, and no arbitrage. It is less demanding than CAPM - no market-portfolio efficiency assumption - and deviations are erased by arbitrage across many assets.\"],\n[\"If the stock's market price implies an expected return of 8.6% while the factor model says 10.2%, an APT trader would:\",\"Buy the stock - it offers more return than its factor risk requires, and the gap should close\",\"Short the stock\",\"Do nothing - models set no prices\",\"Price implying 8.6% < required 10.2% means the stock is cheap for its risk: buy. In diversified, arbitraged markets, factor-required returns discipline prices - persistent gaps attract the arbitrage that closes them.\"]]}\n];\n\n// ===================== CFA LEVEL III - MOCK 1, SESSION 1 (6 item sets + 5 essay sets) =====================\n// Real L3 format: mix of vignette item sets (4 MCQ each) and constructed-response sets (parts with model answers).\nvar L3_SETS_S1=[\n{id:\"l3s1-e-pm-ips\",sess:1,kind:\"essay\",t:\"pm\",title:\"Essay 1 - The Kulkarni family IPS (Private Wealth)\",vig:\"Suresh Kulkarni, 52, and his wife Meena, 49, meet their advisor. Investable assets: 2.5 crore rupees. Annual income 45 lakh, annual living expenses 18 lakh. Two goals:\\n\\n1. Daughter's Germany education: 40 lakh needed in exactly 3 years. They have earmarked 32 lakh of the portfolio for this.\\n2. Retirement at 65 (13 years away), then an estimated 25-year retirement.\\n\\nThe Kulkarnis say: 'We cannot bear the thought of the education money falling short. Otherwise, we are comfortable with market ups and downs for long-term money.' All figures pre-tax; ignore inflation for the calculations.\",\nparts:[{prompt:\"A. Formulate the return objective for the Kulkarnis' investment policy statement. (4 points)\",points:4,model:\"Achieve a total return that (1) funds the 40-lakh education payment in 3 years with high certainty and (2) grows the remaining portfolio sufficiently to support retirement spending over a 13-year accumulation period plus 25 years in retirement, in real terms.\",keys:[\"States the education goal and its 3-year funding need\",\"States the retirement goal with its 13+25 year horizon\",\"Frames return in total-return (or real) terms, not income-only\",\"Links the return requirement to the goals, not a bare percentage\"]},\n{prompt:\"B. Calculate the annualized return required on the earmarked 32 lakh to fully fund the education goal. Show your work. (4 points)\",points:4,model:\"(40 / 32)^(1/3) - 1 = 1.25^(1/3) - 1 = 1.0772 - 1 = 7.72%, about 7.7% per year. Any return at or above roughly 7.7% annually fully funds the goal; below it the earmarked sleeve falls short.\",keys:[\"Sets up (40/32)^(1/3) - 1 or equivalent\",\"Arrives at approximately 7.7%\",\"Notes this is the MINIMUM required return on the earmarked sleeve\"]},\n{prompt:\"C. Identify TWO constraints that must appear in the IPS, with one fact from the case supporting each. (4 points)\",points:4,model:\"Any two of: (1) Time horizon - multi-stage: 3 years to the education payment, then 13 years to retirement, then 25 years of retirement. (2) Liquidity - a known 40-lakh outflow in exactly 3 years; ongoing surplus is 45 - 18 = 27 lakh a year. (3) Taxes - all figures are pre-tax, so tax treatment of returns matters. (4) Unique circumstances - the earmarking of 32 lakh and the stated unwillingness to risk the education money.\",keys:[\"Time horizon: multi-stage (3y education, 13y accumulation, 25y retirement)\",\"Liquidity: 40 lakh due in 3 years (and/or the 27 lakh annual surplus)\",\"Taxes or unique circumstances correctly tied to a case fact\",\"Each constraint is supported by a specific case fact\"]}]},\n{id:\"l3s1-i-pm-aa\",sess:1,kind:\"mcq\",t:\"pm\",title:\"Vignette 1 - Building the strategic allocation (Portfolio Management)\",vig:\"An investment committee is setting a strategic asset allocation for a family portfolio. The analyst presents: mean-variance optimization output where small input changes swing weights wildly; a table of corner portfolios; a resampled-efficiency alternative; and a Black-Litterman implementation anchored on market-cap weights.\",\nqs:[[\"The committee's worry that tiny changes in expected-return inputs swing the optimal weights wildly is best addressed by:\",\"Resampling the efficient frontier or anchoring on market equilibrium (Black-Litterman), both of which tame input sensitivity\",\"Using historical returns only, because they are unbiased\",\"Raising the risk-free rate assumption\",\"MVO is famously input-sensitive ('error maximization'). Resampling averages over input uncertainty; Black-Litterman starts from equilibrium market weights and tilts with views. Historical returns alone worsen the problem - they are the noisiest input.\"],\n[\"A corner portfolio in mean-variance optimization is:\",\"An efficient portfolio where the set of asset classes with positive weights changes - used to trace the whole frontier by combining adjacent corner portfolios\",\"The highest-return portfolio on the frontier\",\"The global minimum-variance portfolio only\",\"Corner portfolios are the efficient portfolios where an asset class enters or leaves the solution. Every point on the (unconstrained) efficient frontier between two adjacent corner portfolios is a combination of those two.\"],\n[\"In Black-Litterman, an investor with NO views holds:\",\"The market-capitalization-weighted portfolio, because equilibrium returns are reverse-engineered from it\",\"Equal weights, because that is neutral\",\"100% in the minimum-variance asset\",\"With no views, BL returns the market portfolio - the model's anchor. Views tilt away from it with confidence-weighted strength. This is the discipline that makes BL outputs stable and intuitive.\"],\n[\"The single most fragile input in mean-variance optimization is generally:\",\"Expected returns\",\"Asset class volatilities\",\"Correlations\",\"Small errors in expected returns dominate errors in variances and correlations and get amplified into extreme weights. That is why practitioners spend their effort on return estimates or avoid raw MVO entirely.\"]]},\n{id:\"l3s1-e-econ-cme\",sess:1,kind:\"essay\",t:\"econ\",title:\"Essay 2 - Setting capital market expectations (Economics)\",vig:\"An economist at a family office sets 10-year capital market expectations. Her building blocks: expected inflation 5.0%; real risk-free rate 2.0%; equity risk premium 4.5%; bond term premium 1.0%; credit spread for high-grade corporates 0.8%.\\n\\nShe writes: 'These are estimates, not facts. The committee should know where they can go wrong before we build portfolios on them.'\",\nparts:[{prompt:\"A. Calculate the expected nominal risk-free rate and the expected return on equities using her building blocks. (4 points)\",points:4,model:\"Nominal risk-free = real risk-free + expected inflation = 2.0% + 5.0% = 7.0%. Expected equity return = 7.0% + 4.5% = 11.5%. (An expected long government bond return would be 7.0% + 1.0% = 8.0%, and high-grade corporates about 8.8%.)\",keys:[\"Nominal risk-free = 2% + 5% = 7%\",\"Equity = 7% + 4.5% = 11.5%\",\"Adds premiums in the correct order (no compounding confusion)\"]},\n{prompt:\"B. Give TWO distinct reasons why her capital market expectations could prove wrong, each with a one-line explanation. (4 points)\",points:4,model:\"Any two of: (1) Model risk - the building-block framework itself may mis-specify how returns are generated. (2) Parameter/estimation risk - inputs like the equity premium are estimated from history with wide error bars. (3) Regime change - structural shifts (policy, technology, demographics) make the past a poor guide. (4) Unexpected shocks - pandemics, wars, crises sit outside any expectation.\",keys:[\"Names model risk or estimation error with a reason\",\"Names regime change/structural break or shocks with a reason\",\"The two reasons are genuinely different, not restatements\"]},\n{prompt:\"C. The committee chair proposes using last year's actual equity return (21%) as the expected return instead. State TWO problems with this. (4 points)\",points:4,model:\"(1) A single realized year mixes expected return with a huge random shock - realized returns are dominated by noise, not signal. (2) It is pro-cyclical anchoring/recency: after a strong year, prices are higher and prospective returns are if anything LOWER, so extrapolating 21% bakes in buying high. Expectations must be forward-looking and grounded in fundamentals (yield + growth + valuation), not last year's print.\",keys:[\"Realized return is expectation plus noise - one year says little about the mean\",\"Identifies recency/anchoring and the buy-high danger\",\"Argues expectations must be forward-looking/fundamental\"]}]},\n{id:\"l3s1-i-deriv-opt\",sess:1,kind:\"mcq\",t:\"deriv\",title:\"Vignette 2 - Options around a holding (Derivatives)\",vig:\"A client holds Zenith stock, currently 100. The advisor prices one-year options: call strike 105 costs 3.00 to buy (you receive 3.00 if you sell); put strike 95 costs 2.00; call strike 100 costs 5.00; call strike 110 costs 2.00.\\n\\nThree overlays are discussed: a covered call (hold stock, sell the 105 call), a protective put (hold stock, buy the 95 put), and a bull call spread (buy the 100 call, sell the 110 call).\",\nqs:[[\"The covered call's maximum gain per share and breakeven are:\",\"Maximum gain 8; breakeven 97\",\"Maximum gain 5; breakeven 103\",\"Unlimited gain; breakeven 100\",\"Covered call = stock + short call. Premium received 3 lowers the cost basis to 97 (breakeven). Upside is capped at the 105 strike: max gain = (105 - 100) + 3 = 8. You trade unlimited upside for 3 of premium.\"],\n[\"The protective put's maximum loss per share is:\",\"7\",\"5\",\"2\",\"Protective put = stock + long 95 put costing 2. Worst case: stock falls below 95, you exercise and sell at 95. Loss = (100 - 95) + 2 premium = 7. The put premium is the insurance cost on top of the 5-point floor gap.\"],\n[\"The bull call spread (buy 100 call at 5, sell 110 call at 2) costs and pays at most:\",\"Cost 3; maximum payoff 10; maximum profit 7\",\"Cost 7; maximum profit 3\",\"Cost 3; unlimited profit\",\"Net cost = 5 - 2 = 3. Above 110 both calls are in the money and the spread is worth exactly 110 - 100 = 10. Profit = 10 - 3 = 7, capped - that is the price of the cheaper entry versus a straight call.\"],\n[\"Compared with simply holding the stock, ALL three overlays share one feature:\",\"Each deliberately reshapes the payoff - giving up some upside or paying premium in exchange for protection or income\",\"Each guarantees a positive return\",\"Each removes all downside risk\",\"Overlays are trade-offs: covered calls sell upside for income, protective puts buy a floor with premium, spreads cap both cost and payoff. None is free and none eliminates risk; they choose WHERE the risk sits.\"]]},\n{id:\"l3s1-e-fixed-ldi\",sess:1,kind:\"essay\",t:\"fixed\",title:\"Essay 3 - Immunizing a known liability (Fixed Income)\",vig:\"A charitable trust owes a single payment of 100 crore rupees in exactly 6 years. The trustee wants to immunize it with government bonds. The 6-year yield to maturity is 7.0% (annual compounding), and the yield curve is not flat.\\n\\nThe trustee asks: how much must be invested today, how the bond portfolio should be built, and what could still go wrong.\",\nparts:[{prompt:\"A. Calculate the amount that must be invested today at 7.0% to fund the 100 crore liability exactly. (4 points)\",points:4,model:\"PV = 100 / 1.07^6 = 100 / 1.5007 = 66.63 crore, about 66.6 crore. Invested at 7%, this grows to exactly 100 crore in 6 years.\",keys:[\"Uses 100 / (1.07)^6\",\"Arrives at approximately 66.6 crore\",\"States the growth logic: PV compounds up to the liability\"]},\n{prompt:\"B. State the TWO conditions the bond portfolio must satisfy to immunize this single liability, and name the portfolio duration required. (4 points)\",points:4,model:\"(1) Present value of assets equals present value of the liability (66.6 crore today). (2) Portfolio Macaulay duration equals the liability's horizon - 6 years here (a single liability's duration is its time to payment). Matching these two makes price risk and reinvestment risk offset each other for small parallel yield moves.\",keys:[\"PV of assets = PV of liability\",\"Duration match: portfolio duration = 6 years (liability horizon)\",\"Recognizes the offset between price risk and reinvestment risk\"]},\n{prompt:\"C. Identify TWO reasons the immunization can still fail in practice. (4 points)\",points:4,model:\"Any two of: (1) Non-parallel yield curve shifts - duration matching protects only against small parallel moves; twists break the hedge (mitigate with dispersion/Key-rate matching). (2) Duration drift - as time passes and yields move, asset and liability durations diverge, so the portfolio needs periodic rebalancing. (3) Default/credit risk if non-government bonds are used. (4) Reinvestment of coupons at rates other than 7%.\",keys:[\"Non-parallel/twisting curve risk (structural risk)\",\"Duration drift requiring rebalancing over time\",\"Credit risk or coupon reinvestment risk as a valid second point\"]}]},\n{id:\"l3s1-i-equity\",sess:1,kind:\"mcq\",t:\"equity\",title:\"Vignette 3 - Choosing an equity approach (Equity)\",vig:\"A family office debates three ways to run its equity sleeve: (1) a passive index fund tracking the broad market; (2) a rules-based fund overweighting value and quality factors ('smart beta'); (3) a concentrated 20-stock active manager with high active share.\\n\\nThe CIO frames the choice with three numbers: market volatility 15%; the factor fund's tracking error 3%; the active manager's tracking error 8%.\",\nqs:[[\"The smart-beta fund's 3% tracking error means:\",\"Its returns are expected to deviate from the index by roughly 3% a year on average - it takes modest, systematic active bets\",\"It will underperform the index by 3% a year\",\"It is 3% correlated with the index\",\"Tracking error is the standard deviation of ACTIVE return (fund minus index). 3% is the footprint of a systematic factor tilt - bigger than passive (near 0), much smaller than a concentrated stock-picker's 8%.\"],\n[\"High active share in the 20-stock manager indicates:\",\"The portfolio's holdings differ greatly from the index - a necessary (not sufficient) condition for earning fees through stock selection\",\"The manager trades frequently\",\"The fund beats the index often\",\"Active share measures how different the holdings are from the benchmark. Closet indexers charge active fees for index-like portfolios - low active share exposes them. High active share only says the bets are real, not that they are right.\"],\n[\"A stated belief that 'cheap, high-quality companies earn more than the market over long horizons' most directly justifies:\",\"The factor fund, because value and quality are documented, rewarded risk factors\",\"The passive fund, because markets are efficient\",\"Concentration in 20 technology stocks\",\"Value and quality are two of the best-evidenced factor premiums. A rules-based long tilt toward them is exactly what smart beta packages - the belief maps to the product. The passive fund expresses no such belief.\"],\n[\"If the family's true goal is 'the market return, cheapest, no manager risk', the honest recommendation is:\",\"The passive index fund - the other two add fees and active risk in exchange for returns above the market that may not materialize\",\"The 20-stock manager, because concentration beats diversification\",\"Splitting equally among all three\",\"When the objective is t
