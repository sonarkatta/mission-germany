ick=\\\"\"+mockTarget+\"\\\">Take a mock exam ›</button>\";\n v.appendChild(acts);\n};\n// (c) Name-question intent: \"What's ur name\" fell through to generic answers (Lena/Arya confusion). Roop answers, wider phrasings.\nvar _v9712Ask=askTutor;\naskTutor=function(txt){\n var e=document.querySelector(\"#chatIn\"),q=String(txt||(e&&e.value)||\"\").trim();\n if(q&&/^(what('| i)?s (ur|your|ya) name|what is (ur|your) name|who are you|(ur|your) name|are you (a )?(teacher|roop)|tumhara naam|tu kaun (hai)?)[?.! ]*$/i.test(q)){\n  if(e)e.value=\"\";S.chat=S.chat||[];S.chat.push({r:\"u\",t:q},{r:\"a\",t:\"I'm Roop, your teacher-friend, Arya. I'm here to help you take the next step with your studies, CFA and German. What would you like to work on?\",k:\"roop-intro\"});S.chat=S.chat.slice(-40);save();tutor();window.scrollTo(0,document.body.scrollHeight);return;\n }\n return _v9712Ask.apply(this,arguments);\n};\n// (d) quickJumps: slim, flush to the right edge, quiet until touched - stops covering list text.\n(function(){var st=document.createElement(\"style\");\nst.textContent=\"#quickJumps{right:0!important;border-radius:20px 0 0 20px!important;padding:3px 2px!important;opacity:.5;transition:opacity .18s}#quickJumps:active,#quickJumps:focus-within,#quickJumps:hover{opacity:1}#quickJumps button{width:30px!important;height:34px!important}\";\ndocument.head.appendChild(st);})();\n// (e) Tutor Listen: speakTutor loaded packs via legacy key-based tutorPackOf() (\"1-qa-*.enc\" = 404),\n// so all 1,020 recorded chapter answers toasted \"voice not ready\" even though the clips exist in the b2 packs.\n// Route through the file-based PACK_OF (correct uploaded pack names) first.\nspeakTutor=function(t,k){\n var f=k&&(typeof AUDIO_MANIFEST!==\"undefined\")&&AUDIO_MANIFEST[k];\n if(!f){speakEn(t);return}\n if(window.AUDIO_MAP&&AUDIO_MAP[f]){playClips([k],function(){speakEn(t)});return}\n var pack=(typeof PACK_OF!==\"undefined\"&&PACK_OF[f])||tutorPackOf(k);\n loadPack(pack).then(function(ok){if(ok&&window.AUDIO_MAP&&AUDIO_MAP[f])playClips([k],function(){speakEn(t)});else speakEn(t)});\n};\n\n// ===================== CFA LEVEL II - MOCK 1, SESSION 1 (11 item sets, 44 questions) =====================\n// Genuine CFA Institute style: vignette + 4 linked questions, 3 options each. Numbers verified.\nvar L2_SETS_S1=[\n{id:\"l2s1-ethics\",t:\"ethics\",title:\"Vignette 1 - Sharma Asset Management (Ethics)\",vig:\"Priya Sharma, CFA, runs equity portfolios at Sharma Asset Management, a mid-sized advisory firm in Mumbai. This month four situations landed on her desk.\\n\\nSituation A: An oversubscribed IPO arrived. Sharma allocated the shares pro-rata across all client accounts for which the stock was suitable, including her own father's account, which is a regular fee-paying client account with the same mandate.\\n\\nSituation B: Sharma directs client trades to broker Zenith. In return Zenith sends her a paid database subscription. Sharma uses the database mainly to research stocks held in OTHER clients' portfolios, not the clients whose commissions paid for it. She has not told any client about the arrangement.\\n\\nSituation C: At a wedding, the CFO of listed firm Arka Textiles told Sharma that Arka will announce a large loss next week. The information is not public.\\n\\nSituation D: Marketing wants to advertise a composite that includes only the firm's three best-performing discretionary accounts from the last five years, and claims GIPS compliance.\",\nqs:[[\"In Situation B, Sharma's use of the database subscription most likely:\",\"Violates Standard III(A) - Loyalty, Prudence and Care, because client brokerage must benefit the client whose trades generated it\",\"Is acceptable, because all of her clients eventually benefit from her research\",\"Violates Standard I(C) - Misrepresentation, because the database was a gift\",\"Client-directed brokerage (soft commissions) may only be used when the research directly benefits the client whose commissions paid for it, and must be disclosed. Using it for other clients breaches the duty of loyalty to the paying client.\"],\n[\"In Situation C, if Sharma sells Arka shares from client accounts before the announcement, she:\",\"Violates Standard II(A) - Material Nonpublic Information, even though she heard it socially\",\"Does not violate the Standards, because the information was not obtained through work\",\"Violates only Standard IV(C) - Responsibilities of Supervisors\",\"Trading on material nonpublic information violates Standard II(A) regardless of how or where it was obtained. A wedding conversation does not launder the information.\"],\n[\"The composite in Situation D most likely:\",\"Violates GIPS, because composites must include all actual fee-paying discretionary portfolios managed to a similar strategy, not a selection of winners\",\"Complies with GIPS, because three accounts is enough to form a composite\",\"Complies if the disclosure states that only three accounts are included\",\"Cherry-picking the best accounts is the classic GIPS composite violation. All fee-paying discretionary portfolios following the strategy must be included to avoid survivorship and selection bias.\"],\n[\"In Situation A, allocating IPO shares pro-rata including her father's account is:\",\"Acceptable under Standard III(B) - Fair Dealing, because the account is a bona fide client on the same terms as others\",\"A violation, because family accounts must always be excluded\",\"A violation, because IPO shares must go to the largest accounts first\",\"Fair dealing requires treating clients equitably, not excluding family accounts that are proper fee-paying clients with the same mandate. Pro-rata allocation with the father's account treated like any other client is exactly compliant.\"]]},\n{id:\"l2s1-quant\",t:\"quant\",title:\"Vignette 2 - Return drivers (Quantitative Methods)\",vig:\"Analyst Rohan Mehta regresses the monthly excess returns of a mid-cap fund on three factors - market, size and value - using 60 months of data. He reports:\\n\\nNumber of observations n = 60; independent variables k = 3; R-squared = 0.42; Durbin-Watson statistic = 2.90.\\n\\nMehta says: 'The residuals look randomly scattered around zero at first, but I noticed the spread of the residuals widens sharply in high-volatility months. I have not tested this formally yet. I also plan to use adjusted R-squared when comparing this model with a simpler one-factor model.'\",\nqs:[[\"The F-statistic for testing whether ALL three slope coefficients are jointly zero is closest to:\",\"13.5\",\"4.2\",\"27.0\",\"F = (R-sq/k) / ((1-R-sq)/(n-k-1)) = (0.42/3) / (0.58/56) = 0.14 / 0.010357 = 13.52.\"],\n[\"The model's adjusted R-squared is closest to:\",\"0.39\",\"0.42\",\"0.45\",\"Adjusted R-sq = 1 - (1-R-sq)(n-1)/(n-k-1) = 1 - 0.58 x 59/56 = 1 - 0.611 = 0.389. It is always at or below R-squared and punishes extra variables that do not add explanatory power.\"],\n[\"A Durbin-Watson statistic of 2.90 most likely indicates:\",\"Negative serial correlation in the residuals\",\"Positive serial correlation in the residuals\",\"No serial correlation in the residuals\",\"DW is approximately 2(1-r) where r is the residual autocorrelation. DW = 2.9 implies r is about -0.45, i.e. negative serial correlation. DW near 2 means no autocorrelation; well below 2 means positive.\"],\n[\"If the widening residual spread Mehta noticed is conditional heteroskedasticity, the most likely consequence is:\",\"Coefficient estimates stay unbiased, but standard errors are wrong, so t-tests and F-tests become unreliable\",\"The slope coefficients become biased and inconsistent\",\"R-squared becomes zero\",\"Heteroskedasticity does not bias the OLS coefficient estimates themselves; it corrupts the estimated standard errors, so significance tests mislead. The fix is robust (White-corrected) standard errors.\"]]},\n{id:\"l2s1-econ\",t:\"econ\",title:\"Vignette 3 - Rupee-euro desk (Economics)\",vig:\"Neha Kulkarni covers currencies for a treasury desk. She notes: EUR/USD spot = 1.1000 (US dollars per one euro). One-year risk-free rates: United States 5.0%, euro area 3.0% (both annual, compounded once a year).\\n\\nA client asks Kulkarni: (1) where the one-year forward should trade if covered interest rate parity holds; (2) whether a quoted one-year forward of 1.1400 offers an arbitrage; (3) whether borrowing euros to buy dollars is a sensible carry trade; and (4) what uncovered interest parity implies for the euro if the rate gap stays.\",\nqs:[[\"Under covered interest rate parity, the fair one-year EUR/USD forward is closest to:\",\"1.1214\",\"1.0790\",\"1.1400\",\"F = S x (1+r_price)/(1+r_base) = 1.1000 x 1.05/1.03 = 1.1214. The lower-yielding currency (EUR, 3%) trades at a forward premium equal to the rate gap.\"],\n[\"A quoted forward of 1.1400 most likely lets an arbitrageur:\",\"Sell EUR forward at 1.1400, buy EUR spot at 1.1000 funded by borrowing USD, and lend the EUR at 3% - locking a riskless profit\",\"Buy EUR forward, because the forward is too cheap\",\"Do nothing, because 1.1400 is the parity price\",\"The market forward (1.1400) is richer than parity (1.1214), so the euro is overpriced forward: sell it forward. Spot purchase + EUR lending hedges the delivery, financed by USD borrowing. The locked margin is the gap between 1.1400 and the fair 1.1214.\"],\n[\"Kulkarni's carry trade (borrow EUR at 3%, invest in USD at 5%) is most profitable if the euro:\",\"Appreciates by less than about 2% over the year\",\"Appreciates by more than 2% over the year\",\"Falls exactly by the forward discount of the dollar\",\"The carry trade earns the 2% rate gap. It loses money only if the funding currency (EUR) appreciates against the dollar by more than that gap - which is exactly what uncovered interest parity expects on average, which is why carry is a risk premium, not free money.\"],\n[\"Under uncovered interest rate parity, the US dollar is expected over time to:\",\"Depreciate against the euro by roughly the 2% interest differential\",\"Appreciate against the euro by roughly 2%\",\"Stay at 1.1000, because parity fixes the spot rate\",\"UIP says the higher-yielding currency is expected to depreciate by the interest differential, offsetting its yield advantage. USD yields 2% more, so it is expected to lose about 2% against EUR.\"]]},\n{id:\"l2s1-fra1\",t:\"fra\",title:\"Vignette 4 - Alpha's stake in Beta (Financial Statement Analysis)\",vig:\"On 1 January, Alpha Industries buys 30% of Beta Chemicals for 300 million rupees in cash and gains significant influence (two board seats). For the year, Beta reports net income of 100 million and pays total dividends of 20 million.\\n\\nAlpha's CFO asks how the stake appears under the equity method, and what changes if Alpha instead owned 55% of Beta. Beta's shares are not listed.\",\nqs:[[\"The income Alpha recognizes from Beta for the year is closest to:\",\"30 million\",\"6 million\",\"100 million\",\"Equity method: the investor books its share of the investee's net income - 30% x 100 = 30 million - on one line of its income statement. Dividends received are NOT income under this method.\"],\n[\"The carrying value of the investment on Alpha's year-end balance sheet is closest to:\",\"324 million\",\"330 million\",\"300 million\",\"Start 300 + share of income 30 - share of dividends (30% x 20 = 6) = 324 million. Dividends reduce the investment account because they return part of the investee's book value.\"],\n[\"If Alpha owned 55% of Beta instead, Alpha would most likely:\",\"Consolidate Beta fully - adding 100% of Beta's assets, liabilities, revenues and expenses to its own\",\"Keep using the equity method, just with a bigger percentage\",\"Recognize only 55% of Beta's revenues\",\"Ownership above 50% normally means control, and control requires full consolidation (with a non-controlling interest line for the other 45%). The equity method is for significant influence, roughly 20-50%.\"],\n[\"A key feature of the equity method is that:\",\"It is a one-line consolidation - Beta's individual revenues and expenses never enter Alpha's income statement\",\"Alpha reports 30% of each of Beta's revenue and expense lines\",\"Beta's income only appears when dividends are paid\",\"Under the equity method, the investee's results flow into a single income line and a single balance-sheet line. Proportional consolidation of each line item is not permitted.\"]]},\n{id:\"l2s1-fra2\",t:\"fra\",title:\"Vignette 5 - Meridian's pension plan (Financial Statement Analysis)\",vig:\"Meridian Tools sponsors a defined-benefit pension plan. At year-end the actuary proposes two changes: raise the discount rate used for the pension obligation from 7.0% to 7.5%, and (for its US GAAP books) raise the expected long-term return on plan assets from 6.5% to 7.0%.\\n\\nThe CFO asks: what happens to the projected benefit obligation (PBO), to pension expense, and where actuarial gains and losses go under IFRS.\",\nqs:[[\"Raising the discount rate from 7.0% to 7.5% will:\",\"Decrease the PBO, because future pension promises are discounted more heavily\",\"Increase the PBO, because the plan earns more\",\"Leave the PBO unchanged, because benefits are fixed by formula\",\"The PBO is the present value of promised benefits. A higher discount rate shrinks that present value, improving the plan's funded status on paper without any real cash change.\"],\n[\"Under US GAAP, raising the expected return on plan assets from 6.5% to 7.0% will:\",\"Lower reported pension expense, because a higher expected return offsets service and interest cost\",\"Raise the PBO\",\"Have no effect on any reported number\",\"US GAAP nets the EXPECTED (not actual) return on plan assets against pension cost in P&L, so a higher assumed return flatters earnings. It does not change the PBO, which depends on the discount rate, salary growth and service.\"],\n[\"Under IFRS, actuarial gains and losses (remeasurements) on the pension plan are:\",\"Recorded in other comprehensive income and never recycled through profit or loss\",\"Amortized through earnings over employees' remaining service lives\",\"Ignored until the plan is settled\",\"IFRS sends remeasurements - actuarial gains/losses and the gap between actual and expected asset returns - straight to OCI with no recycling. US GAAP instead allows corridor amortization through earnings.\"],\n[\"The components of periodic pension cost in profit or loss are most accurately:\",\"Current service cost plus net interest cost, minus the expected (US GAAP) or discount-rate-based (IFRS) return on plan assets\",\"Contributions paid into the plan during the year\",\"Benefits paid to retirees during the year\",\"Pension cost is an accrual concept: service cost for the year plus net interest on the net liability, net of the expected/discount-rate return on assets. Cash contributions and benefit payments move the plan's funding, not the P&L charge.\"]]},\n{id:\"l2s1-corp\",t:\"corp\",title:\"Vignette 6 - Leverage at Nandi Foods (Corporate Issuers)\",vig:\"Nandi Foods is an all-equity company worth 500 million rupees. Its board is weighing a recapitalization: issue 100 million of perpetual debt at 6% and use the cash to repurchase shares. The tax rate is 30%. Nandi earns operating income of 60 million a year and currently has 10 million shares outstanding, so the shares trade at 50 each.\\n\\nThe board also asks for a ranking of financing choices the theory suggests for a profitable firm, and which theory says an 'optimal' debt level exists at all.\",\nqs:[[\"Under Modigliani-Miller with corporate taxes only, the value of Nandi after issuing the 100 million of debt is closest to:\",\"530 million\",\"500 million\",\"600 million\",\"V_L = V_U + t x D = 500 + 0.30 x 100 = 530 million. The tax shield on debt adds 30 million of value under MM with taxes.\"],\n[\"After the recapitalization announcement, Nandi's share price should move to approximately:\",\"53, because the 30 million tax-shield gain accrues to the original shareholders over 10 million shares\",\"50, because MM says capital structure is irrelevant\",\"60, because debt is cheaper than equity\",\"MM with taxes says value rises by 30 million. That gain belongs to the shareholders who hold the 10 million shares before the repurchase: 500+30 = 530 million of equity value pre-buyback, or 53 per share.\"],\n[\"The static trade-off theory of capital structure says a firm's optimal debt level is where:\",\"The marginal tax-shield benefit of one more unit of debt equals its marginal expected cost of financial distress\",\"Debt is maximized, because interest is tax-deductible\",\"Debt is zero, because distress costs always dominate\",\"Trade-off theory balances the tax shield against rising expected distress costs; the optimum is an interior point where the marginal effects are equal. MM with taxes alone says all-debt; adding distress costs creates the interior optimum.\"],\n[\"Under the pecking-order theory, a profitable firm like Nandi prefers to finance new investment with:\",\"Retained earnings first, then debt, and new equity only as a last resort\",\"New equity first, because it carries no repayment obligation\",\"Debt first, because it is cheapest\",\"Pecking order follows information costs: internal funds need no disclosure, debt is next, and issuing equity sends the strongest negative signal, so it comes last.\"]]},\n{id:\"l2s1-equity\",t:\"equity\",title:\"Vignette 7 - Valuing Kaveri Pipes (Equity)\",vig:\"An analyst values Kaveri Pipes using free cash flow to the firm. Forecast: FCFF is 120 million this year and grows 8% for the next three years (years 1-3), then 4% forever. WACC is 10%. Net debt is 300 million. Shares outstanding: 50 million.\\n\\nShe also warns her team that the answer moves sharply with two inputs in particular.\",\nqs:[[\"The estimated total firm value is closest to:\",\"2,316 million\",\"1,850 million\",\"2,850 million\",\"FCFF1=129.6, FCFF2=139.97, FCFF3=151.17. Terminal value at end of year 3 = 151.17 x 1.04 / (0.10-0.04) = 2,620.2. Discount at 10%: 129.6/1.1 = 117.8; 139.97/1.21 = 115.7; (151.17+2,620.2)/1.331 = 2,082.2. Sum = 2,315.7 million.\"],\n[\"The estimated equity value per share is closest to:\",\"40.3\",\"46.3\",\"34.3\",\"Equity value = firm value - net debt = 2,315.7 - 300 = 2,015.7 million. Per share: 2,015.7 / 50 = 40.31. Forgetting to subtract net debt (which would give 46.3) is the classic FCFF mistake.\"],\n[\"If WACC rises from 10% to 11% while growth assumptions hold, Kaveri's value will:\",\"Fall materially, because both the discount factors and the terminal value shrink\",\"Rise, because higher returns are required\",\"Stay the same, because growth is unchanged\",\"A higher discount rate cuts every cash flow's present value AND widens the (WACC - g) denominator gap in reverse - the terminal value falls especially hard. These two are the model's most sensitive inputs.\"],\n[\"The terminal value in this model is most sensitive to:\",\"The spread between WACC and the long-run growth rate\",\"The exact level of year-1 FCFF\",\"The number of shares outstanding\",\"TV = FCFF x (1+g)/(WACC-g). The denominator is a difference of two close numbers (0.10 - 0.04 = 0.06), so a one-point move in either input swings the value by a large percentage. Shares outstanding only scale the per-share answer.\"]]},\n{id:\"l2s1-fixed\",t:\"fixed\",title:\"Vignette 8 - Reading the curve (Fixed Income)\",vig:\"A bond desk observes annual-pay government spot rates: 1-year = 4.0%, 2-year = 5.0%, 3-year = 5.5%.\\n\\nA trainee must price a 3-year, 6% annual-coupon bond (face 100) off these spots, derive the implied one-year forward rate starting one year from now, and explain what the curve's shape implies about forwards versus spots.\",\nqs:[[\"The implied 1-year forward rate one year from now, f(1,1), is closest to:\",\"6.0%\",\"5.0%\",\"5.5%\",\"f(1,1) = (1.05^2 / 1.04) - 1 = 1.1025/1.04 - 1 = 6.01%. The two-year path must equal two one-year paths: (1.04)(1+f) = (1.05)^2.\"],\n[\"The arbitrage-free price of the 3-year, 6% coupon bond is closest to:\",\"101.5\",\"100.0\",\"103.2\",\"PV = 6/1.04 + 6/1.05^2 + 106/1.055^3 = 5.769 + 5.442 + 90.272 = 101.48. Each cash flow is discounted at ITS OWN spot rate, never the 3-year yield for all of them.\"],\n[\"With this upward-sloping spot curve, implied forward rates are:\",\"Above the spot rates, because later spot rates average in higher forwards\",\"Below the spot rates, because forwards discount the future\",\"Equal to the spot rates, by no-arbitrage\",\"Each longer spot rate is a geometric average of the short rate and the forwards before it. For the average to rise along the curve, the forwards being averaged in must sit above the spots - as 6.01% sits above both 4% and 5%.\"],\n[\"If the same 6% bond traded in the market at 99 instead of about 101.5, an arbitrageur would most likely:\",\"Buy the bond and strip/replicate the cash flows short at the spot curve for a riskless gain\",\"Sell the bond short, because yields must rise\",\"Do nothing, because 99 is fair under liquidity preference\",\"Arbitrage-free pricing is enforceable: if the bond is cheaper than the replicating portfolio of zeros implied by the spot curve, buy the bond, sell the replicating zeros, and pocket the difference with matched cash flows.\"]]},\n{id:\"l2s1-deriv\",t:\"deriv\",title:\"Vignette 9 - Forwards on Zenith Auto (Derivatives)\",vig:\"Zenith Auto's shares trade at 500. The stock will pay a 10 dividend in six months. The one-year risk-free rate is 5% (annual compounding); six-month money can be borrowed at the same flat curve.\\n\\nA client holds a long forward on 10,000 Zenith shares struck three months ago at 490 with nine months left to run. Separately, the desk quotes a 3x6 FRA at 5%; in three months the actual 3-month reference rate fixes at 6%.\",\nqs:[[\"The no-arbitrage one-year forward price on Zenith today is closest to:\",\"515\",\"510\",\"505\",\"F = (S0 - PV(dividends)) x (1+r)^T = (500 - 10/1.05^0.5) x 1.05 = (500 - 9.76) x 1.05 = 514.8. Known cash income lowers the forward price because the forward holder does not receive the dividend.\"],\n[\"After the stock rises to 540, the value of the client's existing long forward (strike 490, nine months left) is:\",\"Positive - the right to buy at 490 when the market trades higher is worth money\",\"Zero, because forwards always have zero value\",\"Negative, because the stock may fall back\",\"A forward is worth zero only at initiation. Once the underlying moves, the contract holds value: longs gain when the spot rises above what the carry-adjusted strike implies. Value = S - PV(div) - PV(K).\"],\n[\"On the 3x6 FRA, when the reference rate fixes at 6% versus the 5% contract rate:\",\"The long (the party that fixed its borrowing rate) receives a settlement payment\",\"The long pays, because rates rose\",\"No money moves, because FRAs settle only at maturity\",\"A long FRA is protection against rising rates. When the fixing (6%) exceeds the contract rate (5%), the seller compensates the long for the extra 1% of interest, discounted to the start of the loan period.\"],\n[\"Compared with an identical forward, an exchange-traded futures contract generally has:\",\"Daily mark-to-market cash flows and much lower counterparty credit risk\",\"Higher credit risk because of the clearing house\",\"No settlement until expiry in all cases\",\"Futures are standardized, margined and settled daily through a clearing house, which largely removes counterparty risk. Forwards are private, customized and settle once at expiry, leaving both sides exposed.\"]]},\n{id:\"l2s1-alt\",t:\"alt\",title:\"Vignette 10 - Venture round at MedSpark (Alternative Investments)\",vig:\"A venture capital fund is pricing a Series A round in MedSpark, a medical-devices startup. Expected exit value in 5 years: 500 million rupees. The fund requires a 40% IRR. The fund will invest 20 million.\\n\\nA colleague also asks about carried interest in the fund's buyout sister vehicle: 20% carry over an 8% hurdle, European-style (whole-fund) waterfall. And the board wants the three classic levers of LBO value creation listed for a memo.\",\nqs:[[\"The post-money valuation implied by the VC method is closest to:\",\"93 million\",\"83 million\",\"120 million\",\"Post-money = exit value / (1+IRR)^n = 500 / 1.4^5 = 500 / 5.3782 = 92.97 million. The VC method discounts the EXIT value at the venture rate, which is far above WACC to price risk and dilution.\"],\n[\"The fund's required ownership share for its 20 million investment is closest to:\",\"21.5%\",\"25.0%\",\"17.2%\",\"Ownership = investment / post-money = 20 / 92.97 = 21.5%. Pre-money is 92.97 - 20 = 72.97 million, so the founders keep the other 78.5%.\"],\n[\"With a European (whole-fund) waterfall, the 20% carried interest is paid:\",\"Only after limited partners have received back all contributed capital plus the 8% preferred return on the whole fund\",\"On each profitable deal as it exits, even if later deals lose money\",\"On gross fund value regardless of the hurdle\",\"European waterfalls are LP-protective: carry comes last, after ALL capital and the preferred return are returned. American (deal-by-deal) waterfalls pay carry earlier and need clawbacks if later deals sour.\"],\n[\"The three classic drivers of LBO value creation are:\",\"Debt paydown from free cash flow, operating/margin improvement, and exit multiple expansion\",\"Buying at any price, because leverage magnifies all returns\",\"Paying special dividends, cutting investment, and multiple contraction\",\"LBO equity returns come from (1) paying down acquisition debt with the company's cash flows, (2) genuinely improving operations, and (3) selling at a higher multiple than the entry multiple. Leverage alone transfers risk; it is not a source of value by itself.\"]]},\n{id:\"l2s1-pm\",t:\"pm\",title:\"Vignette 11 - Two-factor world (Portfolio Management)\",vig:\"A portfolio strategist models stock returns with two priced factors: factor 1 (business-cycle surprises, risk premium 6%) and factor 2 (inflation surprises, risk premium 3%). The risk-free rate is 4%.\\n\\nStock X has factor betas of 1.2 and -0.5 respectively. The strategist also holds stock Y, which has exactly the same two betas as X but currently offers an expected return of only 8.0% in the market.\",\nqs:[[\"Under the arbitrage pricing theory model, the required expected return on stock X is closest to:\",\"9.7%\",\"10.9%\",\"7.3%\",\"E(R) = Rf + b1 x RP1 + b2 x RP2 = 4 + 1.2 x 6 + (-0.5) x 3 = 4 + 7.2 - 1.5 = 9.7%. A negative beta to a positive-premium factor LOWERS the required return - the stock hedges that risk.\"],\n[\"Stock Y (same betas as X, expected return 8.0% versus the model's 9.7%) most likely offers:\",\"An arbitrage: buy X-style exposure and sell Y short in matched factor weights, capturing the 1.7% gap with no net factor risk\",\"No opportunity, because markets price correctly by definition\",\"A reason to buy Y, because it is cheaper than X\",\"APT's engine is the law of one price: two exposures with identical factor betas must earn the same expected return. A persistent 1.7% gap with zero net factor exposure is exactly the arbitrage the theory is named for.\"],\n[\"In this framework, stock X's factor beta of 1.2 is best interpreted as:\",\"The stock's sensitivity to surprises in factor 1 - a one-unit surprise moves the stock's return about 1.2 units\",\"The stock's correlation with factor 1\",\"The contribution of factor 1 to the stock's total variance\",\"A factor beta measures sensitivity to unexpected changes in that factor, holding the other factor constant. It is a regression slope on the surprise, not a correlation and not a variance share.\"],\n[\"Compared with the CAPM, the APT/multifactor approach:\",\"Allows several sources of systematic risk to carry their own prices, with no single market portfolio assumption\",\"Requires the market portfolio to be mean-variance efficient\",\"Assumes all investors hold identical portfolios\",\"Multifactor models drop the CAPM's single priced factor and its strong assumptions (one market portfolio, identical investors). Systematic risks are priced separately; only idiosyncratic risk remains unpriced.\"]]}\n];\n\n// ===================== CFA LEVEL II - MOCK 1, SESSION 2 (11 item sets, 44 questions) =====================\nvar L2_SETS_S2=[\n{id:\"l2s2-ethics\",t:\"ethics\",title:\"Vignette 12 - Duties in practice (Ethics)\",vig:\"Marcus D'Souza, CFA, advises pension funds at a trust company. Three matters arise this quarter.\\n\\nMatter 1: A pension client holds 2% of a listed company whose management is proposing to cut the dividend to fund an acquisition D'Souza believes will destroy value. D'Souza must decide how to vote the client's proxies.\\n\\nMatter 2: D'Souza's firm receives free Bloomberg terminals from a broker in exchange for routing all client trades through that broker. Execution quality has not been reviewed in two years.\\n\\nMatter 3: D'Souza's marketing deck shows his personal account's three-year return as 'client performance,' net of fees, with a footnote that it is his own money.\",\nqs:[[\"In Matter 1, D'Souza's duty under Standard III(A) - Loyalty, Prudence and Care is to vote the proxies:\",\"In the pension beneficiaries' best interests - against the acquisition if his analysis says it destroys value\",\"With company management, to preserve the business relationship\",\"Only after getting each beneficiary's written instructions\",\"Proxy voting is a client asset. Votes must be cast for the beneficiaries' benefit after a cost-benefit review; automatic support for management (or abstaining out of convenience) breaches the duty of loyalty.\"],\n[\"Matter 2 most likely violates the Standards because:\",\"Client brokerage buys services that benefit the manager rather than the client, and execution quality was never verified\",\"Terminals are research, and research is always permitted\",\"The arrangement is fine as long as commissions are low\",\"Soft commissions must buy research that benefits the client making the trades, and the manager must seek best execution. Two years without an execution review fails that duty outright.\"],\n[\"In Matter 3, the deck is:\",\"A violation of Standard III(D) - Performance Presentation, because a personal account is not client performance\",\"Acceptable, because the footnote discloses the account is his own\",\"Acceptable if the return is net of fees\",\"Presenting a personal account as 'client performance' misleads prospective clients about the manager's actual record managing client money. A footnote does not cure a misleading headline claim.\"],\n[\"If D'Souza later leaves the firm, he may take with him:\",\"His own knowledge, skills and memories - but no client lists, records or work product without permission\",\"The client files he personally created\",\"The firm's models, because he improved them\",\"Standard IV(A) - Loyalty (to employer): departing employees keep their skills and experience, not the employer's confidential records, client lists or proprietary tools, absent consent.\"]]},\n{id:\"l2s2-quant\",t:\"quant\",title:\"Vignette 13 - Modeling inflation (Quantitative Methods)\",vig:\"An economist fits an AR(1) model to quarterly inflation: x(t) = b0 + b1 x(t-1) + error. Estimated coefficients: b0 = 2.0, b1 = 0.60, both significant. Residual autocorrelations are insignificant.\\n\\nA rival analyst fits the same series but gets b1 = 1.01. The team must choose between the two models using out-of-sample root mean squared error (RMSE), and debate whether the series is covariance stationary.\",\nqs:[[\"The mean-reverting level implied by the AR(1) estimates is:\",\"5.0\",\"2.0\",\"3.3\",\"Mean-reverting level = b0 / (1 - b1) = 2.0 / (1 - 0.60) = 5.0. Inflation is pulled toward 5%: forecasts converge there because b1 is below 1.\"],\n[\"With current inflation at 8.0%, the AR(1) model's forecast for next quarter is closest to:\",\"6.8%\",\"8.0%\",\"5.0%\",\"Forecast = b0 + b1 x current = 2.0 + 0.60 x 8.0 = 6.8%. The gap to the mean-reverting level (3 points) shrinks by the 0.6 coefficient each quarter.\"],\n[\"The rival estimate b1 = 1.01 implies the series:\",\"Has a unit root - it is a random walk with drift-like behavior, not covariance stationary, and AR(1) forecasts are invalid\",\"Is perfectly covariance stationary\",\"Will revert to its mean twice as fast\",\"If b1 = 1 (or statistically indistinguishable from 1, like 1.01), the process has a unit root: shocks never die out, there is no mean to revert to, and the series must be first-differenced before AR modeling.\"],\n[\"The right way to choose between the two models is:\",\"Compare out-of-sample RMSE - lower forecast error on data the model did not see wins\",\"Pick the higher in-sample R-squared\",\"Pick the model with more parameters\",\"In-sample fit always rewards complexity. Out-of-sample RMSE tests what matters for a forecasting model - how well it predicts data it has never seen.\"]]},\n{id:\"l2s2-econ\",t:\"econ\",title:\"Vignette 14 - Growth accounting (Economics)\",vig:\"A country desk studies Nationland. Output grew 6.0% last year, the capital stock grew 4.0%, and labor input grew 2.0%. The production function is Cobb-Douglas with capital's share alpha = 0.35.\\n\\nThe desk head asks: how much growth came from total factor productivity, whether a poorer neighbor can grow faster, and what ultimately drives living standards per person.\",\nqs:[[\"Total factor productivity (TFP) growth - the Solow residual - is closest to:\",\"3.3%\",\"6.0%\",\"1.5%\",\"Growth accounting: gY = TFP + alpha x gK + (1-alpha) x gL. TFP = 6.0 - 0.35 x 4.0 - 0.65 x 2.0 = 6.0 - 1.4 - 1.3 = 3.3%.\"],\n[\"Under the neoclassical convergence hypothesis, a poorer neighbor with similar institutions should:\",\"Grow faster than Nationland, because capital's diminishing returns give poor countries higher marginal returns to investment\",\"Grow slower, because rich countries have better technology\",\"Grow at the same rate, because growth is random\",\"Diminishing returns to capital mean each additional unit of capital adds more output where capital is scarce. Similar savings rates and institutions then let poor economies catch up - conditional convergence.\"],\n[\"In steady state, sustained growth in output PER WORKER comes only from:\",\"Growth in total factor productivity\",\"Ever-rising savings rates\",\"Population growth\",\"With diminishing returns, capital deepening exhausts itself: the capital-labor ratio stops rising. Only technology/TFP keeps raising output per worker permanently in the neoclassical model.\"],\n[\"Cobb-Douglas with alpha = 0.35 implies that a 1% rise in the capital stock, other things equal, raises output by:\",\"0.35%\",\"1.0%\",\"0.65%\",\"Alpha is capital's output elasticity: percentage change in output per 1% change in capital, holding labor and technology constant. Labor's elasticity is 1 - alpha = 0.65.\"]]},\n{id:\"l2s2-fra\",t:\"fra\",title:\"Vignette 15 - Translating Europa GmbH (Financial Statement Analysis)\",vig:\"Orion Ltd, an Indian parent reporting in rupees, owns Europa GmbH, a German subsidiary. Orion must decide Europa's functional currency. Facts: Europa sets its own prices in euros, buys and pays workers in euros, and finances itself with euro debt; it rarely sends cash home.\\n\\nThis year the euro WEAKENED 8% against the rupee. Europa holds large euro receivables and euro inventory carried at cost.\",\nqs:[[\"Europa's functional currency is most likely:\",\"The euro, because its operations, pricing, costs and financing are all euro-denominated and self-contained\",\"The rupee, because the parent reports in rupees\",\"Whichever currency produces the smoother earnings\",\"The functional currency is the currency of the primary economic environment: where the entity generates and expends cash. Autonomous euro operations mean the euro; the parent's presentation currency is a separate choice.\"],\n[\"With the euro as functional currency, Orion translates Europa's statements into rupees using the:\",\"Current rate method - assets and liabilities at the closing rate, equity at historical rates, translation differences to OCI\",\"Temporal method, with all gains and losses in net income\",\"Average rate for every balance sheet line\",\"When the subsidiary is self-contained (functional = local currency), the current rate method applies and translation adjustments bypass earnings into OCI - insulating reported profit from exchange swings.\"],\n[\"The 8% euro depreciation then produces a:\",\"Negative translation adjustment in OCI, with no direct hit to net income\",\"Translation loss in net income equal to 8% of assets\",\"Gain in net income, because the rupee strengthened\",\"Under the current rate method, a weaker euro shrinks the rupee value of Europa's net assets; the offsetting entry is a negative cumulative translation adjustment in OCI - equity, not earnings, absorbs it.\"],\n[\"If instead Europa were a mere sales shell with the rupee as functional currency, its euro RECEIVABLES under the temporal method would be:\",\"Translated at the closing rate, with the exchange loss from the weaker euro in net income\",\"Translated at the historical rate of each sale\",\"Left in euros until collected\",\"The temporal method translates monetary items (cash, receivables, payables) at the current rate and non-monetary items at historical rates, with translation gains and losses in earnings - so a weaker euro hits profit directly.\"]]},\n{id:\"l2s2-corp\",t:\"corp\",title:\"Vignette 16 - Pricing a new project (Corporate Issuers)\",vig:\"Arka Cement wants the required return on a new packaging-machinery project - outside its core cement business. It finds a pure-play packaging firm with an equity beta of 1.30 and debt-to-equity of 0.50. Arka will fund the project at a debt-to-equity of 0.80. The tax rate is 30% for both firms. The risk-free rate is 5% and the market risk premium is 6%.\",\nqs:[[\"The pure-play's asset (unlevered) beta is closest to:\",\"0.96\",\"1.30\",\"0.87\",\"Asset beta = equity beta / (1 + (1-t) x D/E) = 1.30 / (1 + 0.70 x 0.50) = 1.30 / 1.35 = 0.963. Strip out the comparable's financial leverage to get the pure business risk.\"],\n[\"The project equity beta for Arka, relevered at its own 0.80 D/E, is closest to:\",\"1.50\",\"1.30\",\"1.16\",\"Relever: 0.963 x (1 + 0.70 x 0.80) = 0.963 x 1.56 = 1.502. Same business risk, more financial leverage, so shareholders bear more risk than the pure-play's own shareholders do.\"],\n[\"The project's required return on equity is closest to:\",\"14.0%\",\"12.8%\",\"11.0%\",\"CAPM: 5% + 1.502 x 6% = 5 + 9.01 = 14.0%. Using Arka's cement-division beta instead would misprice a project whose risk belongs to packaging.\"],\n[\"The most important lesson of this pure-play exercise is:\",\"Each project's discount rate must reflect that project's own business risk and financing, not the company's blended WACC\",\"One company-wide WACC should discount every project\",\"The comparable's equity beta can be used directly\",\"Using a single corporate WACC over-accepts risky projects and over-rejects safe ones. The pure-play method builds the rate bottom-up: unlever a comparable, relever for the project's own financing.\"]]},\n{id:\"l2s2-equity1\",t:\"equity\",title:\"Vignette 17 - Earnings beyond the charge (Equity)\",vig:\"An analyst values Surya Textiles with residual income. Book value per share is 100. The firm earns a stable ROE of 15%; the required return on equity is 10%; and residual income is expected to fade only via growth: the residual-income stream grows 5% a year forever.\\n\\nA junior asks why the shares can be worth more than book, and what persistent factors (persistence factors) do to the answer.\",\nqs:[[\"Residual income per share this year is:\",\"5\",\"15\",\"10\",\"RI = (ROE - r) x B0 = (0.15 - 0.10) x 100 = 5. The firm earns 15 on equity but shareholders only require 10 - the excess 5 is economic profit.\"],\n[\"The estimated value per share is closest to:\",\"205\",\"150\",\"115\",\"Single-stage residual income: V = B0 + RI1 / (r - g). Next year's RI = 5 x 1.05 = 5.25, so V = 100 + 5.25 / (0.10 - 0.05) = 100 + 105 = 205. The shares are worth double book value because high-ROE growth is genuinely valuable.\"],\n[\"Surya trades above book value primarily because:\",\"Its ROE persistently exceeds its required return - economic profit is positive\",\"Its book value is understated\",\"Its dividend yield is high\",\"P/B above 1 is the signature of ROE > r. If ROE equaled the required return, residual income would be zero and value would equal book. The premium IS the present value of future economic profits.\"],\n[\"A lower persistence factor (competition erodes the excess ROE faster) would:\",\"Reduce the valuation premium over book value\",\"Increase the premium, because profits arrive sooner\",\"Have no effect, because ROE is given\",\"Persistence measures how long economic profits survive competitive attack. Faster fade means fewer years of positive residual income, so less value above book - the premium shrinks toward zero.\"]]},\n{id:\"l2s2-equity2\",t:\"equity\",title:\"Vignette 18 - Multiples on the desk (Equity)\",vig:\"Two comparable manufacturers sit on an analyst's screen. Firm A: payout ratio 40%, sustainable growth 6%, required return 11%. Firm B: identical fundamentals, but currently trades at a P/E of 12.\\n\\nThe desk must also pick the right multiple for a leveraged buyout screen and explain when P/E misleads.\",\nqs:[[\"Firm A's justified (fundamental) P/E is closest to:\",\"8.5\",\"6.7\",\"10.6\",\"Justified P/E = payout x (1+g) / (r - g) = 0.40 x 1.06 / (0.11 - 0.06) = 0.424 / 0.05 = 8.48. The multiple is completely explained by payout, growth and required return.\"],\n[\"Firm B, with identical fundamentals but a market P/E of 12, is most likely:\",\"Overvalued relative to fundamentals - its price embeds more growth or lower risk than stated\",\"Undervalued, because 12 is below the market average\",\"Fairly valued, because P/E is always near 12\",\"Same payout, growth and required return imply the same justified P/E of about 8.5. Trading at 12 means the market is paying for something the fundamentals do not support - a sell signal absent new information.\"],\n[\"For comparing takeover candidates with very different capital structures, the most robust multiple is:\",\"EV/EBITDA, because enterprise value strips out how each firm happens to be financed\",\"P/E, because earnings are what shareholders get\",\"P/B, because book value is stable\",\"P/E inherits each firm's leverage through interest expense and share count. EV/EBITDA compares the whole operating business, debt included in value and excluded from the earnings base - apples to apples across capital structures.\"],\n[\"P/E most seriously misleads when:\",\"Earnings are negative, near zero, or inflated by one-off gains and aggressive accruals\",\"The company pays no dividend\",\"The stock has recently risen\",\"A P/E on a tiny or negative EPS is meaningless (the ratio explodes or inverts), and one-off items contaminate the denominator. That is when analysts move to P/CF, EV/EBITDA or normalized earnings.\"]]},\n{id:\"l2s2-fixed\",t:\"fixed\",title:\"Vignette 19 - Convexity at the margin (Fixed Income)\",vig:\"A portfolio holds bond P with modified duration 7.0 and convexity 60. The manager also holds callable bond C trading near its call price, and a putable bond U. The desk is stress-testing a parallel 100 bp move in yields, both up and down.\",\nqs:[[\"The estimated percentage price change in bond P for a 100 bp RISE in yields is closest to:\",\"-6.7%\",\"-7.0%\",\"-7.3%\",\"Percent change = -duration x dy + 0.5 x convexity x dy^2 = -7.0 x 0.01 + 0.5 x 60 x 0.0001 = -7.0% + 0.30% = -6.7%. Convexity softens the loss.\"],\n[\"For a 100 bp FALL in yields, bond P's estimated gain is:\",\"+7.3%\",\"+7.0%\",\"+6.7%\",\"-7.0 x (-0.01) + 0.5 x 60 x 0.0001 = +7.0% + 0.30% = +7.3%. Positive convexity means the gain on the way down exceeds the loss on the way up - the asymmetry investors pay for.\"],\n[\"Callable bond C, trading near its call price as yields fall, most likely exhibits:\",\"Negative convexity - price appreciation is capped because the issuer will call the bond\",\"Extra positive convexity\",\"The same price behavior as an option-free bond\",\"When falling rates push the price toward the call price, the issuer's option to redeem suppresses further gains: the price-yield curve flattens or bends inward - negative convexity. Duration estimates then overstate upside.\"],\n[\"For bonds with embedded options, the correct risk measure is:\",\"Effective duration, computed by shocking the curve while letting the option model change expected cash flows\",\"Macaulay duration, because it uses exact cash flow dates\",\"Modified duration, because it is yield-based\",\"Macaulay and modified duration assume fixed cash flows - false when calls and puts can reroute them. Effective duration re-prices the bond under shifted curves with the option model alive, capturing the changed cash flows.\"]]},\n{id:\"l2s2-deriv\",t:\"deriv\",title:\"Vignette 20 - Parity and the tree (Derivatives)\",vig:\"A trader watches a one-year call on Meridian stock: strike 105, price 8.00. The stock trades at 100, and the one-year risk-free rate is 4%. The corresponding one-year put (strike 105) is quoted at 7.00.\\n\\nSeparately, she builds a one-period binomial tree for a different stock: S0 = 100, up factor u = 1.20, down factor d = 0.85, risk-free rate 3% for the period, and a call struck at 100.\",\nqs:[[\"Put-call parity implies the fair price of the strike-105 put is closest to:\",\"8.96\",\"7.00\",\"13.00\",\"P = C - S + X/(1+r)^T = 8 - 100 + 105/1.04 = 8 - 100 + 100.96 = 8.96. The quoted 7.00 is roughly 2 too cheap - an arbitrage: buy the put and the stock, short the call, borrow the present value of the strike.\"],\n[\"The risk-neutral up probability in the binomial tree is closest to:\",\"0.514\",\"0.500\",\"0.585\",\"Pi = (1 + r - d) / (u - d) = (1.03 - 0.85) / (1.20 - 0.85) = 0.18 / 0.35 = 0.514. Risk-neutral probabilities come from rates and factors only - never from anyone's view of where the stock is heading.\"],\n[\"The one-period binomial value of the at-the-money call is closest to:\",\"10.0\",\"20.0\",\"8.6\",\"Up payoff = max(120 - 100, 0) = 20; down payoff = 0. Call = (0.514 x 20 + 0.486 x 0) / 1.03 = 10.286 / 1.03 = 9.99.\"],\n[\"The key insight behind risk-neutral pricing is:\",\"The option's payoff can be replicated with stock plus borrowing, so its price must equal the replication cost - investor risk preferences drop out\",\"Investors are actually indifferent to risk in the real world\",\"Option prices are set by regulators\",\"No-arbitrage replication - a hedge portfolio of delta shares plus borrowing that matches every payoff - forces the option price. Risk-neutral probabilities are just the algebraic device that computes the same number.\"]]},\n{id:\"l2s2-alt\",t:\"alt\",title:\"Vignette 21 - Bricks and yields (Alternative Investments)\",vig:\"An investor compares buying a small office building directly with buying units of a listed REIT that owns similar buildings. The building produces net operating income (NOI) of 12 million rupees a year, expected to be stable. The market capitalization rate for such properties is 8%.\\n\\nShe also wants the main risks of direct ownership listed, and why two appraisers can produce two different values for the same building.\",\nqs:[[\"The direct capitalization value of the building is closest to:\",\"150 million\",\"96 million\",\"120 million\",\"Value = NOI / cap rate = 12 / 0.08 = 150 million. The cap rate is the market's income yield for this risk - dividing NOI by it converts one year's income into a price.\"],\n[\"If market cap rates compress to 7% while NOI holds at 12 million, the building's value:\",\"Rises to about 171 million - lower yields mean higher prices for the same income\",\"Falls, because buyers demand more income\",\"Stays at 150 million, because NOI is unchanged\",\"Value = 12 / 0.07 = 171.4 million. Property values move inversely with cap rates just as bonds move inversely with yields - this is the dominant driver of direct real estate returns in stable-income markets.\"],\n[\"Compared with direct ownership, the listed REIT mainly offers:\",\"Liquidity, small-ticket diversification and professional management - at the cost of stock-market price volatility and less control\",\"Guaranteed returns linked to property appraisals\",\"Complete insulation from equity market swings\",\"Direct property is illiquid, lumpy and management-intensive; REIT units trade daily and spread risk across many buildings. But their prices move with equity markets, sometimes far from the underlying property values.\"],\n[\"Two appraisers valuing the same building often disagree mainly because:\",\"Valuation depends on judgment-laden inputs - the chosen cap rate, comparable sales, vacancy and NOI forecasts\",\"One of them must be using the wrong formula\",\"Appraisals are updated too frequently\",\"The income and sales-comparison approaches both rest on subjective inputs: which comparables, what cap rate, what NOI forecast. Small input differences produce materially different values - one reason appraisal-based returns look smoother than reality.\"]]},\n{id:\"l2s2-pm\",t:\"pm\",title:\"Vignette 22 - Risk in one number? (Portfolio Management)\",vig:\"A 50-million-rupee equity portfolio has expected annual return 12%, volatility 16%, and beta 1.1. The risk-free rate is 4%. The risk officer reports a one-day 5% value at risk of 2.5 million, computed by parametric and historical methods.\\n\\nThe investment committee wants the numbers interpreted correctly and asks which performance ratio fits which purpose.\",\nqs:[[\"The one-day 5% VaR of 2.5 million is correctly interpreted as:\",\"A 5% chance the portfolio loses MORE than 2.5 million on any given day - VaR says nothing about how bad that tail day gets\",\"A guarantee that losses cannot exceed 2.5 million on 95% of days, with a cap beyond that\",\"The expected loss on the worst 5% of days\",\"VaR is a threshold, not a tail average: 1 day in 20 the loss exceeds it, by an amount VaR does not reveal. The average loss beyond the threshold is expected shortfall - a different, more conservative measure.\"],\n[\"The portfolio's Sharpe ratio is:\",\"0.50\",\"0.75\",\"0.44\",\"Sharpe = (Rp - Rf) / sigma = (12 - 4) / 16 = 0.50. It prices total risk - appropriate when this portfolio is the investor's whole risky position.\"],\n[\"The portfolio's Treynor ratio is approximately:\",\"0.073\",\"0.50\",\"0.089\",\"Treynor = (Rp - Rf) / beta = 8% / 1.1 = 0.0727. It prices only systematic risk - the right yardstick for one fund inside a well-diversified total portfolio, where idiosyncratic risk is diversified away.\"],\n[\"Choosing between Sharpe and Treynor depends on:\",\"Whether the portfolio being judged carries the investor's whole risk (Sharpe) or is one piece of a diversified whole (Treynor)\",\"Whether returns are normally distributed\",\"The size of the portfolio in rupees\",\"Total risk matters when diversification is absent; only beta matters when idiosyncratic risk is diversified away. Same fund, two valid ratios - the context of the investor's other holdings picks the right one.\"]]}\n];\n\n// ===================== v97.13: Level II/III item-set mock engine =====================\n// Real CFA L2/L3 format: case vignette + 4 linked questions, 44 per session, 2 sessions x 2 h 12 min.\nvar MOCKL_CFG={2:{mins:132,per:44,total:88,name:\"Level II\",tlabel:\"2 h 12 min\"},3:{mins:132,per:44,total:88,name:\"Level III\",tlabel:\"2 h 12 min\"}};\nfunction mocklExpand(sets){var out=[];sets.forEach(function(s){s.qs.forEach(function(a){out.push({q:a[0],opts:[a[1],a[2],a[3]],a:0,why:a[4],t:s.t,_vig:s.vig,_set:s.title})})});return out}\nfunction buildMockL(lvl,seed){\n var all=(lvl===2?L2_SETS_S1.concat(L2_SETS_S2):((typeof L3_SETS_S1!==\"undefined\")?L3_SETS_S1.concat(L3_SETS_S2):[]));\n var r=RNG(seed*104729+13);\n var byS={1:[],2:[]};all.forEach(function(s){byS[s.sess||(s.id.indexOf(\"s1\")>=0?1:2)].push(s)});\n var shuf=function(arr){arr=arr.slice();for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}return arr};\n return {s1:mocklExpand(shuf(byS[1]).slice(0,11)),s2:mocklExpand(shuf(byS[2]).slice(0,11))};\n}\nfunction examStartL(lvl,seed){var m=buildMockL(lvl,seed);var cfg=MOCKL_CFG[lvl];\n EX={lvl:lvl,cfg:cfg,seed:lvl*1000+seed,sess:1,all:m,qs:m.s1,idx:0,ans:{},flags:{},end:Date.now()+cfg.mins*60*1000,scores:null};\n examPersist();examRender()}\n// Persist/resume learn the level so an interrupted L2/L3 mock rebuilds from the right bank.\nexamPersist=function(){S.exam=EX?{seed:EX.seed,sess:EX.sess,idx:EX.idx,ans:EX.ans,flags:EX.flags,end:EX.end,drill:EX.drill||null,topic:EX.topic||null,lvl:EX.lvl||0}:null;save()};\nexamResume=function(){var s=S.exam;var m=s.lvl?buildMockL(s.lvl,s.seed-s.lvl*1000):buildMock(s.seed);\n EX={lvl:s.lvl||0,cfg:s.lvl?MOCKL_CFG[s.lvl]:null,seed:s.seed,sess:s.sess,all:m,qs:s.sess===1?m.s1:m.s2,idx:s.idx,ans:s.ans||{},flags:s.flags||{},end:s.end,scores:s.scores||null};\n examRender()};\n// examRender: vignette card above the question when the item belongs to a case set; level-aware header.\nexamRender=function(grid){if(!EX)return mock();examStop();examTimer=setInterval(examTick,1000);examTick();\n var q=EX.qs[EX.idx],t=CFA_TOPICS.find(function(x){return x.id===q.t});\n var shuffled=q._sh||(q._sh=shuffleOpts(q));\n var cfg=EX.cfg;\n var label=cfg?(cfg.name+\" Mock \"+(EX.seed-EX.lvl*1000)):(\"Mock \"+EX.seed);\n view().innerHTML=`<div class=\"exam-top\"><span class=\"ex-timer\" id=\"exT\">
