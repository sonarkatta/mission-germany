<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mission">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mission Germany</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-flag">🎯</div>
    <h1>Mission Germany</h1>
    <p class="gate-sub">Arya's prep companion</p>
    <input type="password" id="gateInput" placeholder="Password" autocomplete="off" enterkeyhint="go">
    <button id="gateBtn">Unlock</button>
    <p class="gate-sub" id="gateStatus" style="min-height:20px;margin:10px 0 0"></p>
    <p class="gate-err" id="gateErr"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="today" class="tab active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.8M12 19.2V21M4.6 4.6l1.3 1.3M18.1 18.1l1.3 1.3M3 12h1.8M19.2 12H21M4.6 19.4l1.3-1.3M18.1 5.9l1.3-1.3"/></svg><span class="tab-l">Today</span></button>
    <button data-tab="roadmap" class="tab"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span class="tab-l">Path</span></button>
    <button data-tab="cfa" class="tab"><svg viewBox="0 0 24 24"><path d="M6.5 2.5H20v19H6.5A2.5 2.5 0 0 1 4 19V5a2.5 2.5 0 0 1 2.5-2.5z"/><path d="M20 17.5H6.5A2.5 2.5 0 0 0 4 20"/></svg><span class="tab-l">CFA</span></button>
    <button data-tab="german" class="tab"><svg viewBox="0 0 24 24"><path d="M5 21V3.5"/><path d="M5 4.5c4-1.8 8 1.8 12 0v8.5c-4 1.8-8-1.8-12 0"/></svg><span class="tab-l">German</span></button>
    <button data-tab="more" class="tab"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg><span class="tab-l">More</span></button>
  </nav>
</div>

<!-- CELEBRATION -->
<div id="celebrate" class="hidden">
  <div class="confetti"></div>
  <div class="celebrate-card">
    <div class="celebrate-emoji">🎉</div>
    <h2 id="celebrateTitle">Day complete!</h2>
    <p id="celebrateText"></p>
    <button onclick="hideCelebrate()">Keep going</button>
  </div>
</div>

<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw,silent){
  try{
    const st=document.getElementById("gateStatus");if(st)st.textContent="Downloading your app - first time takes a minute...";
    const o=await (await fetch("13-app.enc?v=49")).json();
    if(st)st.textContent="Unlocking - one moment";
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(o.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt","encrypt"]);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(o.i)},key,b64(o.d));
    const code=new TextDecoder().decode(buf);
    localStorage.setItem("mg_pw",pw);window.MG_KEY=key;
    const s=document.createElement("script");s.textContent=code+"\n"+"// Audio startup: keep the media element in the document, explicitly load sources,\n// and never label a rejected or stalled play attempt as an endless download.\nPLAYER._failure=function(err){if(!this.a)return;clearTimeout(this._watch);this.icon();const tt=document.getElementById('pTime');if(tt)tt.textContent=err&&err.name==='NotAllowedError'?'Tap play to start audio':'Audio did not start. Tap play to retry.';this._needsRetry=true;};\nPLAYER._watchStart=function(){clearTimeout(this._watch);const a=this.a;this._watch=setTimeout(()=>{if(this.a===a&&a&&a.readyState<2){this._failure({name:'StalledAudio'});}},7000);};\nPLAYER.mount=function(file,t){const a=this.a;if(!a)return;this._file=file;this._resumeAt=t||0;this._needsRetry=false;\n a.muted=false;a.preload='auto';a.setAttribute('playsinline','');\n if(!a.parentNode){a.style.display='none';document.body.appendChild(a);}\n a.onloadedmetadata=()=>{if(this.a!==a)return;if(t>0.5){try{a.currentTime=t}catch(e){}}this.paint(a.currentTime,a.duration);};\n a.oncanplay=()=>{if(this.a===a){clearTimeout(this._watch);this.paint(a.currentTime,a.duration);}};\n a.onplaying=()=>{if(this.a===a){clearTimeout(this._watch);this._needsRetry=false;this.icon();}};\n a.onerror=()=>this._failure(a.error);\n a.src=AUDIO_MAP[file];a.load();this._watchStart();\n const p=a.play();if(p)p.catch(e=>this._failure(e));};\nconst _oldPlayerToggle=PLAYER.toggle;\nPLAYER.toggle=function(){if(this.mode!=='mp3')return _oldPlayerToggle.call(this);const a=this.a;if(!a)return;\n if(this._needsRetry||a.readyState<2){this._needsRetry=false;const t=this._resumeAt||0;this.mount(this._file,t);return;}\n if(a.paused){this._watchStart();const p=a.play();if(p)p.catch(e=>this._failure(e));}else a.pause();this.icon();};\nconst _oldPlayerClose=PLAYER.close;\nPLAYER.close=function(){clearTimeout(this._watch);return _oldPlayerClose.call(this);};\n"+"\n;for(const f in PACK_OF){if(PACK_OF[f]===\"1-tut-core.enc\")PACK_OF[f]=\"14-1-tut-core.enc\"};for(const f in PACK_OF){if(f.startsWith(\"a1u\"))PACK_OF[f]=\"16-2-course-a1-p1.enc\";if(f.startsWith(\"cfa-pm-\")){const n=parseInt(f.slice(7));PACK_OF[f]=n<=2?\"21-1-cfa-l1a.enc\":n<=4?\"19-1-cfa-l1b.enc\":\"20-1-cfa-l2.enc\"}};const _tpo=tutorPackOf;tutorPackOf=k=>k.startsWith(\"qa-\")?_tpo(k):\"14-1-tut-core.enc\";startApp();";document.body.appendChild(s);
    document.getElementById("gate").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
    (async()=>{window.AUDIO_MAP=window.AUDIO_MAP||{};const packs=["2-audio.enc",  "14-1-tut-core.enc","16-2-course-a1-p1.enc","21-1-cfa-l1a.enc","19-1-cfa-l1b.enc","20-1-cfa-l2.enc", "9-cfa-a.enc", "10-cfa-b.enc", "2-cfa-c1.enc", "3-cfa-c2.enc", "4-cfa-d.enc", "1-cfa-e1.enc", "2-cfa-e2.enc", "1-cfa-f1.enc", "2-cfa-f2.enc", "3-cfa-f3.enc", "1-cfa-g1.enc", "2-cfa-g2.enc", "2-cfa-h1.enc", "3-cfa-h2.enc", "5-cfa-h3.enc", "6-cfa-h4.enc", "1-cfa-i1.enc", "1-cfa-i2.enc", "1-cfa-i3.enc", "1-cfa-i4.enc", "1-cfa-i5.enc", "1-cfa-j1.enc", "1-cfa-j2.enc", "1-cfa-j3.enc", "1-cfa-k1.enc", "1-cfa-k2.enc", "1-cfa-l1.enc", "1-cfa-l2.enc"];
      await loadPack(packs[0]);
      for(let i=1;i<packs.length;i+=4)await Promise.all(packs.slice(i,i+4).map(loadPack));})();
  }catch(e){const st=document.getElementById("gateStatus");if(st)st.textContent="";localStorage.removeItem("mg_pw");if(!silent)document.getElementById("gateErr").textContent="That password is not right. Try again.";}
}
function _primeA(){try{window._pa=new Audio();window._pa.muted=true;const p=window._pa.play();if(p)p.then(()=>{window._pa.pause();window._pa.muted=false;window._pa.currentTime=0}).catch(()=>{})}catch(e){}}
document.getElementById("gateBtn").onclick=()=>{_primeA();unlock(document.getElementById("gateInput").value.trim())};
document.getElementById("gateInput").addEventListener("keydown",e=>{if(e.key==="Enter"){_primeA();unlock(e.target.value.trim())}});
const saved=localStorage.getItem("mg_pw");if(saved)unlock(saved,true);
</script>
</body>
</html>
