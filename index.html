<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Mission Germany</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-flag">🎯</div>
    <h1>Mission Germany</h1>
    <p class="gate-sub">Arya's prep companion</p>
    <input type="password" id="gateInput" placeholder="Password" autocomplete="off" enterkeyhint="go">
    <button id="gateBtn">Unlock</button>
    <p class="gate-err" id="gateErr"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="today" class="tab active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="tab-l">Today</span></button>
    <button data-tab="roadmap" class="tab"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span class="tab-l">Path</span></button>
    <button data-tab="cfa" class="tab"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="tab-l">CFA</span></button>
    <button data-tab="german" class="tab"><svg viewBox="0 0 24 24"><path d="M4 21V4"/><path d="M4 4h13l-2.5 4L17 12H4"/></svg><span class="tab-l">German</span></button>
    <button data-tab="more" class="tab"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span class="tab-l">More</span></button>
  </nav>
</div>

<!-- CELEBRATION -->
<div id="celebrate" class="hidden">
  <div class="confetti"></div>
  <div class="celebrate-card">
    <div class="celebrate-emoji">🎉</div>
    <h2 id="celebrateTitle">Day complete!</h2>
    <p id="celebrateText"></p>
    <button onclick="hideCelebrate()">Keep going</button>
  </div>
</div>

<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw,silent){
  try{
    const o=await (await fetch("app.enc?v=7")).json();
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(o.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt","encrypt"]);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(o.i)},key,b64(o.d));
    const code=new TextDecoder().decode(buf);
    localStorage.setItem("mg_pw",pw);window.MG_KEY=key;
    const s=document.createElement("script");s.textContent=code+"\n;startApp();";document.body.appendChild(s);
    document.getElementById("gate").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
    (async()=>{try{const ao=await (await fetch("audio.enc?v=2")).json();
      const ab=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ao.i)},key,b64(ao.d));
      const dv=new DataView(ab);const hl=dv.getUint32(0);
      const head=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,4,hl)));
      window.AUDIO_MAP={};for(const n in head){const e=head[n];window.AUDIO_MAP[n]=URL.createObjectURL(new Blob([ab.slice(4+hl+e[0],4+hl+e[0]+e[1])],{type:"audio/mpeg"}))}
    }catch(e){/* audio bundle optional */}})();
  }catch(e){localStorage.removeItem("mg_pw");if(!silent)document.getElementById("gateErr").textContent="That password is not right. Try again.";}
}
function _primeA(){try{window._pa=new Audio();window._pa.muted=true;const p=window._pa.play();if(p)p.then(()=>{window._pa.pause();window._pa.muted=false;window._pa.currentTime=0}).catch(()=>{})}catch(e){}}
document.getElementById("gateBtn").onclick=()=>{_primeA();unlock(document.getElementById("gateInput").value.trim())};
document.getElementById("gateInput").addEventListener("keydown",e=>{if(e.key==="Enter"){_primeA();unlock(e.target.value.trim())}});
const saved=localStorage.getItem("mg_pw");if(saved)unlock(saved,true);
</script>
</body>
</html>
