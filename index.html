<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070818">
<title>Mission Germany</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-flag">🎯</div>
    <h1>Mission Germany</h1>
    <p class="gate-sub">Arya's prep companion</p>
    <input type="password" id="gateInput" placeholder="Password" autocomplete="off" enterkeyhint="go">
    <button id="gateBtn">Unlock</button>
    <p class="gate-err" id="gateErr"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <main id="view"></main>
  <nav id="tabbar">
    <button data-tab="today" class="tab active"><span>🌅</span>Today</button>
    <button data-tab="roadmap" class="tab"><span>🗺️</span>Path</button>
    <button data-tab="cfa" class="tab"><span>📚</span>CFA</button>
    <button data-tab="german" class="tab"><span>🇩🇪</span>German</button>
    <button data-tab="tutor" class="tab"><span>💬</span>Tutor</button>
    <button data-tab="more" class="tab"><span>✨</span>More</button>
  </nav>
</div>

<!-- CELEBRATION -->
<div id="celebrate" class="hidden">
  <div class="confetti"></div>
  <div class="celebrate-card">
    <div class="celebrate-emoji">🎉</div>
    <h2 id="celebrateTitle">Day complete!</h2>
    <p id="celebrateText"></p>
    <button onclick="hideCelebrate()">Keep going</button>
  </div>
</div>

<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw,silent){
  try{
    const o=await (await fetch("app.enc?v=1")).json();
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(o.s),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(o.i)},key,b64(o.d));
    const code=new TextDecoder().decode(buf);
    localStorage.setItem("mg_pw",pw);
    const s=document.createElement("script");s.textContent=code+"\n;startApp();";document.body.appendChild(s);
    document.getElementById("gate").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
  }catch(e){localStorage.removeItem("mg_pw");if(!silent)document.getElementById("gateErr").textContent="That password is not right. Try again.";}
}
document.getElementById("gateBtn").onclick=()=>unlock(document.getElementById("gateInput").value.trim());
document.getElementById("gateInput").addEventListener("keydown",e=>{if(e.key==="Enter")unlock(e.target.value.trim())});
const saved=localStorage.getItem("mg_pw");if(saved)unlock(saved,true);
</script>
</body>
</html>
